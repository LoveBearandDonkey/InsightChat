    component.edges.forEach((edge) => indegree.set(edge.target, (indegree.get(edge.target) || 0) + 1));
    const byTime = (a, b) => (REAL_TRACE_TASK_BY_ID[a]?.start || 0) - (REAL_TRACE_TASK_BY_ID[b]?.start || 0) || a.localeCompare(b);
    const ready = [...component.ids].filter((id) => !indegree.get(id)).sort(byTime);
    const ordered = [];
    while (ready.length) {
      const id = ready.shift();
      ordered.push(id);
      component.edges.filter((edge) => edge.source === id).forEach((edge) => {
        indegree.set(edge.target, indegree.get(edge.target) - 1);
        if (!indegree.get(edge.target)) { ready.push(edge.target); ready.sort(byTime); }
      });
    }
    [...component.ids].sort(byTime).forEach((id) => { if (!ordered.includes(id)) ordered.push(id); });
    return { ...component, ordered };
  }

  function taskLaneLabel(task) {
    const path = lanePath(task.laneId);
    if (!path.length) return task.laneId;
    if (task.kind === 'python') return 'PyTorch (CPU)';
    if (task.kind === 'cann') return 'PyTorch (CPU) / runtime / CANN';
    if (task.kind === 'device') return 'Ascend Hardware / ' + path[path.length - 1].label;
    if (task.kind === 'communication') return 'Communication / ' + path[path.length - 1].label.replace(' Group / ', ' / ');
    if (task.kind === 'overlap') return 'Overlap Analysis / ' + path[path.length - 1].label;
    return path.map((lane) => lane.label).join(' / ');
  }

  // 调用链节点上方的路径:不做任何缩写,从泳道树根到叶子逐级拼全。
  function taskLaneFullPath(task) {
    const path = lanePath(task.laneId);
    return path.length ? path.map((lane) => lane.label).join(' / ') : task.laneId;
  }

  function taskKindLabel(task) {
    return ({ python: 'CPU 接口', cann: 'CANN 下发', device: 'NPU 任务', communication: '通信任务', overlap: '分析区间', idle: '空闲区间' })[task.kind] || '任务';
  }

  function taskExplanation(task) {
    if (task.kind === 'python') return 'CPU 框架接口，发起算子或通信调用';
    if (task.kind === 'cann') return 'CANN Runtime 接收并下发设备任务';
    if (task.kind === 'device') return 'NPU Stream 上执行的硬件任务';
    if (task.kind === 'communication') return '通信平面执行对应 HCCL 任务';
    if (task.kind === 'overlap') return '计算与通信重叠分析区间';
    return '该时间段内的泳道任务';
  }

  function chainArrowHtml() {
    // 直线而不是 S 弯:线和箭头都压在 svg 的垂直中线(y=14)上,配合网格里 align-self: center,
    // 两端正好落在相邻任务条的高度中点;竖向尾链把它转 90° 后同理落在条的水平中线。
    return '<span class="msi-chain-arrow" aria-hidden="true"><svg viewBox="0 0 38 28"><path d="M2 14 H34"></path><path d="m30 10 4 4-4 4"></path></svg></span>';
  }

  // 左栏「选中详情」和页签无关,只看有没有选中:有就放 key-value,没有放「请选择泳道对象」。
  function syncFootDetailColumn() {
    const basics = document.getElementById('msiTaskBasics');
    const empty = document.getElementById('msiDetailEmpty');
    const has = !!REAL_TRACE_TASK_BY_ID[selectedTraceTaskId];
    if (basics) basics.hidden = !has;
    if (empty) empty.hidden = has;
  }

  // 右栏页签切换 + 内容区取舍:面板展开时右栏一定有东西——「调用链」有选中就画调用流,
  // 没选中放「请选择泳道对象」;其余页签一律放「敬请期待」。收起时整块 body 由 CSS 藏掉。
  function activateFootTab(tabName) {
    const panel = document.getElementById('msiSelectionPanel');
    const chain = document.getElementById('msiCallChain');
    const placeholder = document.getElementById('msiFootPlaceholder');
    if (!panel) return;
    panel.querySelectorAll('.msi-foot-tab').forEach((tab) => {
      const active = tab.dataset.footTab === tabName;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    const collapsed = panel.classList.contains('is-collapsed');
    const showChain = !collapsed && tabName === 'chain' && !!selectedTraceTaskId;
    if (chain) chain.hidden = !showChain;
    if (placeholder) {
      placeholder.textContent = tabName === 'chain' ? '请选择泳道对象' : '敬请期待';
      placeholder.hidden = collapsed || showChain;
    }
    syncFootDetailColumn();
  }

  // 左栏(选中详情)单独折叠:只改左右两栏的宽度比,右栏页签内容不受影响。
  // 栏宽一变调用链一行能放几个也跟着变,所以收完要重画一次。
  function setDetailColumnCollapsed(collapsed) {
    const panel = document.getElementById('msiSelectionPanel');
    const fold = document.getElementById('msiDetailFold');
    if (!panel || !fold) return;
    panel.classList.toggle('is-detail-collapsed', collapsed);
    fold.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    fold.setAttribute('aria-label', collapsed ? '展开选中详情' : '折叠选中详情');
    fold.title = collapsed ? '展开选中详情' : '折叠选中详情';
    if (selectedTraceTaskId) requestAnimationFrame(() => renderSelectionDetail());
  }

  function setSelectionPanelCollapsed(collapsed) {
    const panel = document.getElementById('msiSelectionPanel');
    const toggle = document.getElementById('msiDetailClose');
    if (!panel || !toggle) return;
    panel.classList.toggle('is-collapsed', collapsed);
    panel.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    toggle.setAttribute('aria-label', collapsed ? '展开详情栏' : '收起详情栏');
    toggle.title = collapsed ? '展开详情栏' : '收起详情栏';
    if (collapsed) {
      panel.querySelectorAll('.msi-foot-tab').forEach((tab) => tab.setAttribute('aria-selected', 'false'));
      const chain = document.getElementById('msiCallChain');
      if (chain) chain.hidden = true;
      const placeholder = document.getElementById('msiFootPlaceholder');
      if (placeholder) placeholder.hidden = true;
    } else {
      const activeTab = panel.querySelector('.msi-foot-tab.is-active');
      activateFootTab(activeTab?.dataset.footTab || 'chain');
    }
  }

  function renderSelectionDetail() {
    const basics = document.getElementById('msiTaskBasics');
    const chain = document.getElementById('msiCallChain');
    const task = REAL_TRACE_TASK_BY_ID[selectedTraceTaskId];
    if (!basics || !chain || !task) {
      // 没有选中:按当前页签重算内容区(展开时会落到「请选择泳道对象」占位)
      const activeTab = document.querySelector('#msiSelectionPanel .msi-foot-tab.is-active');
      activateFootTab(activeTab?.dataset.footTab || 'chain');
      return;
    }
    // 选中了任务条就一定把面板拉开——用户手动收起后再点泳道,也要重新弹出详情。
    // 右栏若停在别的页签就切回「调用链」,保证点一下泳道就能看到调用流。
    setSelectionPanelCollapsed(false);
    activateFootTab('chain');
    const end = task.start + task.dur;
    // 「标题」这行不写纯文字:复用泳道/调用链任务条的配色,直接给一个同色的矩形条,
    // 一眼能和图上那根条对上。第三项 true 表示 value 已经是 HTML,不再转义。
    const titleColor = traceTaskColor(task);
    const titleBar = '<span class="msi-basic-taskbar" style="background:' + titleColor.bg +
      ';color:' + titleColor.fg + '">' + esc(task.name) + '</span>';
    const fields = [
      ['标题', titleBar, true],
      ['泳道', taskLaneLabel(task)],
      ['类型', task.taskType || taskKindLabel(task)],
      ['开始时间', task.start.toFixed(5) + ' ms'],
      ['结束时间', end.toFixed(5) + ' ms'],
      ['持续时间', task.dur.toFixed(5) + ' ms'],
      ['Task ID', task.taskId ?? '—'],
      ['connection_id', task.connectionId ?? '推断关系'],
    ];
    basics.innerHTML = fields.map(([key, value, isHtml]) =>
      '<dt>' + esc(key) + '</dt><dd>' + (isHtml ? value : esc(value)) + '</dd>').join('');

    const component = orderedTraceComponent(task.id);
    const nodeHtml = (id, arrowRight) => {
      const node = REAL_TRACE_TASK_BY_ID[id];
      if (!node) return '';
      const arrow = arrowRight ? chainArrowHtml() : '';
      const color = traceTaskColor(node);
      return '<div class="msi-chain-step">' +
        '<div class="msi-chain-node">' +
          '<span class="msi-chain-path" title="' + esc(taskLaneFullPath(node)) + '">' + esc(taskLaneFullPath(node)) + '</span>' +
          '<button class="msi-chain-taskbar' + (id === task.id ? ' is-current' : '') + '" type="button" data-locate-task="' + esc(id) + '"' +
            ' style="background:' + color.bg + ';color:' + color.fg + '" title="定位到 ' + esc(node.name) + '">' + esc(node.name) + '</button>' +
          '<div class="msi-chain-foot">' +
            '<span class="msi-chain-explain" title="' + esc(taskExplanation(node)) + '">' + esc(taskExplanation(node)) + '</span>' +
            '<span class="msi-chain-dur">耗时 ' + esc(node.dur.toFixed(3)) + ' ms</span>' +
          '</div>' +
        '</div>' + arrow + '</div>';
    };
    // 一行放几个:按最小宽度算出上限;剩下的宽度再均分给这几个节点——
    // 节点一律等宽(宽窄跟内容走的话,用户会把宽的条误读成耗时长),
    // 上限 220px 兜住只有两三个节点时条子被拉得过长。
    const nodeMinWidth = 120;
    const nodeMaxWidth = 220;
    const arrowWidth = 38;
    const availableWidth = chain.clientWidth || chain.parentElement?.clientWidth || nodeMinWidth;
    const fitCount = Math.max(1, Math.min(
      component.ordered.length,
      Math.floor((availableWidth + arrowWidth) / (nodeMinWidth + arrowWidth))
    ));
    const nodeWidth = Math.min(nodeMaxWidth, Math.max(nodeMinWidth,
      Math.floor((availableWidth - (fitCount - 1) * arrowWidth) / fitCount)));
    chain.dataset.fitCount = String(fitCount);
    chain.style.setProperty('--msi-chain-node-w', nodeWidth + 'px');
    const head = component.ordered.slice(0, fitCount);
    const tail = component.ordered.slice(fitCount);
    chain.style.setProperty('--msi-chain-turn-left', ((fitCount - 1) * (nodeWidth + arrowWidth)) + 'px');
    chain.style.setProperty('--msi-chain-tail-w', nodeWidth + 'px');
    chain.innerHTML = '<div class="msi-chain-row">' +
      head.map((id, index) => nodeHtml(id, index < head.length - 1)).join('') +
      '</div>' +
      (tail.length ? '<div class="msi-chain-tail">' + chainArrowHtml() +
        tail.map((id, index) => nodeHtml(id, false) +
          (index < tail.length - 1 ? chainArrowHtml() : '')).join('') +
        '</div>' : '');
  }

  // 详情和泳道必须使用完全相同的端点集合。若关系链中的某条泳道被用户折叠，
  // 选择任务时先展开该连通分量涉及的全部父级，再绘线和生成详情。
  function revealTraceComponent(taskId) {
    const body = document.getElementById('msiSwimBody');
    const component = traceComponent(taskId);
    const missing = [...component.ids].some((id) => !body?.querySelector('.msi-bar[data-task-id="' + id + '"]'));
    if (missing) {
      component.ids.forEach((id) => {
        const task = REAL_TRACE_TASK_BY_ID[id];
        if (task) openLanePath(task.laneId);
      });
      renderSwimlanes();
    } else {
      drawTraceTaskLinks();
    }
    renderSelectionDetail();
  }

  function initSelectionPanel() {
    const panel = document.getElementById('msiSelectionPanel');
    if (!panel) return;
    const chain = document.getElementById('msiCallChain');
    if (chain && typeof ResizeObserver === 'function') {
      let resizeFrame = 0;
      new ResizeObserver(() => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          if (!selectedTraceTaskId || chain.hidden) return;
          const count = orderedTraceComponent(selectedTraceTaskId).ordered.length;
          const nextFit = Math.max(1, Math.min(count, Math.floor((chain.clientWidth + 38) / 158)));
          if (String(nextFit) !== chain.dataset.fitCount) renderSelectionDetail();
        });
      }).observe(chain);
    }
    panel.addEventListener('click', (event) => {
      const close = event.target.closest('#msiDetailClose');
      if (close) {
        setSelectionPanelCollapsed(!panel.classList.contains('is-collapsed'));
        return;
      }
      const fold = event.target.closest('#msiDetailFold');
      if (fold) { setDetailColumnCollapsed(!panel.classList.contains('is-detail-collapsed')); return; }
      const title = event.target.closest('#msiDetailTitle');
      if (title) { setSelectionPanelCollapsed(false); return; }
      const node = event.target.closest('[data-locate-task]');
      if (node) { locateTraceTask(node.dataset.locateTask); return; }
      const tab = event.target.closest('.msi-foot-tab');
      if (tab) {
        setSelectionPanelCollapsed(false);
        activateFootTab(tab.dataset.footTab);
      }
    });
    // 每次进页面都从收起态开始(不记忆上次状态):标记里已写 is-collapsed,这里再走一遍
    // setSelectionPanelCollapsed 把按钮文案 / aria / 内容区隐藏一起对齐,免得两处不一致。
    setSelectionPanelCollapsed(true);
  }

  function traceLinkLayerHtml() {
    return '<svg class="msi-link-layer" aria-hidden="true">' +
      '<defs>' +
        // 线形箭头(开口 V 形,不填充),按像素画(userSpaceOnUse)不随线宽缩放;refX 对准 V 尖,
        // 尖端正好落在目标条左边缘。颜色不在这里写死,交给 CSS 的 .msi-link-arrow--* 和线同源。
        ['dispatch', 'operator', 'communication'].map((type) =>
          '<marker id="msiArrow' + type[0].toUpperCase() + type.slice(1) + '" markerUnits="userSpaceOnUse"' +
            ' markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">' +
            '<path class="msi-link-arrow msi-link-arrow--' + type + '" d="M2.5,1.5 L9,5 L2.5,8.5"></path>' +
          '</marker>').join('') +
      '</defs><g class="msi-link-paths"></g></svg>';
  }

  function clearTraceTaskFocus() {
    selectedTraceTaskId = null;
    renderSelectionDetail();
    const body = document.getElementById('msiSwimBody');
    if (!body) return;
    body.classList.remove('has-task-focus');
    body.querySelectorAll('.msi-bar.is-picked,.msi-bar.is-related').forEach((el) => {
      el.classList.remove('is-picked', 'is-related');
    });
    const paths = body.querySelector('.msi-link-paths');
    if (paths) paths.innerHTML = '';
  }

  function drawTraceTaskLinks() {
    const body = document.getElementById('msiSwimBody');
    const layer = body?.querySelector('.msi-link-layer');
    const mount = layer?.querySelector('.msi-link-paths');
    if (!body || !layer || !mount || !selectedTraceTaskId) return;

    const component = traceComponent(selectedTraceTaskId);
    const related = component.ids;
    const edges = component.edges;
    body.querySelectorAll('.msi-bar[data-task-id]').forEach((el) => {
      el.classList.toggle('is-related', related.has(el.dataset.taskId));
      el.classList.toggle('is-picked', el.dataset.taskId === selectedTraceTaskId);
    });
    body.classList.add('has-task-focus');

    const width = Math.max(body.clientWidth, body.scrollWidth);
    const height = Math.max(body.clientHeight, body.scrollHeight);
    layer.setAttribute('width', width);
    layer.setAttribute('height', height);
    layer.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    layer.style.width = width + 'px';
    layer.style.height = height + 'px';
    const bodyRect = body.getBoundingClientRect();
    const point = (id, outgoing) => {
      const el = body.querySelector('.msi-bar[data-task-id="' + id + '"]');
      if (!el) return null;
      const r = el.getBoundingClientRect();
      return {
        x: (outgoing ? r.right : r.left) - bodyRect.left + body.scrollLeft,
        y: (r.top + r.bottom) / 2 - bodyRect.top + body.scrollTop,
      };
    };
    // 连线三条规矩:出口永远在源条右侧中点、入口永远在目标条左侧中点、两端切线水平。
    // 控制点各自朝外伸(源向右、目标向左),不随目标在前在后翻方向 —— 以前目标在左后方时
    // 控制点会反过来往左伸,线从右边缘出来就立刻折回穿过条身,看着像从条底下钻出来。
    // 现在目标靠后时曲线先向右再 S 形折回,出口始终干净地朝右。
    const DOT_R = 2.4;
    mount.innerHTML = edges.map((edge) => {
      const a = point(edge.source, true), b = point(edge.target, false);
      if (!a || !b) return '';
      const dx = b.x - a.x, dy = b.y - a.y;
      const bend = dx >= 0
        ? Math.max(20, dx * .46)
        : Math.max(36, Math.min(120, -dx * .5 + Math.abs(dy) * .35));
      const d = 'M' + a.x.toFixed(1) + ',' + a.y.toFixed(1) + ' C' +
        (a.x + bend).toFixed(1) + ',' + a.y.toFixed(1) + ' ' +
        (b.x - bend).toFixed(1) + ',' + b.y.toFixed(1) + ' ' +
        b.x.toFixed(1) + ',' + b.y.toFixed(1);
      const cls = edge.type === 'operator' ? ' msi-link-path--operator'
        : (edge.type === 'communication' ? ' msi-link-path--communication' : '');
      const marker = edge.type === 'operator' ? 'msiArrowOperator'
        : (edge.type === 'communication' ? 'msiArrowCommunication' : 'msiArrowDispatch');
      // 出口点整个放在条的右边缘外侧(圆心外移一个半径):连线层 z-index 4 压不过选中条的 5,
      // 圆心压在边缘上会被条盖掉一半,窄条上甚至整个看不见,就成了「有的出口没点」。
      return '<path class="msi-link-path' + cls + '" d="' + d + '" marker-end="url(#' + marker + ')"></path>' +
        '<circle class="msi-link-dot' + cls.replace('msi-link-path', 'msi-link-dot') + '" cx="' + (a.x + DOT_R).toFixed(1) + '" cy="' + a.y.toFixed(1) + '" r="' + DOT_R + '"></circle>';
    }).join('');
  }

  function selectTraceTask(taskId) {
    if (!REAL_TRACE_TASK_BY_ID[taskId]) return;
    selectedTraceTaskId = selectedTraceTaskId === taskId ? null : taskId;
    if (!selectedTraceTaskId) clearTraceTaskFocus();
    else {
      revealTraceComponent(taskId);
      centerTraceTaskInView(taskId, false);
    }
  }

  // 把任务条滚到泳道可视区正中(只动泳道自己的滚动容器,不用 scrollIntoView 免得整页跟着滚)。
  // 一定要放在 renderSelectionDetail 之后、下一帧再量尺寸:底部详情面板一拉开,
  // .msi-swim-body 立刻被挤矮,若按拉开前的高度算中点,靠下的条正好落在被面板盖住的那一截。
  // 右键路径不走这里——菜单锚在条上,容器一滚菜单就会被关掉。
  function centerTraceTaskInView(taskId, flash) {
    const body = document.getElementById('msiSwimBody');
    if (!body) return;
    requestAnimationFrame(() => {
      const bar = body.querySelector('.msi-bar[data-task-id="' + taskId + '"]');
      const row = bar?.closest('.msi-lane-row');
      if (!bar || !row) return;
      const bodyRect = body.getBoundingClientRect();
      const rowRect = row.getBoundingClientRect();
      const barRect = bar.getBoundingClientRect();
      // 纵向:按 rect 差算而不是 offsetTop —— .msi-swim-body 不一定是 offsetParent。
      const top = body.scrollTop + (rowRect.top - bodyRect.top) - (body.clientHeight - rowRect.height) / 2;
      // 横向:条在视野里就不动(别打扰用户正在看的时间段),跑出去了才把条的中点拉回中央。
      let left = body.scrollLeft;
      if (barRect.left < bodyRect.left || barRect.right > bodyRect.left + body.clientWidth) {
        left = body.scrollLeft + (barRect.left + barRect.width / 2 - bodyRect.left) - body.clientWidth / 2;
      }
      body.scrollTo({ top: Math.max(0, top), left: Math.max(0, left), behavior: 'smooth' });
      if (flash) {
        bar.classList.remove('is-locate-flash');
        void bar.offsetWidth; // 强制重排:连点同一个条两次也要能重放动画
        bar.classList.add('is-locate-flash');
      }
    });
  }

  function renderSwimlanes() {
    const body = document.getElementById('msiSwimBody');
    if (!body) return;
    // 页面按一级任务目录区分，二级 rank 不再拥有各自独立的视图。
    const rnd = mulberry32(hashSeed(selected.task.name));
    const out = [];
    const appendLane = (lane, depth) => {
      out.push(laneRow(lane, depth, rnd));
      if (lane.group && lane.open && lane.children) {
        lane.children.forEach((child) => appendLane(child, depth + 1));
      }
    };
    LANES.forEach((lane) => appendLane(lane, 0));
    body.innerHTML = out.join('') + (isRealTraceSelection() ? traceLinkLayerHtml() : '');
    fitBarLabels(body);
    if (!isRealTraceSelection()) selectedTraceTaskId = null;
    if (selectedTraceTaskId) requestAnimationFrame(drawTraceTaskLinks);
  }

  /* ══ 色块的左键选中 + 右键菜单 ═══════════════════════════════════
     菜单项按 src/pic/右键.png 的分组和顺序排,最上面加两条智能相关的入口。
     只有这两条真接了行为(把当前算子带进右侧对话框),其余是形态占位。 */
  const CTX_MENU = [
    [{ act: 'chat', label: '置入智能对话', icon: true },
     { act: 'analyze', label: '智能分析', icon: true }],
    [{ label: '应用时间范围分析' }],
    [{ label: '全屏显示' },
     { label: '撤销缩放(0)', key: 'Backspace', disabled: true },
     { label: '重置缩放', key: 'Ctrl+0', disabled: true }],
    [{ label: '设置基准算子' },
     { label: '恢复所有卡的默认偏移量' }],
    [{ label: '隐藏泳道' }],
    [{ label: '泳道高度自适应' }],
    [{ label: '在事件视图中显示' },
     { label: '算子框选模式' },
     { label: '跳转到连线算子' }],
  ];

  let menuEl = null;
  let menuCtx = null;   // 右键点中的那个色块的信息
  let menuOpenedAt = 0; // 弹出时刻:用来忽略「开菜单这一下自己带出来的」click
  let menuAnchor = null; // 菜单锚在哪个色块上 —— 判断某次滚动关不关菜单要靠它

  // 刚弹出来的 120ms 内的 click 不算「点了外面」,只为吃掉右键手势自己派生出来的那一次。
  const settled = (ms) => performance.now() - menuOpenedAt >= ms;

  function buildMenu() {
    const el = document.createElement('div');
    el.className = 'msi-ctxmenu';
    el.setAttribute('role', 'menu');
    el.hidden = true;
    el.innerHTML = CTX_MENU.map((group) => group.map((it) => (
      '<button class="msi-ctxmenu-item" type="button" role="menuitem"' +
      (it.act ? ' data-act="' + it.act + '"' : '') +
      (it.disabled ? ' disabled' : '') + '>' +
        (it.icon ? '<img class="msi-ctxmenu-icon" src="src/pic/icon/msinsightbotAvatar.png" alt="">' : '') +
        '<span>' + esc(it.label) + '</span>' +
        (it.key ? '<span class="msi-ctxmenu-key">' + esc(it.key) + '</span>' : '') +
      '</button>'
    )).join('')).join('<div class="msi-ctxmenu-sep" role="separator"></div>');
    document.body.appendChild(el);
    return el;
  }

  function closeMenu() {
    if (menuEl) menuEl.hidden = true;
    menuCtx = null;
    menuAnchor = null;
  }

  function openMenu(x, y, ctx, anchor) {
    if (!menuEl) menuEl = buildMenu();
    menuCtx = ctx;
    menuAnchor = anchor || null;
    menuEl.hidden = false;
    menuOpenedAt = performance.now();
    // 先摆到 0,0 量出尺寸,再决定往哪边翻,免得贴着视口边缘被切掉
    menuEl.style.left = '0px';
    menuEl.style.top = '0px';
    const r = menuEl.getBoundingClientRect();
    const left = x + r.width > window.innerWidth - 8 ? Math.max(8, x - r.width) : x;
    const top = y + r.height > window.innerHeight - 8 ? Math.max(8, window.innerHeight - r.height - 8) : y;
    menuEl.style.left = left + 'px';
    menuEl.style.top = top + 'px';
  }

  // 把当前色块的信息塞进右侧对话框的输入框。面板收着就先把它打开。
  function sendToChat(text) {
    const toggle = document.getElementById('trainChatToggle');
    if (toggle && toggle.getAttribute('aria-expanded') !== 'true') toggle.click();
    const input = document.getElementById('trainChatInput');
    if (!input) return;
    const cur = input.value;
    // 接在已有内容后面时补一份 CHIP_GAP,否则 #标签会和前面的字黏在一起;行首不用留白
    const glue = !cur || /\n$/.test(cur) ? '' : (window.WZH_CHIP_GAP || '   ');
    input.value = cur.replace(/[ \t]+$/, '') + glue + text;
    // 派发 input 事件:输入框的高亮层、自动高度、发送键可用态都挂在这个事件上
    input.dispatchEvent(new Event('input', { bubbles: true }));
    try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
    const end = input.value.length;
    try { input.setSelectionRange(end, end); } catch (e) { /* 忽略 */ }
  }

  function runMenuAct(act) {
    if (!menuCtx) return;
    const { op, dur, lane } = menuCtx;
    const ref = (window.WZH_CHIP_HASH || '# ') + selected.task.name;
    const gap = window.WZH_CHIP_GAP || '   ';   // 和输入框里 # 标签同一份留白
    if (act === 'chat') {
      sendToChat(ref + gap + lane + ' 上的 ' + op + '(' + dur + 'ms) ');
    } else if (act === 'analyze') {
      sendToChat(ref + gap + lane + ' 上的算子 ' + op + '，耗时 ' + dur + 'ms，请分析它的计算上下游，诊断它的性能。');
    }
  }

  function initBarMenu() {
    const body = document.getElementById('msiSwimBody');
    if (!body) return;

    // 左键:选中这个色块(整张泳道图同时只选中一个)
    body.addEventListener('click', (e) => {
      const bar = e.target.closest('.msi-bar');
      if (!bar) return;
      if (bar.dataset.taskId) {
        selectTraceTask(bar.dataset.taskId);
        return;
      }
      const on = bar.classList.contains('is-picked');
      body.querySelectorAll('.msi-bar.is-picked').forEach((el) => el.classList.remove('is-picked'));
      if (!on) bar.classList.add('is-picked');
    });

    // 右键:选中并弹菜单
    body.addEventListener('contextmenu', (e) => {
      const bar = e.target.closest('.msi-bar');
      if (!bar) return;
      e.preventDefault();
      if (bar.dataset.taskId) {
        selectedTraceTaskId = bar.dataset.taskId;
        revealTraceComponent(bar.dataset.taskId);
      } else {
        body.querySelectorAll('.msi-bar.is-picked').forEach((el) => el.classList.remove('is-picked'));
        bar.classList.add('is-picked');
      }
      const row = bar.closest('.msi-lane-row');
      openMenu(e.clientX, e.clientY, {
        op: bar.dataset.op || '未命名事件',
        dur: bar.dataset.dur || '0',
        lane: row ? (row.querySelector('.msi-lane-text')?.textContent || '') : '',
      }, bar.dataset.taskId ? (body.querySelector('.msi-bar[data-task-id="' + bar.dataset.taskId + '"]') || bar) : bar);
    });

    // 详情栏「完整调用链」里的任务条:右键复用同一套菜单(含「置入智能对话 / 智能分析」),
    // 上下文从任务数据取,lane 用叶子泳道名,和泳道里右键得到的一致。不改当前选中。
    const chain = document.getElementById('msiCallChain');
    chain?.addEventListener('contextmenu', (e) => {
      const bar = e.target.closest('.msi-chain-taskbar');
      const task = bar && REAL_TRACE_TASK_BY_ID[bar.dataset.locateTask];
      if (!task) return;
      e.preventDefault();
      const path = lanePath(task.laneId);
      openMenu(e.clientX, e.clientY, {
        op: task.name,
        dur: task.dur.toFixed(5),
        lane: path.length ? path[path.length - 1].label : task.laneId,
      }, bar);
    });

    document.addEventListener('click', (e) => {
      if (!menuEl || menuEl.hidden) return;
      const item = e.target.closest('.msi-ctxmenu-item');
      if (item && menuEl.contains(item)) {
        if (item.disabled) return;
        runMenuAct(item.dataset.act);   // 没接行为的项就只是关掉菜单
        closeMenu();
        return;
      }
      if (!settled(120)) return;
      closeMenu();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
    // 滚动会让菜单和它锚定的色块错位,所以要关 —— 但只关"真把色块滚跑了"的那种。
    // 这个监听挂在 window 捕获阶段,页面里任意滚动容器的 scroll 都会打到它。
    // 右侧对话区回答生成时每帧都在自动贴底,那跟泳道图里的色块没有半点关系;
    // 早先无条件 closeMenu,结果就是"回答中右键,菜单一出来就没了"。
    // 判据只有一条:滚的这个容器包不包着当前锚点。不包 = 色块没动 = 不用管。
    window.addEventListener('scroll', (e) => {
      if (!menuAnchor) return;
      const t = e.target === document || e.target === window ? document.documentElement : e.target;
      if (!(t instanceof Node) || !t.contains(menuAnchor)) return;
      closeMenu();
    }, true);
    window.addEventListener('resize', closeMenu);
    // 菜单自己身上再右键,别把系统菜单叠上来
    document.addEventListener('contextmenu', (e) => {
      if (menuEl && !menuEl.hidden && menuEl.contains(e.target)) e.preventDefault();
    });
  }

  function initSwimlanes() {
    const body = document.getElementById('msiSwimBody');
    if (!body) return;
    body.addEventListener('click', (e) => {
      const tog = e.target.closest('.msi-lane-caret-btn');
      if (tog) {
        const lane = findLane(tog.dataset.toggle);
        if (lane) { lane.open = !lane.open; renderSwimlanes(); }
        return;
      }
      const row = e.target.closest('.msi-lane-row');
      if (!row || !row.dataset.lane) return;
      if (!e.target.closest('.msi-bar')) clearTraceTaskFocus();
      selectedLaneId = row.dataset.lane;
      // 只切 class 不重画:同一个种子重画结果完全一样,白白再生成一遍
      body.querySelectorAll('.msi-lane-row.is-selected').forEach((el) => el.classList.remove('is-selected'));
      row.classList.add('is-selected');
    });
    // 条宽写的是百分比,容器一变宽窄,能塞下的字数就变了 —— 面板展开/收起、窗口缩放
    // 都要重算一遍省略位置。只改 textContent 不改布局,不会把 RO 自己再触发一轮。
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(() => {
        fitBarLabels(body);
        if (selectedTraceTaskId) drawTraceTaskLinks();
      }).observe(body);
    }
    renderSwimlanes();
  }

  // 反向交互:对话里的锚点点一下,泳道图定位到对应那一行。
  // 右键「置入智能对话」是图 → 对话,这个是对话 → 图,一来一回才算协作而不是单向问答。
  // 返回 true/false,让对话那侧知道要不要给点击回执。
  function locateLane(laneId) {
    const body = document.getElementById('msiSwimBody');
    if (!body || !laneId) return false;
    if (!findLane(laneId)) return false;
    // 目标可能嵌套四层；沿祖先链全部展开后再定位。
    openLanePath(laneId);
    renderSwimlanes();
    const row = body.querySelector('.msi-lane-row[data-lane="' + laneId + '"]');
    if (!row) return false;

    selectedLaneId = laneId;
    body.querySelectorAll('.msi-lane-row.is-selected').forEach((el) => el.classList.remove('is-selected'));
    row.classList.add('is-selected');

    // 不能用 scrollIntoView:它会连带把整个页面滚起来。这里只动泳道自己的滚动容器,
    // 位置按 rect 差算而不是 offsetTop —— .msi-swim-body 不一定是 offsetParent。
    const bodyRect = body.getBoundingClientRect();
    const rowRect = row.getBoundingClientRect();
    const y = body.scrollTop + (rowRect.top - bodyRect.top) - (body.clientHeight - rowRect.height) / 2;
    body.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });

    row.classList.remove('is-locate-flash');
    void row.offsetWidth; // 强制重排:连点同一个锚点两次也要能重放动画
    row.classList.add('is-locate-flash');
    return true;
  }
  function locateTraceTask(taskId) {
    const task = REAL_TRACE_TASK_BY_ID[taskId];
    const body = document.getElementById('msiSwimBody');
    if (!task || !body) return false;
    selectedTraceTaskId = taskId;
    selectedLaneId = task.laneId;
    traceComponent(taskId).ids.forEach((id) => {
      const relatedTask = REAL_TRACE_TASK_BY_ID[id];
      if (relatedTask) openLanePath(relatedTask.laneId);
    });
    renderSwimlanes();
    renderSelectionDetail();
    // 连线由 renderSwimlanes 里的 rAF 画;这里只负责把条居中(面板已在上一行拉开,量到的是挤矮后的高度)
    centerTraceTaskInView(taskId, true);
    return true;
  }
  // 对话框在另一个 IIFE 里,和 sendToChat 一样只能借 window 搭桥
  window.WZH_LOCATE_LANE = locateLane;

  /* ══ 5. 顶部时间尺:0ms ~ 1000ms,每 100ms 一格 ══════════════════ */
  function renderRuler() {
    const host = document.getElementById('msiRuler');
    if (!host) return;
    const spanMs = isRealTraceSelection() ? TRACE_WINDOW_MS : DUR_MS;
    const ticks = [];
    for (let i = 0; i <= 10; i++) {
      const endCls = i === 10 ? ' msi-ruler-tick--end' : '';
      const tickMs = i * spanMs / 10;
      ticks.push('<span class="msi-ruler-tick' + endCls + '" style="left:' + (i * 10) + '%">' +
                 (Number.isInteger(tickMs) ? tickMs : tickMs.toFixed(1)) + 'ms</span>');
    }
    host.innerHTML = ticks.join('');
  }

  /* ══ 6. 时间轴缩放:左减右加,中间显示当前时间窗 ═══════════════════ */
  function fmtSpan(ms) {
    const s = ms / 1000;
    return (Number.isInteger(s) ? s : s.toFixed(1)) + 's';
  }

  function applyZoom() {
    DUR_MS = ZOOM_STEPS[zoomIdx];
    syncTimelineControls();
  }

  function syncTimelineControls() {
    const val = document.getElementById('msiZoomVal');
    const out = document.getElementById('msiZoomOut');
    const inc = document.getElementById('msiZoomIn');
    const real = isRealTraceSelection();
    if (val) val.textContent = real ? TRACE_WINDOW_MS.toFixed(1) + 'ms' : fmtSpan(DUR_MS);
    if (out) out.disabled = real || zoomIdx === 0;
    if (inc) inc.disabled = real || zoomIdx === ZOOM_STEPS.length - 1;
    renderRuler();
  }

  function initZoom() {
    const out = document.getElementById('msiZoomOut');
    const inc = document.getElementById('msiZoomIn');
    if (out) out.addEventListener('click', () => { if (!isRealTraceSelection() && zoomIdx > 0) { zoomIdx--; applyZoom(); } });
    if (inc) inc.addEventListener('click', () => { if (!isRealTraceSelection() && zoomIdx < ZOOM_STEPS.length - 1) { zoomIdx++; applyZoom(); } });
    applyZoom();
  }

  /* ══ 7. 启动 ═══════════════════════════════════════════════════ */
  function boot() {
    initTree();
    initCompareMode();
    initZoom();
    initSwimlanes();
    initBarMenu();
    initSelectionPanel();
    applySelection();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
  </script>

  <!-- ── 智能对话面板逻辑(原 js/training-chat-panel.js,已内联) ── -->
  <script>
// 智能对话:训练场景 AI 助手,右上角 #trainChatToggle 打开,默认收起(见 training-monitoring-v2.html
// 里的 #trainChatPanel)。参考 MindStudioNext 的右侧 AI 对话 inspector(前端直连 DeepSeek API、
// 用户自带 Key、按浏览器/天限额),但系统提示改为围绕当前训练运行(模型/step/loss/MFU/已定位问题)
// 作答,而不是解读离线性能分析报告。训练态由 training-run-twin.js 暴露的 window.twinGetTrainingContext()
// 实时读取,本文件不维护自己的训练状态副本。
(function () {
  const $ = (id) => document.getElementById(id);

  const DEEPSEEK = {
    endpoint: 'https://api.deepseek.com/chat/completions',
    model: 'deepseek-chat',
    temperature: 0.3,
  };
  const KEY_STORE = 'pto_train_chat_deepseek_key';
  const QUOTA_STORE = 'pto_train_chat_daily_quota';
  const DAILY_LIMIT = 20;

  let chatHistory = [];
  let chatStreaming = false;
  let chatStopped = false;    // 本轮回答是否被用户按「停止回答」打断
  let chatAbortCtrl = null;   // 真实流式请求的 AbortController,停止时用它掐断 fetch
  // 会话世代号:每按一次「新建对话」+1。回答是一串 await 串起来的异步流程,掐断请求只能
  // 让它停下,停不住它接着要做的收尾(往 chatHistory 里塞、改 chatStreaming、往 DOM 上补
  // 「已停止回答」)。这些收尾一旦落到新会话上就是污染,所以每轮开跑时记下当时的世代号,
  // 收尾前对一下:对不上说明"我这轮已经被丢掉了",直接撒手。
  let chatEpoch = 0;

  // ── 首屏点阵底纹:canvas 逐点画一块椭圆形淡出的点阵,替代原来的 src/pic/点阵背景.png。
  // 之所以不引现成的点阵库(Magic UI DotPattern / react-bits DotGrid 之类):那些都是 React 组件,
  // 而这个文件是零依赖的单文件原型,搬进来的成本远大于这几十行。
  // 两种"闪动":
  //   1) 初始化——新建对话、每次展开抽屉,一圈波纹从中心向外扩散,点被波峰扫过时提亮;
  //   2) 鼠标经过——指针周围一片点提亮,指针离开后自己衰减回底色。
  // RAF 只在这两件事进行时跑:波纹放完、且指针停住不动,就停在最后一帧,静置时不烧 CPU。
  // prefers-reduced-motion 下两种动效都跳过,只画一张静态底纹。──
  const DOT_GAP = 10;           // 点阵行列间距(CSS px)
  const DOT_RADIUS = 2.0;       // 点半径
  const DOT_RIPPLE_MS = 1500;   // 波纹从中心扩到最外圈用时
  const DOT_RIPPLE_BAND = 90;   // 波峰前后的影响宽度,越大波纹越"厚"
  const DOT_HOVER_RADIUS = 130; // 指针提亮半径
  const DOT_HOVER_EASE = 0.12;  // 指针强度的追帧系数,亮起和熄灭都用这个速度

  // "R G B" 三元组(CSS 变量里那种不带 rgb() 包装的写法)→ [r, g, b]
  function parseRgbTriplet(raw, fallback) {
    const n = String(raw).trim().split(/[\s,]+/).map(Number).filter((v) => Number.isFinite(v));
    return n.length >= 3 ? n.slice(0, 3) : fallback;
  }

  let welcomeDots = null; // 同一时刻只可能有一块欢迎屏,句柄存全局,重建时先回收旧的

  function createWelcomeDots(canvas) {
    const ctx = canvas.getContext('2d');
    if (!ctx) return null;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const hero = canvas.closest('.wzh-chat-welcome-hero') || canvas.parentElement;
    const st = {
      dots: [], w: 0, h: 0, maxDist: 1,
      color: [99, 102, 241], hot: [123, 37, 244], alpha: 0.2,
      rippleStart: 0,           // 0 表示当前没有波纹
      hover: 0, hoverTarget: 0, // 当前/目标指针强度,0~1
      px: 0, py: 0,             // 指针在 canvas 坐标系里的位置
      raf: 0, moved: false, dead: false,
    };

    function readDotStyle() {
      const cs = getComputedStyle(canvas);
      st.color = parseRgbTriplet(cs.getPropertyValue('--wzh-dots-rgb'), st.color);
      st.hot = parseRgbTriplet(cs.getPropertyValue('--wzh-dots-hot-rgb'), st.color);
      const a = parseFloat(cs.getPropertyValue('--wzh-dots-alpha'));
      if (Number.isFinite(a)) st.alpha = a;
    }

    // 按当前尺寸重建点阵。中心最密、四周淡出成一块椭圆,形状照着原图那版底纹。
    function build() {
      const rect = canvas.getBoundingClientRect();
      const w = Math.round(rect.width);
      const h = Math.round(rect.height);
      if (!w || !h) { st.dots = []; return false; }
      // DPR 上限取 2:再往上翻只是多烧填充率,这种很淡的底纹肉眼分不出
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      st.w = w; st.h = h;

      const cx = w / 2, cy = h / 2, rx = w * 0.52, ry = h * 0.42;
      const dots = [];
      for (let y = (h % DOT_GAP) / 2; y < h; y += DOT_GAP) {
        for (let x = (w % DOT_GAP) / 2; x < w; x += DOT_GAP) {
          const nx = (x - cx) / rx, ny = (y - cy) / ry;
          const d = Math.hypot(nx, ny);
          if (d >= 1) continue;
          // (1-d)² 收边 + 每个点一点随机抖动,否则淡出的边界会看出一条规整的椭圆线
          const base = (1 - d) * (1 - d) * (0.72 + Math.random() * 0.28);
          dots.push({ x, y, base, dist: Math.hypot(x - cx, y - cy), lit: 0 });
        }
      }
      st.dots = dots;
      st.maxDist = Math.hypot(rx, ry);
      return true;
    }

    function draw(now) {
      const { dots, w, h } = st;
      ctx.clearRect(0, 0, w, h);
      if (!dots.length) return;

      // 波峰半径走 easeOutCubic:一开始扩得快、后面慢下来,像水面荡开而不是匀速的圆
      let waveR = -1, waveFade = 0;
      if (st.rippleStart) {
        const t = (now - st.rippleStart) / DOT_RIPPLE_MS;
        if (t >= 1) {
          st.rippleStart = 0;
        } else {
          waveR = (1 - Math.pow(1 - t, 3)) * (st.maxDist + DOT_RIPPLE_BAND);
          waveFade = 1 - t * t; // 扩到外圈时整圈亮度也在退,收尾不会"啪"地断掉
        }
      }
      const hover = st.hover;

      // 先把每个点这一帧的"被照亮程度"算出来,再分冷/热两趟画:绝大多数点是冷的,
      // 能共用同一个 fillStyle 只改 globalAlpha,省掉每个点一次 rgba() 字符串拼接。
      let hotCount = 0;
      for (let i = 0; i < dots.length; i++) {
        const dot = dots[i];
        let lit = 0;
        if (waveR >= 0) {
          const dw = Math.abs(dot.dist - waveR);
          if (dw < DOT_RIPPLE_BAND) lit = Math.cos((dw / DOT_RIPPLE_BAND) * Math.PI / 2) * waveFade;
        }
        if (hover > 0.01) {
          const dh = Math.hypot(dot.x - st.px, dot.y - st.py);
          if (dh < DOT_HOVER_RADIUS) {
            const k = 1 - dh / DOT_HOVER_RADIUS;
            lit = Math.min(1, lit + k * k * hover);
          }
        }
        dot.lit = lit;
        if (lit > 0.01) hotCount++;
      }

      const [r, g, b] = st.color;
      const [hr, hg, hb] = st.hot;
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      for (let i = 0; i < dots.length; i++) {
        const dot = dots[i];
        if (dot.lit > 0.01) continue;
        const a = st.alpha * dot.base;
        if (a < 0.004) continue;
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (!hotCount) return;

      for (let i = 0; i < dots.length; i++) {
        const dot = dots[i];
        const lit = dot.lit;
        if (lit <= 0.01) continue;
        // 亮的点同时变浓、变大、往 hot 色偏一点,不只是调透明度,"闪"才看得出来。
        // 系数按"照到最亮时的倍数"来定:透明度最多 2.6 倍,半径最多 1.4 倍(2.0px → 2.8px)。
        const a = Math.min(0.9, st.alpha * dot.base * (1 + lit * 1.6));
        ctx.fillStyle = 'rgba(' + Math.round(r + (hr - r) * lit) + ','
          + Math.round(g + (hg - g) * lit) + ','
          + Math.round(b + (hb - b) * lit) + ','
          + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, DOT_RADIUS * (1 + lit * 0.4), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function schedule() {
      if (!st.raf && !st.dead) st.raf = requestAnimationFrame(frame);
    }

    function frame(now) {
      st.raf = 0;
      if (st.dead) return;
      const moved = st.moved;
      st.moved = false;
      st.hover += (st.hoverTarget - st.hover) * DOT_HOVER_EASE;
      if (Math.abs(st.hoverTarget - st.hover) < 0.005) st.hover = st.hoverTarget;
      draw(now);
      // 波纹没放完、指针强度还在追、或指针刚动过——才需要下一帧
      if (st.rippleStart || st.hover !== st.hoverTarget || moved) schedule();
    }

    function redraw() {
      if (!st.dots.length) build();
      draw(performance.now());
    }

    // ── 尺寸和主题变化都得重来一遍:面板从收起到展开、窗口缩放会改 canvas 的实际像素尺寸,
    // 换主题会改点的颜色。两个 observer 都只做"重建 + 重画一帧",不启动动画。 ──
    const ro = new ResizeObserver(() => { build(); draw(performance.now()); });
    ro.observe(canvas);
    const themeObs = new MutationObserver(() => { readDotStyle(); redraw(); });
    themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-brand'] });

    function onMove(e) {
      const rect = canvas.getBoundingClientRect();
      st.px = e.clientX - rect.left;
      st.py = e.clientY - rect.top;
      st.hoverTarget = 1;
      st.moved = true;
      schedule();
    }
    function onLeave() {
      st.hoverTarget = 0;
      schedule();
    }
    // 指针事件挂在 hero 上(canvas 自己是 pointer-events:none),且只对真正能悬停的指针开——
    // 触摸设备上点一下会留下一个不再移动的"指针",亮斑就会一直卡在那儿。
    const canHover = window.matchMedia('(hover: hover)').matches && !reduced;
    if (hero && canHover) {
      hero.addEventListener('pointermove', onMove);
      hero.addEventListener('pointerleave', onLeave);
    }

    readDotStyle();
    build();
    draw(performance.now());

    return {
      canvas,
      // 放一次扩散波纹。面板还没展开过、点阵还是空的时候,这里补一次 build。
      ripple() {
        if (st.dead) return;
        if (!st.dots.length && !build()) return;
        if (reduced) { draw(performance.now()); return; }
        st.rippleStart = performance.now();
        schedule();
      },
      destroy() {
        st.dead = true;
        if (st.raf) cancelAnimationFrame(st.raf);
        st.raf = 0;
        ro.disconnect();
        themeObs.disconnect();
        if (hero && canHover) {
          hero.removeEventListener('pointermove', onMove);
          hero.removeEventListener('pointerleave', onLeave);
        }
      },
    };
  }

  // 欢迎屏(重新)出现时调一次:接管当前这块 canvas 并放一圈波纹。
  // 欢迎屏已经被第一条消息顶掉时,顺手把上一块的 RAF 和监听回收掉。
  function playWelcomeDots() {
    const canvas = document.querySelector('#trainChatMessages .wzh-chat-welcome-dots');
    if (welcomeDots && welcomeDots.canvas !== canvas) {
      welcomeDots.destroy();
      welcomeDots = null;
    }
    if (!canvas) return;
    if (!welcomeDots) welcomeDots = createWelcomeDots(canvas);
    welcomeDots?.ripple();
  }

  // ── 首屏欢迎语打字机效果:只要还停在欢迎屏(未开始对话),每次打开抽屉都重新播放一遍。
  // 用一个自增 token 标记"当前是第几轮打字"——如果面板被快速关了又开、上一轮的 setTimeout
  // 链还没跑完,旧的 step() 发现自己的 token 已经过期就直接放弃,不会跟新一轮抢着写同一个
  // 已被清空重建的 cursor 节点(避免 insertAdjacentText 在已脱离文档的节点上报错)。 ──
  const WELCOME_TEXT = '你好，我是性能分析助手';
  let typewriterToken = 0;

  function typeWelcomeText(el, text) {
    const token = ++typewriterToken;
    el.textContent = '';
    const cursor = document.createElement('span');
    cursor.className = 'wzh-chat-typewriter-cursor';
    el.appendChild(cursor);
    let i = 0;
    (function step() {
      if (token !== typewriterToken) return;
      if (i < text.length) {
        cursor.insertAdjacentText('beforebegin', text[i]);
        i += 1;
        setTimeout(step, 32);
      } else {
        setTimeout(() => { if (token === typewriterToken) cursor.remove(); }, 1200);
      }
    })();
  }

  function playWelcomeTypewriter() {
    playWelcomeDots(); // 欢迎屏还在就重放一圈点阵扩散,已经开始对话则顺手回收 canvas
    const el = document.querySelector('#trainChatMessages .wzh-chat-welcome-text');
    if (!el) return;
    typeWelcomeText(el, WELCOME_TEXT);
  }

  function getApiKey() { return (localStorage.getItem(KEY_STORE) || '').trim(); }
  function setApiKey(k) {
    if (k) localStorage.setItem(KEY_STORE, k.trim());
    else localStorage.removeItem(KEY_STORE);
    updateKeyUI();
  }

  // 弹窗设置/修改 Key,返回最新 key;留空确定可清除已保存的 Key。
  window.promptTrainChatApiKey = function () {
    const cur = getApiKey();
    const k = window.prompt(
      '请输入你自己的 DeepSeek API Key（以 sk- 开头）：\n\n' +
      '· 仅保存在你当前浏览器（localStorage），除了直接发给 DeepSeek 官方接口外不会上传到任何地方。\n' +
      '· 在 https://platform.deepseek.com 申请。\n' +
      '· 留空并确定可清除已保存的 Key。',
      cur
    );
    if (k === null) return cur;
    setApiKey(k);
    return getApiKey();
  };

  // Key 状态改用抽屉右上角齿轮按钮承载(见 #trainChatKeyBtn):按钮本身即入口,
  // 配置与否只通过图标颜色(.is-configured)和 title/aria-label 文案区分,不再单独占一行。
  function updateKeyUI() {
    const has = !!getApiKey();
    const btn = $('trainChatKeyBtn');
    if (btn) {
      btn.classList.toggle('is-configured', has);
      btn.title = has ? '设置 DeepSeek API Key（已配置）' : '设置 DeepSeek API Key（未配置）';
      btn.setAttribute('aria-label', btn.title);
    }
  }

  // ── 每日问答额度(纯前端,按浏览器/天;软限制,清缓存/无痕即可绕过,如需硬限制需配合后端)──
  // 额度条 UI 已去掉,这里只保留限额判定本身(sendMessage 里读 quotaLeft() 拦截超额提问)。
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function getQuota() {
    let q;
    try { q = JSON.parse(localStorage.getItem(QUOTA_STORE) || '{}'); } catch (e) { q = {}; }
    if (q.date !== todayStr()) q = { date: todayStr(), count: 0 };
    return q;
  }
  function quotaUsed() { return getQuota().count; }
  function quotaLeft() { return Math.max(0, DAILY_LIMIT - quotaUsed()); }
  function bumpQuota() {
    const q = getQuota();
    q.count += 1;
    localStorage.setItem(QUOTA_STORE, JSON.stringify(q));
  }

  // ── 消息区滚动手感 ────────────────────────────────────────────────────────
  // 原来每次追加消息都是 msgEl.scrollTop = msgEl.scrollHeight 硬跳,新内容"啪"地闪到底,
  // 加上默认的系统滚动条,整体观感很生硬。这里统一收口成三件事:
  //   1) 普通追加走 scrollTo({behavior:'smooth'}),让视线跟着滑下去而不是瞬移;
  //   2) 用户往回翻历史时(onlyIfNearBottom)不再被强行拽回底部;
  //   3) 滚动位置变化时同步上下渐隐类名(见 .wzh-chat-messages 的 --wzh-chat-fade-* 遮罩),
  //      内容在标题栏/提示语栏边界处淡出,而不是被一刀切断。
  const STICK_THRESHOLD = 64;  // 距底部小于这个像素数即视为"贴着底部看最新消息"
  // 是否还要跟着最新内容走。一轮问答开始时置 true;用户自己滚了(滚轮/触摸/方向键/拖滚动条)
  // 就置 false,思考和回答继续往下长但视口不动;等用户自己滑回底部(或点「回到底部」)再恢复。
  let stickToBottom = true;
  const FADE_EPSILON = 6;      // 滚动余量小于这个像素数就当作已经到顶/到底,不再渐隐
  let fadeRaf = 0;

  function isNearBottom(el) {
    return el.scrollHeight - el.scrollTop - el.clientHeight <= STICK_THRESHOLD;
  }

  function updateChatFade(el) {
    const msgEl = el || $('trainChatMessages');
    if (!msgEl) return;
    const rest = msgEl.scrollHeight - msgEl.clientHeight;
    const canScroll = rest > FADE_EPSILON;
    // 这里只刷新视觉状态，不根据 scroll 事件恢复自动跟随。内容重排（例如正式回答开始时
    // 自动收起思考块）和程序化 scrollTo 同样会触发 scroll；在这里恢复会误把用户刚刚
    // 取消的跟随重新打开。恢复跟随只由下方明确的用户向下滚动操作或「回到底部」触发。
    // 置顶的问题卡片就贴在滚动口顶沿,再叠一层顶端渐隐会把卡片上半截压暗;
    // 改由卡片自己的下沿遮罩(.is-stuck::after)承担"内容淡出"这件事。
    // 判定要同时满足两条:卡片已经压到内容区顶沿、且确实滚动过——
    // 只看前一条的话,scrollTop=0 时卡片本来就在顶沿,遮罩会无端亮着。
    const pinned = msgEl.querySelector('.wzh-chat-qcard.is-pinned');
    if (pinned) {
      const padTop = parseFloat(getComputedStyle(msgEl).paddingTop) || 0;
      const gap = pinned.getBoundingClientRect().top
        - (msgEl.getBoundingClientRect().top + padTop);
      pinned.classList.toggle('is-stuck', gap <= FADE_EPSILON && msgEl.scrollTop > FADE_EPSILON);
    }
    msgEl.classList.toggle('is-fade-top', canScroll && !pinned && msgEl.scrollTop > FADE_EPSILON);
    msgEl.classList.toggle('is-fade-bottom', canScroll && rest - msgEl.scrollTop > FADE_EPSILON);
    updateJumpBtn();
  }

  // 滚动/流式刷新期间调用很密集,合并到下一帧统一算一次
  function scheduleFadeUpdate(el) {
    if (fadeRaf) return;
    fadeRaf = requestAnimationFrame(() => { fadeRaf = 0; updateChatFade(el); });
  }

  function scrollChatToBottom(el, opts) {
    if (!el) return;
    const o = opts || {};
    if (o.onlyIfNearBottom && !stickToBottom) { scheduleFadeUpdate(el); return; }
    try {
      el.scrollTo({ top: el.scrollHeight, behavior: o.instant ? 'auto' : 'smooth' });
    } catch (e) {
      el.scrollTop = el.scrollHeight; // 老引擎不支持 scrollTo(options) 时退回硬跳
    }
    scheduleFadeUpdate(el);
  }

  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 代码块统一由这里拼:外面套一层定位容器,右上角挂复制键。回答是打字机整段重渲染的,
  // 按钮会被反复重建,所以点击不在这里绑,走 boot 里挂在消息区上的事件委托。
  const COPY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<rect x="9" y="9" width="11" height="11" rx="2"></rect>' +
    '<path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg>';
  const COPY_DONE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>';
  function codeBlock(code) {
    return '<div class="wzh-chat-codeblock"><pre><code>' + code + '</code></pre>' +
      '<button type="button" class="wzh-chat-copy" title="复制">' + COPY_ICON + '</button></div>';
  }

  // 剪贴板:navigator.clipboard 只在 https / localhost 下有,这个页面也可能被直接
  // 双击用 file:// 打开,所以留一条 execCommand 的退路。
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  // 极简 Markdown 渲染:本仓库页面不接 CDN 依赖以保持离线可用,这里只覆盖聊天回复常见的
  // 标题/加粗/行内代码/代码块/列表/段落。先整体转义再拼 HTML,模型或用户输入里的尖括号
  // 不会被当成标签解析。
  function renderMarkdown(text) {
    const lines = escHtml(text).split('\n');
    const out = [];
    let inCode = false, codeBuf = [];
    let listBuf = [], listType = null, listStart = 1;
    function flushList() {
      if (!listBuf.length) return;
      const tag = listType === 'ol' ? 'ol' : 'ul';
      const startAttr = tag === 'ol' ? ' start="' + listStart + '"' : '';
      out.push('<' + tag + startAttr + '>' + listBuf.map((li) => '<li>' + li + '</li>').join('') + '</' + tag + '>');
      listBuf = []; listType = null; listStart = 1;
    }
    // 自定义语法 [[lane:<泳道id>::<锚点文字>]] → 可点的定位锚点(见 .wzh-chat-locate)。
    // 分隔符用 :: 不用 |:表格行是先按 | 切列再走 inline 的,用 | 会把锚点在表格里切断。
    const LOCATE_RE = /\[\[lane:([a-z0-9-]+)::([^\]]+)\]\]/g;
    const LOCATE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="5.5"></circle>' +
      '<path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"></path></svg>';
    function inline(s) {
      return s
        // 打字机是逐字重渲染的(见 typeMarkdownInto),锚点打到一半时先藏起来,
        // 否则读者会看到半截 [[lane:ovl-free::泳道… 的原文闪过去
        .replace(/\[\[[^\]]*\]?$/, '')
        .replace(LOCATE_RE, function (m, id, label) {
          return '<button type="button" class="wzh-chat-locate" data-lane="' + id +
            '" title="在泳道图中定位">' + LOCATE_ICON + '<span>' + label + '</span></button>';
        })
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }
    // GFM 管道表格支持(「调整图表」演示场景的回答里要用表格罗列替换前后 + 提取结果)。
    function isSeparatorRow(line) {
      return /^\s*\|?(\s*:?-{2,}:?\s*\|)+\s*:?-{2,}:?\s*\|?\s*$/.test(line);
    }
    function splitRow(line) {
      let t = line.trim();
      if (t.startsWith('|')) t = t.slice(1);
      if (t.endsWith('|')) t = t.slice(0, -1);
      return t.split('|').map((c) => c.trim());
    }

    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (line.trim().startsWith('```')) {
        if (inCode) { out.push(codeBlock(codeBuf.join('\n'))); codeBuf = []; inCode = false; }
        else { flushList(); inCode = true; }
        i++; continue;
      }
      if (inCode) { codeBuf.push(line); i++; continue; }

      if (line.includes('|') && i + 1 < lines.length && isSeparatorRow(lines[i + 1])) {
        flushList();
        const header = splitRow(line);
        let j = i + 2;
        const rows = [];
        while (j < lines.length && lines[j].includes('|') && lines[j].trim()) {
          rows.push(splitRow(lines[j]));
          j++;
        }
        out.push(
          '<table class="wzh-chat-table"><thead><tr>' +
          header.map((h2) => '<th>' + inline(h2) + '</th>').join('') +
          '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>'
        );
        i = j; continue;
      }

      const h = line.match(/^(#{1,3})\s+(.*)$/);
      if (h) { flushList(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
      const ol = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
      const ul = line.match(/^\s*[-*]\s+(.*)$/);
      if (ol) {
        if (listType !== 'ol') { flushList(); listType = 'ol'; listStart = Number(ol[1]) || 1; }
        listBuf.push(inline(ol[2])); i++; continue;
      }
      if (ul) { if (listType !== 'ul') flushList(); listType = 'ul'; listBuf.push(inline(ul[1])); i++; continue; }
      flushList();
      if (!line.trim()) { i++; continue; }
      out.push('<p>' + inline(line) + '</p>');
      i++;
    }
    flushList();
    if (inCode && codeBuf.length) out.push(codeBlock(codeBuf.join('\n')));
    return out.join('');
  }

  function getTrainingContext() {
    return typeof window.twinGetTrainingContext === 'function' ? window.twinGetTrainingContext() : null;
  }

  function buildSystemPrompt(ctx) {
    const nowStr = new Date().toLocaleString('zh-CN', { dateStyle: 'full', timeStyle: 'short' });
    if (!ctx) {
      return `你是 PTO（Ascend NPU 训练监控大盘）内置的 AI 助手。当前真实时间：${nowStr}。训练态数据暂未就绪，如实告知用户，不要编造具体数字。一律用中文回答，专业简洁。`;
    }
    const pct = ctx.totalSteps ? ((ctx.step / ctx.totalSteps) * 100).toFixed(1) : '--';
    const issuesText = (ctx.diagnosisMarkers || []).map((m) => {
      const stepText = m.stepFrom != null ? `step ${m.stepFrom}~${m.stepTo}` : `step ${m.step}`;
      return '- [问题' + m.num + ' · ' + String(m.severity).toUpperCase() + ' · ' + m.category + '] ' + stepText + '：' + m.label + '（' + m.sub + '）';
    }).join('\n');
    return `你是 PTO（Ascend NPU 训练监控大盘）内置的 AI 助手，服务对象是正在盯着这块训练监控大盘的算法/训练工程师。当前真实时间：${nowStr}。

当前监控的训练任务：
- 模型：${ctx.model.name}${ctx.model.summary ? '（' + ctx.model.summary + '）' : ''}
- 任务类型：${ctx.task}；并行策略：${ctx.model.parallel || '—'}；序列长度：${ctx.model.seq || '—'}；batch：${ctx.model.batch || '—'}
- 硬件规模：${ctx.hardwareLabel}
- 当前进度：step ${ctx.step.toLocaleString()} / ${ctx.totalSteps.toLocaleString()}（${pct}%）
- 实时指标：loss=${ctx.loss}（EMA ${ctx.lossEMA}）val_loss=${ctx.val}，MFU=${(ctx.mfu * 100).toFixed(1)}%
- 已训练 token 数：约 ${Number(ctx.seenTokens).toExponential(2)}
- 当前前向阶段：${ctx.phase}

本次训练已定位的问题（对应进度条上的标记，点击可查看详情与修复建议）：
${issuesText || '（暂无）'}

回答规则：
1. 先判断用户问题是否与"这次训练任务 / 当前这块监控大盘 / 上面列出的问题"相关。
   • 相关时（如"现在训练怎么样""loss 正常吗""MFU 达标吗""有哪些问题""这个问题怎么修""该不该继续跑"）：紧扣上方训练态和问题列表作答，以其中的数字为准，不编造未列出的数字或结论；确实没有涉及的就如实说"当前监控数据未涵盖"。
   • 用户说"这个/当前/这次 + 训练/任务/模型/step/问题"等指代，一律指上面这个正在监控的训练任务。
2. 与训练无关的常识、闲聊问题：直接简洁回答，不要硬扯到训练。
3. 一律用中文，专业、简洁，可用 Markdown（加粗/列表/代码块），先给结论再给依据。回答口吻像一位训练值班工程师在讨论当前这次训练，不要套用性能分析报告的模板措辞。`;
  }

  // 直接流式调用 DeepSeek;onToken(累积文本) 在每次增量到达时回调
  async function streamChat(messages, onToken, signal) {
    const resp = await fetch(DEEPSEEK.endpoint, {
      method: 'POST',
      signal,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getApiKey(),
      },
      body: JSON.stringify({
        model: DEEPSEEK.model,
        messages,
        stream: true,
        temperature: DEEPSEEK.temperature,
      }),
    });

    if (!resp.ok) {
      let detail = '';
      try { detail = (await resp.json())?.error?.message || ''; } catch (e) { try { detail = await resp.text(); } catch (e2) { /* 忽略 */ } }
      if (resp.status === 401) throw new Error('API Key 无效或未授权（401）。请点右上角齿轮图标检查。');
      if (resp.status === 402) throw new Error('该 Key 对应账户余额不足（402）。');
      if (resp.status === 429) throw new Error('请求过于频繁或额度用尽（429），请稍后再试。');
      throw new Error(`HTTP ${resp.status}${detail ? '：' + detail : ''}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n');
      buf = parts.pop();
      for (const line of parts) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content || '';
          if (delta) { full += delta; onToken(full); }
        } catch (e) { /* 忽略心跳/不完整分片 */ }
      }
    }
    return full;
  }

  // 提问一律走置顶问题卡片(见 appendQuestionCard):思考过程动辄几屏,右对齐小气泡一滚就没了,
  // 而"我问的是什么"恰恰是看思考过程时最需要一直在眼前的东西。
  function appendUserMessage(text) {
    appendQuestionCard(text);
  }

  // AI 回复统一走"缩进正文"外壳(不加背景气泡、不加头像行——表格/卡片这类内容挤在有色
  // 气泡里会很难看),流式更新/脚本演示/错误提示都只需要改 bodyEl.innerHTML。
  function createAiMessageShell() {
    const div = document.createElement('div');
    div.className = 'wzh-chat-message ai';
    div.innerHTML = '<div class="wzh-chat-body-content"></div>';
    return { el: div, bodyEl: div.querySelector('.wzh-chat-body-content') };
  }

  function appendSystemNotice(text) {
    const msgEl = $('trainChatMessages');
    if (!msgEl) return;
    msgEl.querySelector('.wzh-chat-welcome')?.remove();
    if (welcomeDots) { welcomeDots.destroy(); welcomeDots = null; } // 连同点阵 canvas 的 RAF/监听一起收掉
    const { el, bodyEl } = createAiMessageShell();
    bodyEl.innerHTML = '<div class="wzh-chat-answer">' + renderMarkdown(text) + '</div>';
    msgEl.appendChild(el);
    scrollChatToBottom(msgEl);
  }


  // ── 问题卡片 / 思考过程 / 回到底部 ────────────────────────────────────────
  // 一轮问答的三件套：
  //   1) 提问渲染成置顶卡片(锚点 + 原文，超过 3 行自动折叠)，思考过程再长也能回头看到题面；
  //   2) 思考过程按 thinking / usetool 两类节点串成一条竖轨，进行中的节点圆点呼吸，
  //      整体和每个节点各自计时；正式回答一开始，整段思考自动收起成一行；
  //   3) 用户往回翻时，对话框上方浮出「回到底部」——思考中它是跳动的三个点。

  let thinkingActive = false;   // 供「回到底部」按钮切换形态用（三个点 / 下箭头）
  let activeThink = null;       // 当前这轮的思考块,「新建对话」丢弃这一轮时要停掉它的秒表

  // 1m32s / 12s：与参考稿一致的紧凑写法，不写「0m」也不补零到分钟
  function fmtDuration(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(s / 60);
    return m ? m + 'm' + String(s % 60).padStart(2, '0') + 's' : s + 's';
  }

  // 提问里的上下文引用写成 #{...}，渲染成品牌蓝的引用块（对应输入框里 # 添加上下文）
  function renderQuestionText(text) {
    return escHtml(text)
      .replace(/#\{([^}]+)\}/g, (m, inner) => '<span class="wzh-chat-qref"># ' + inner + '</span>')
      .replace(/\n/g, '<br>');
  }

  // 思考正文只需要很轻的富文本：`code`、**强调**、空行分段，不走完整 markdown
  function renderThinkText(text) {
    return escHtml(text)
      .split(/\n{2,}/)
      .map((seg) => '<p>' + seg
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>') + '</p>')
      .join('');
  }

  // ── 会话主题行 ─────────────────────────────────────────────────────────
  // 发出第一个问题时冒出来的那一行(标题栏下方、置顶问题卡片上方)。默认从第一问里
  // 摘一句当主题,悬浮显示铅笔,点一下就地改名——一次会话往往要问好几轮,置顶卡片
  // 只留得住"最近这一问",而"这次会话在解决什么"要一直挂在最上面。
  const SESSION_TITLE_MAX = 20; // 自动摘出来的主题最多留这么多字,再长就省略号

  // 从第一问里摘主题:先脱掉 #{...} 的引用壳只留文字,再按标点切出第一个短句。
  function deriveSessionTitle(text) {
    const plain = String(text || '')
      .replace(/#\{([^}]+)\}/g, '$1')
      .replace(/\s+/g, ' ')
      .trim();
    if (!plain) return '新会话';
    const first = plain.split(/[。！？!?；;\n]/)[0].trim() || plain;
    return first.length > SESSION_TITLE_MAX
      ? first.slice(0, SESSION_TITLE_MAX) + '…'
      : first;
  }

  function setSessionTitle(title) {
    const rowEl = $('trainChatSession');
    const textEl = $('trainChatSessionText');
    if (!rowEl || !textEl) return;
    const t = String(title || '').trim() || '新会话';
    textEl.textContent = t;
    $('trainChatSessionBtn')?.setAttribute('title', t + '（点击重命名）');
    rowEl.hidden = false;
  }

  // 第一问落地时才建主题行;后续轮次沿用已有主题(用户可能已经手改过,别覆盖掉)
  function ensureSessionTitle(text, explicit) {
    const rowEl = $('trainChatSession');
    if (!rowEl || !rowEl.hidden) return;
    setSessionTitle(explicit || deriveSessionTitle(text));
  }

  function hideSessionTitle() {
    const rowEl = $('trainChatSession');
    if (!rowEl) return;
    endSessionTitleEdit(false);
    rowEl.hidden = true;
    const textEl = $('trainChatSessionText');
    if (textEl) textEl.textContent = '';
  }

  // 改名:按钮就地换成同尺寸的输入框(Enter/失焦保存,Esc 放弃)
  function beginSessionTitleEdit() {
    const btn = $('trainChatSessionBtn');
    const input = $('trainChatSessionInput');
    const textEl = $('trainChatSessionText');
    if (!btn || !input || !textEl || !input.hidden) return;
    input.value = textEl.textContent;
    btn.hidden = true;
    input.hidden = false;
    input.focus();
    input.select();
  }

  function endSessionTitleEdit(commit) {
    const btn = $('trainChatSessionBtn');
    const input = $('trainChatSessionInput');
    if (!btn || !input || input.hidden) return;
    if (commit) {
      const next = input.value.trim();
      if (next) setSessionTitle(next); // 改成空的就当没改,保留原主题
    }
    input.hidden = true;
    btn.hidden = false;
  }

  function initSessionTitle() {
    const btn = $('trainChatSessionBtn');
    const input = $('trainChatSessionInput');
    if (!btn || !input) return;
    btn.addEventListener('click', beginSessionTitleEdit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); endSessionTitleEdit(true); btn.focus(); }
      else if (e.key === 'Escape') { e.preventDefault(); endSessionTitleEdit(false); btn.focus(); }
    });
    input.addEventListener('blur', () => endSessionTitleEdit(true));
  }

  const QCARD_MAX_LINES = 3; // 锚点行之外，正文默认展示的行数

  function appendQuestionCard(text, opts) {
    const msgEl = $('trainChatMessages');
    if (!msgEl) return null;
    msgEl.querySelector('.wzh-chat-welcome')?.remove();
    if (welcomeDots) { welcomeDots.destroy(); welcomeDots = null; } // 连同点阵 canvas 的 RAF/监听一起收掉
    // 只让最新一轮的卡片置顶：多张 sticky 卡会在顶部互相叠住
    msgEl.querySelectorAll('.wzh-chat-qcard.is-pinned').forEach((c) => c.classList.remove('is-pinned'));

    const o = opts || {};
    ensureSessionTitle(text, o.sessionTitle); // 第一问落地时,顶上那行会话主题才出现
    flushPendingModelNote();                  // 欢迎屏上切过模型的话,标记补在这一问前面
    stickToBottom = true; // 新一轮提问:重新跟随最新内容
    const card = document.createElement('div');
    card.className = 'wzh-chat-qcard is-pinned';
    card.innerHTML =
      '<button class="wzh-chat-qcard-toggle" type="button" aria-expanded="true" title="收起提问">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>' +
      '</button>' +
      '<span class="wzh-chat-qcard-anchor">' +
        '<img src="src/pic/icon/folder.svg" alt="">' +
        '<span>' + escHtml(o.anchor || CHAT_TASK_NAME) + '</span>' +
      '</span>' +
      '<div class="wzh-chat-qcard-text">' + renderQuestionText(text) + '</div>';

    const textEl = card.querySelector('.wzh-chat-qcard-text');
    const toggle = card.querySelector('.wzh-chat-qcard-toggle');
    function setCollapsed(collapsed) {
      card.classList.toggle('is-collapsed', collapsed);
      toggle.setAttribute('aria-expanded', String(!collapsed));
      toggle.title = collapsed ? '展开提问' : '收起提问';
      scheduleFadeUpdate(msgEl);
    }
    // 折叠/展开挂在整张卡片上,箭头的点击冒泡到这里,两者是同一个动作:
    // 问题被夹住时正文只剩三行,最自然的手势是点卡片本身,而不是去瞄那个 20px 的小箭头。
    card.addEventListener('click', (e) => {
      if (!card.classList.contains('is-clampable')) return;  // 没夹住就没有折叠态可言
      if (e.target.closest('a')) return;                      // 正文里的链接照常走自己的行为
      // 划词选正文时松开鼠标也会触发 click,别把它当成折叠手势
      const sel = window.getSelection();
      if (sel && !sel.isCollapsed && card.contains(sel.anchorNode)) return;
      setCollapsed(!card.classList.contains('is-collapsed'));
    });

    msgEl.appendChild(card);
    // 量一次真实高度再决定要不要折叠：不足 3 行的短问题连折叠箭头都不出现。
    // 必须等布局完成后再量，插入的同一帧里 scrollHeight 还没定下来。
    requestAnimationFrame(() => {
      const lh = parseFloat(getComputedStyle(textEl).lineHeight) || 21;
      if (textEl.scrollHeight > lh * QCARD_MAX_LINES + 2) {
        card.classList.add('is-clampable');
        setCollapsed(true);                                 // 超长即默认折叠
      }
      scheduleFadeUpdate(msgEl);
    });
    scrollChatToBottom(msgEl);
    return card;
  }

  // 思考过程块。用法：
  //   const think = createThinkBlock(bodyEl, { clockScale });
  //   const node = think.startNode({ kind:'thinking'|'usetool', title, doneTitle });
  //   node.setText(...) / node.appendText(...); think.finishNode();
  //   think.finish();   // 正式回答开始时调用：停表 + 自动收起
  // clockScale 只服务于固定脚本演示——演示流程压到几秒跑完，但计时按真实排查节奏展示；
  // 真实对话（sendMessage）走默认的 1，显示的就是实际耗时。
  function createThinkBlock(container, opts) {
    const o = opts || {};
    const scale = o.clockScale || 1;
    const msgEl = $('trainChatMessages');

    const box = document.createElement('div');
    box.className = 'wzh-chat-think';
    box.innerHTML =
      '<button class="wzh-chat-think-head" type="button" aria-expanded="false" title="展开/收起思考过程">' +
        '<span class="wzh-chat-think-head-label">思考中</span>' +
        '<span class="wzh-chat-think-head-time"></span>' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>' +
      '</button>' +
      '<div class="wzh-chat-think-body"></div>';
    container.appendChild(box);

    const bodyEl = box.querySelector('.wzh-chat-think-body');
    const headBtn = box.querySelector('.wzh-chat-think-head');
    const headTimeEl = box.querySelector('.wzh-chat-think-head-time');
    const headLabelEl = box.querySelector('.wzh-chat-think-head-label');
    headBtn.addEventListener('click', () => {
      const collapsed = box.classList.toggle('is-collapsed');
      headBtn.setAttribute('aria-expanded', String(!collapsed));
      scheduleFadeUpdate(msgEl);
    });

    const startedAt = Date.now();
    let current = null;   // { el, timeEl, titleEl, doneTitle, startedAt }
    let ticker = 0;
    let totalMs = 0;

    thinkingActive = true;
    updateJumpBtn();

    function elapsed(from) { return (Date.now() - from) * scale; }

    function tick() {
      headTimeEl.textContent = fmtDuration(elapsed(startedAt));
      if (current) current.timeEl.textContent = fmtDuration(elapsed(current.startedAt));
    }
    ticker = setInterval(tick, 200);
    tick();

    // 思考过程自动滚屏：只在用户本来就贴着底部时跟随，往回翻历史不会被硬拽回来
    function follow() { scrollChatToBottom(msgEl, { instant: true, onlyIfNearBottom: true }); }

    function finishNode() {
      if (!current) return;
      current.timeEl.textContent = fmtDuration(elapsed(current.startedAt));
      current.titleEl.textContent = current.doneTitle;
      current.el.classList.remove('is-running');
      current = null;
    }

    const api = {
      el: box,
      startNode(cfg) {
        finishNode();
        const c = cfg || {};
        const node = document.createElement('div');
        node.className = 'wzh-chat-think-node is-running';
        node.dataset.kind = c.kind === 'usetool' ? 'usetool' : 'thinking';
        node.innerHTML =
          '<span class="wzh-chat-think-dot"></span>' +
          '<div class="wzh-chat-think-node-head">' +
            '<span class="wzh-chat-think-node-title"></span>' +
            '<span class="wzh-chat-think-node-time">0s</span>' +
          '</div>' +
          '<div class="wzh-chat-think-node-text"></div>';
        const titleEl = node.querySelector('.wzh-chat-think-node-title');
        titleEl.textContent = c.title || (c.kind === 'usetool' ? '调用工具' : '思考中');
        bodyEl.appendChild(node);
        current = {
          el: node,
          titleEl,
          timeEl: node.querySelector('.wzh-chat-think-node-time'),
          textEl: node.querySelector('.wzh-chat-think-node-text'),
          doneTitle: c.doneTitle || (c.kind === 'usetool' ? (c.title || '调用工具') : '思考完成'),
          startedAt: Date.now(),
        };
        tick();
        follow();
        return {
          setText(t) { current && (current.textEl.innerHTML = renderThinkText(t)); follow(); },
        };
      },
      // 流式写入当前节点（打字机），返回 Promise 便于把脚本串成时间线
      // 与回答区的 typeMarkdownInto 共用同一档节奏参数，两段的手感才一致
      typeText(text, msPerChunk) {
        const target = current && current.textEl;
        if (!target) return Promise.resolve();
        const step = msPerChunk || 16;
        return new Promise((resolve) => {
          let i = 0;
          const timer = setInterval(() => {
            if (chatStopped) { clearInterval(timer); resolve(); return; } // 用户按了停止键
            i = Math.min(text.length, i + 2);
            target.innerHTML = renderThinkText(text.slice(0, i));
            follow();
            if (i >= text.length) { clearInterval(timer); resolve(); }
          }, step);
        });
      },
      finishNode,
      // 整轮被丢弃时(「新建对话」打断)的收场:只停表。DOM 马上就要被整块扔掉,不用补
      // 收束节点、也不用改标题;但秒表是 setInterval,不显式停就会挂在游离节点上一直跑。
      dispose() {
        finishNode();
        if (ticker) { clearInterval(ticker); ticker = 0; }
        thinkingActive = false;
        if (activeThink === api) activeThink = null;
      },
      // 正式回答开始：停表、标题改成「思考完成 2m36s」并自动收起
      finish() {
        finishNode();
        if (ticker) { clearInterval(ticker); ticker = 0; }
        // 竖轨末端补一个收束节点,把思考过程和正式回答接上
        const last = document.createElement('div');
        last.className = 'wzh-chat-think-node is-final';
        last.innerHTML =
          '<span class="wzh-chat-think-dot"></span>' +
          '<div class="wzh-chat-think-node-head">' +
            '<span class="wzh-chat-think-node-title">思考完成，开始回答：</span>' +
          '</div>';
        bodyEl.appendChild(last);
        totalMs = elapsed(startedAt);
        headTimeEl.textContent = fmtDuration(totalMs);
        headLabelEl.textContent = '思考完成';
        box.classList.add('is-done', 'is-collapsed');
        headBtn.setAttribute('aria-expanded', 'false');
        thinkingActive = false;
        updateJumpBtn();
        scheduleFadeUpdate(msgEl);
        return totalMs;
      },
    };
    activeThink = api; // 「新建对话」要停掉这块的秒表,见 resetConversation
    return api;
  }

  // 回答区打字机:按 markdown 源码逐段重渲染，而不是逐个 DOM 节点插入——
  // 列表 / 表格这类块级结构只有整段重渲染才能得到正确的中间态。
  function typeMarkdownInto(el, text, msPerTick, charsPerTick, onRender) {
    const msgEl = $('trainChatMessages');
    const step = msPerTick || 28;
    const chunk = charsPerTick || 2;
    return new Promise((resolve) => {
      let i = 0;
      const timer = setInterval(() => {
        if (chatStopped) { clearInterval(timer); resolve(); return; } // 用户按了停止键
        i = Math.min(text.length, i + chunk);
        // 可视化卡片是可交互节点。当前段落重绘前先摘下并保留同一批 DOM，
        // 重绘后再由 onRender 放回新位置，避免动画期间按钮每 16ms 被替换一次。
        const retainedCards = new Map(Array.from(el.querySelectorAll('.wzh-chat-viz-card')).map((card) => [
          card.dataset.vizModule,
          card,
        ]));
        el.innerHTML = renderMarkdown(text.slice(0, i));
        if (onRender) onRender(retainedCards);
        scrollChatToBottom(msgEl, { instant: true, onlyIfNearBottom: true });
        if (i >= text.length) { clearInterval(timer); resolve(); }
      }, step);
    });
  }

  // 固定诊断回答与 v15 报告模块之间的语义映射。卡片只负责打开现有图表，
  // 数据和绘制逻辑仍全部来自 v15-report-modules-pto.html。
  const ANSWER_VISUALIZATIONS = {
    top1: {
      title: 'Rank 级横向对比',
      desc: '对齐 8 张卡的计算、通信、等待与 Free 时间构成',
    },
    top2: {
      title: '计算-通信重叠率',
      desc: '在同一时间轴上查看计算区间与暴露通信',
    },
    top3: {
      title: 'PP 流水线 Bubble',
      desc: '查看 4 个 stage 的 1F1B 调度窗口与空泡分布',
    },
  };
  const ANSWER_VIZ_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M4 19V9M10 19V5M16 19v-7M3 21h18"></path></svg>';
  const ANSWER_VIZ_ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="m9 6 6 6-6 6"></path></svg>';
  let chatVizState = null;

  function createAnswerVisualizationCard(moduleId) {
    const meta = ANSWER_VISUALIZATIONS[moduleId];
    if (!meta) return null;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'wzh-chat-viz-card';
    button.dataset.vizModule = moduleId;
    button.dataset.vizTitle = meta.title;
    button.setAttribute('aria-label', '打开' + meta.title);
    button.innerHTML =
      '<span class="wzh-chat-viz-card-icon">' + ANSWER_VIZ_ICON + '</span>' +
      '<span class="wzh-chat-viz-card-copy">' +
        '<span class="wzh-chat-viz-card-title">' + meta.title + '</span>' +
        '<span class="wzh-chat-viz-card-desc">' + meta.desc + '</span>' +
      '</span>' +
      '<span class="wzh-chat-viz-card-arrow">' + ANSWER_VIZ_ARROW + '</span>';
    return button;
  }

  function nextAnswerBlock(start, wantedTag) {
    let node = start?.nextElementSibling || null;
    while (node && !/^H[23]$/.test(node.tagName)) {
      if (node.tagName === wantedTag) return node;
      node = node.nextElementSibling;
    }
    return null;
  }

  function addProfilingVisualizationCards(answer, retainedCards) {
    if (!answer) return;
    const nodes = Array.from(answer.querySelectorAll('h3, li'));
    const bubblePoint = nodes.find((node) => node.tagName === 'LI' && node.textContent.includes('真正的瓶颈是流水线末级过载'));
    const rankHeading = nodes.find((node) => node.tagName === 'H3' && node.textContent.includes('PP 末级计算过载'));
    const overlapHeading = nodes.find((node) => node.tagName === 'H3' && node.textContent.includes('计算-通信零重叠'));
    const placements = [
      { moduleId: 'top3', target: bubblePoint?.closest('ul') },
      { moduleId: 'top1', target: nextAnswerBlock(rankHeading, 'TABLE') || rankHeading },
      { moduleId: 'top2', target: nextAnswerBlock(overlapHeading, 'UL') || overlapHeading },
    ];
    placements.forEach(({ moduleId, target }) => {
      if (!target || answer.querySelector('.wzh-chat-viz-card[data-viz-module="' + moduleId + '"]')) return;
      const card = retainedCards?.get(moduleId) || createAnswerVisualizationCard(moduleId);
      if (!card) return;
      target.insertAdjacentElement('afterend', card);
      // 当前段落在打字期间会整段重建。若用户已经打开过这张卡，重建后的新按钮
      // 继续接管激活态与焦点回退引用，避免下一帧把选中状态一并抹掉。
      if (chatVizState?.activeModuleId === moduleId) {
        card.classList.add('is-active');
        chatVizState.triggers.set(moduleId, card);
        chatVizState.trigger = card;
      }
    });
  }

  function visualizationFrameSrc(moduleId) {
    const theme = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
    return 'v15-report-modules-pto.html?embed=chart&module=' + encodeURIComponent(moduleId) + '&size=8&theme=' + theme;
  }

  function activateChatVisualizationTab(moduleId, trigger) {
    const tabs = $('trainChatVizTabs');
    const viewport = $('trainChatVizViewport');
    if (!tabs || !viewport || !chatVizState) return;
    const tab = tabs.querySelector('.wzh-chat-viz-tab[data-viz-module="' + moduleId + '"]');
    const frame = viewport.querySelector('.wzh-chat-viz-frame[data-viz-module="' + moduleId + '"]');
    if (!tab || !frame) return;

    if (trigger) chatVizState.triggers.set(moduleId, trigger);
    chatVizState.activeModuleId = moduleId;
    chatVizState.trigger = chatVizState.triggers.get(moduleId) || null;
    tabs.querySelectorAll('.wzh-chat-viz-tab').forEach((item) => {
      const active = item === tab;
      item.setAttribute('aria-selected', String(active));
      item.tabIndex = active ? 0 : -1;
    });
    viewport.querySelectorAll('.wzh-chat-viz-frame').forEach((item) => { item.hidden = item !== frame; });
    document.querySelectorAll('.wzh-chat-viz-card.is-active').forEach((card) => card.classList.remove('is-active'));
    chatVizState.trigger?.classList.add('is-active');
    tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    scheduleFadeUpdate();
  }

  function createChatVisualizationTab(moduleId, title) {
    const tabs = $('trainChatVizTabs');
    const viewport = $('trainChatVizViewport');
    const meta = ANSWER_VISUALIZATIONS[moduleId];
    if (!tabs || !viewport || !meta) return;

    const tab = document.createElement('div');
    tab.className = 'wzh-chat-viz-tab';
    tab.dataset.vizModule = moduleId;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', 'false');
    tab.tabIndex = -1;
    tab.innerHTML =
      '<span class="wzh-chat-viz-tab-title"></span>' +
      '<button class="wzh-chat-viz-tab-close" type="button" aria-label="关闭此可视化" title="关闭此可视化">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>' +
      '</button>';
    tab.querySelector('.wzh-chat-viz-tab-title').textContent = title || meta.title;
    tab.addEventListener('click', (event) => {
      if (event.target.closest('.wzh-chat-viz-tab-close')) return;
      activateChatVisualizationTab(moduleId);
    });
    tab.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateChatVisualizationTab(moduleId);
        return;
      }
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      const items = Array.from(tabs.querySelectorAll('.wzh-chat-viz-tab'));
      const index = items.indexOf(tab);
      const step = event.key === 'ArrowRight' ? 1 : -1;
      const next = items[(index + step + items.length) % items.length];
      if (next) {
        activateChatVisualizationTab(next.dataset.vizModule);
        next.focus();
      }
    });
    tab.querySelector('.wzh-chat-viz-tab-close').addEventListener('click', (event) => {
      event.stopPropagation();
      closeChatVisualizationTab(moduleId);
    });
    tabs.appendChild(tab);

    const frame = document.createElement('iframe');
    frame.className = 'wzh-chat-viz-frame';
    frame.dataset.vizModule = moduleId;
    frame.title = title || meta.title;
    frame.loading = 'lazy';
    frame.hidden = true;
    frame.src = visualizationFrameSrc(moduleId);
    viewport.appendChild(frame);
  }

  function openChatVisualization(moduleId, title, trigger) {
    const panel = $('trainChatPanel');
    const pane = $('trainChatVizPane');
    const tabs = $('trainChatVizTabs');
    if (!panel || !pane || !tabs || !ANSWER_VISUALIZATIONS[moduleId]) return;

    if (!panel.classList.contains('is-visualizing')) {
      const rect = panel.getBoundingClientRect();
      chatVizState = {
        widthValue: panel.style.getPropertyValue('--wzh-chat-w'),
        trigger: trigger || null,
        activeModuleId: null,
        triggers: new Map(),
      };
      panel.style.setProperty('--wzh-chat-w', Math.round(rect.width) + 'px');
      panel.style.setProperty('--wzh-viz-top', Math.max(8, Math.round(rect.top)) + 'px');
      panel.style.setProperty('--wzh-viz-right', Math.max(8, Math.round(window.innerWidth - rect.right)) + 'px');
      panel.style.setProperty('--wzh-viz-bottom', Math.max(8, Math.round(window.innerHeight - rect.bottom)) + 'px');
      panel.classList.add('is-visualizing');
      pane.hidden = false;
    }

    if (!tabs.querySelector('.wzh-chat-viz-tab[data-viz-module="' + moduleId + '"]')) {
      createChatVisualizationTab(moduleId, title);
    }
    activateChatVisualizationTab(moduleId, trigger);
  }

  function closeChatVisualizationTab(moduleId) {
    const tabs = $('trainChatVizTabs');
    const viewport = $('trainChatVizViewport');
    if (!tabs || !viewport || !chatVizState) return;
    const tab = tabs.querySelector('.wzh-chat-viz-tab[data-viz-module="' + moduleId + '"]');
    const frame = viewport.querySelector('.wzh-chat-viz-frame[data-viz-module="' + moduleId + '"]');
    if (!tab) return;
    const items = Array.from(tabs.querySelectorAll('.wzh-chat-viz-tab'));
    const index = items.indexOf(tab);
    const wasActive = chatVizState.activeModuleId === moduleId;
    const trigger = chatVizState.triggers.get(moduleId) || null;
    tab.remove();
    frame?.remove();
    chatVizState.triggers.delete(moduleId);

    const remaining = Array.from(tabs.querySelectorAll('.wzh-chat-viz-tab'));
    if (!remaining.length) {
      chatVizState.trigger = trigger;
      closeChatVisualization();
      return;
    }
    if (wasActive) {
      const next = remaining[Math.min(index, remaining.length - 1)];
      activateChatVisualizationTab(next.dataset.vizModule);
      next.focus();
    }
  }

  function closeChatVisualization(opts) {
    const panel = $('trainChatPanel');
    const pane = $('trainChatVizPane');
    if (!panel || !panel.classList.contains('is-visualizing')) return false;
    const trigger = chatVizState?.trigger;
    panel.classList.remove('is-visualizing');
    panel.style.removeProperty('--wzh-viz-top');
    panel.style.removeProperty('--wzh-viz-right');
    panel.style.removeProperty('--wzh-viz-bottom');
    if (chatVizState?.widthValue) panel.style.setProperty('--wzh-chat-w', chatVizState.widthValue);
    else panel.style.removeProperty('--wzh-chat-w');
    if (pane) pane.hidden = true;
    $('trainChatVizTabs')?.replaceChildren();
    $('trainChatVizViewport')?.replaceChildren();
    document.querySelectorAll('.wzh-chat-viz-card.is-active').forEach((card) => card.classList.remove('is-active'));
    chatVizState = null;
    scheduleFadeUpdate();
    if (opts?.restoreFocus !== false && trigger?.isConnected) trigger.focus();
    return true;
  }

  // 回答尾部的操作栏。赞/踩互斥,重试和复制在这个演示里只做视觉反馈。
  function buildAnswerActions() {
    const bar = document.createElement('div');
    bar.className = 'wzh-chat-answer-actions';
    [
      { icon: 'retry.svg', label: '重新生成' },
      { icon: 'Copy.svg', label: '复制' },
      { icon: 'Like.svg', label: '有帮助', toggle: 'vote' },
      { icon: 'Dislike.svg', label: '没帮助', toggle: 'vote' },
    ].forEach((a) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wzh-chat-answer-action';
      btn.title = a.label;
      btn.setAttribute('aria-label', a.label);
      btn.innerHTML = '<img src="src/pic/icon/' + a.icon + '" alt="">';
      if (a.toggle) {
        btn.addEventListener('click', () => {
          const on = btn.classList.contains('is-active');
          bar.querySelectorAll('.wzh-chat-answer-action.is-active')
