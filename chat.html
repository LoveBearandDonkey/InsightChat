      font-family: var(--font-mono); font-size: 11px;
      color: var(--foreground-secondary);
      background: color-mix(in srgb, var(--foreground) 7%, transparent);
      padding: 1px 4px; border-radius: 3px;
    }

    /* 正式回答:比思考正文大一档、用一级文字色,和上面压浅的思考过程拉开层次 */
    .wzh-chat-answer { font-size: 14px; line-height: 1.7; color: var(--foreground); }
    .wzh-chat-answer p,
    .wzh-chat-answer li,
    .wzh-chat-answer td { color: var(--foreground); }
    /* 回答里的 `code` 走一级文字色,不跟着 .wzh-chat-messages code 用主色:诊断报告里表名、
       列名、环境变量密度很高(`record_shapes=false`、`ClusterTimeSummary`…),一段话里蹦出
       七八个蓝字反而比不标还乱。底色留着,标识符的边界还是要划出来。 */
    .wzh-chat-answer code { color: var(--foreground); }

    /* 回答中的横向可视化入口：它是正文证据的延伸，不使用欢迎页大卡片的视觉重量。 */
    .wzh-chat-viz-card {
      width: 100%; min-width: 0; box-sizing: border-box;
      display: grid; grid-template-columns: 34px minmax(0, 1fr) 20px;
      align-items: center; gap: 10px;
      margin: 10px 0 12px; padding: 11px 12px;
      border: 1px solid color-mix(in srgb, var(--foreground) 14%, transparent);
      border-radius: 10px;
      background: var(--surface-1);
      box-shadow: none;
      color: var(--foreground); text-align: left; cursor: pointer;
      transition: border-color var(--duration-fast) var(--easing-default),
                  background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-viz-card:hover {
      border-color: color-mix(in srgb, var(--foreground) 22%, transparent);
      background: linear-gradient(100deg,
        color-mix(in srgb, var(--foreground) 6%, var(--surface-1)) 0%,
        var(--surface-1) 100%);
    }
    .wzh-chat-viz-card:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--foreground) 28%, transparent);
      outline-offset: 2px;
    }
    .wzh-chat-viz-card.is-active {
      border-color: color-mix(in srgb, var(--foreground) 24%, transparent);
      background: linear-gradient(100deg,
        color-mix(in srgb, var(--foreground) 7%, var(--surface-1)) 0%,
        var(--surface-1) 100%);
    }
    .wzh-chat-viz-card-icon {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 8px;
      background: color-mix(in srgb, var(--brand-accent) 14%, var(--surface-1));
      color: var(--brand-accent);
    }
    .wzh-chat-viz-card-icon svg,
    .wzh-chat-viz-card-arrow svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wzh-chat-viz-card-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .wzh-chat-viz-card-title { font-size: 13px; line-height: 1.45; font-weight: 600; color: var(--foreground); }
    .wzh-chat-viz-card-desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; line-height: 1.5; color: var(--foreground-secondary); }
    .wzh-chat-viz-card-arrow { display: grid; place-items: center; color: var(--foreground-muted); }

    /* 展开后的右栏：标题与图表来源留在宿主侧，iframe 只承载 v15 原页面的图表模块。 */
    .wzh-chat-viz-pane {
      grid-column: 2; grid-row: 1 / 4;
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
      border-left: 1px solid var(--border-default);
      background: var(--surface-1);
    }
    .wzh-chat-viz-pane[hidden] { display: none; }
    .wzh-chat-viz-head {
      min-height: 55px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 12px 7px 10px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .wzh-chat-viz-tabs {
      min-width: 0; flex: 1 1 auto;
      display: flex; align-items: center; gap: 4px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
    }
    .wzh-chat-viz-tabs::-webkit-scrollbar { display: none; }
    .wzh-chat-viz-tab {
      min-width: 0; max-width: 100%; width: max-content; flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 6px 6px 10px;
      border: 0; border-radius: 7px;
      background: transparent; color: var(--foreground-secondary);
      cursor: pointer; outline: none;
      transition: background var(--duration-fast) var(--easing-default),
                  color var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-viz-tab:hover { background: var(--state-hover); color: var(--foreground); }
    .wzh-chat-viz-tab[aria-selected="true"] {
      background: color-mix(in srgb, var(--brand-accent) var(--brand-tint), transparent);
      color: var(--brand-accent);
    }
    .wzh-chat-viz-tab:focus-visible { box-shadow: 0 0 0 2px var(--focus-ring); }
    .wzh-chat-viz-tab-title {
      min-width: 0; flex: 1 1 auto;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 12px; line-height: 1.4; font-weight: 500;
    }
    .wzh-chat-viz-tab-close {
      width: 20px; height: 20px; flex: 0 0 auto; padding: 0;
      display: grid; place-items: center;
      border: 0; border-radius: 5px; background: transparent;
      color: var(--foreground-muted); cursor: pointer;
    }
    .wzh-chat-viz-tab-close:hover { background: color-mix(in srgb, var(--foreground) 9%, transparent); color: var(--foreground); }
    .wzh-chat-viz-tab-close svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .wzh-chat-viz-close {
      width: 28px; height: 28px; flex: 0 0 auto; padding: 0;
      display: grid; place-items: center;
      border: 0; border-radius: 7px; background: transparent; color: var(--foreground); cursor: pointer;
    }
    .wzh-chat-viz-close:hover { background: var(--state-hover); }
    .wzh-chat-viz-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .wzh-chat-viz-viewport { min-width: 0; min-height: 0; flex: 1 1 auto; background: var(--background); }
    .wzh-chat-viz-frame { display: block; width: 100%; height: 100%; border: 0; background: var(--background); }
    .wzh-chat-viz-frame[hidden] { display: none; }
    /* 定位锚点:点一下让左边泳道图跳到对应那一行(见 boot 里的委托 + window.WZH_LOCATE_LANE)。
       右键「置入智能对话」是图 → 对话,这个锚点是对话 → 图,一来一回才算协作。
       外观直接对齐输入框里的 # 上下文标签(.wzh-chat-input-chip):同样的 --mi-brand-blue 12%
       底、同样的品牌蓝字、同样的 4px 圆角。两者是同一件事的两个方向——# 标签是用户指给
       助手看的对象,定位锚点是助手指给用户看的对象,长一个样才读得出这层对称。
       所以也不留描边:# 标签是裸底色,这里再加一圈就比它重了,可点性交给 hover 加深。 */
    .wzh-chat-locate {
      display: inline-flex; align-items: center; gap: 3px; vertical-align: baseline;
      margin: 0 1px; padding: 1px 5px;
      font-family: inherit; font-size: 11px; line-height: 1.6;
      color: var(--mi-brand-blue);
      background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint-strong), transparent);
      border: none; border-radius: 4px; cursor: pointer;
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-locate:hover { background: color-mix(in srgb, var(--mi-brand-blue) 22%, transparent); }
    /* 图标跟着 color 走(stroke: currentColor),所以文字色一变它自动跟上 */
    .wzh-chat-locate svg {
      width: 11px; height: 11px; flex: 0 0 auto;
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
    }
    /* 点中后的回执:图那边会闪一下选中行,对话这边也闪一下,两处同时亮才看得出是一次联动 */
    .wzh-chat-locate.is-hit { animation: wzh-chat-locate-hit .7s var(--easing-default); }
    @keyframes wzh-chat-locate-hit {
      0%   { background: var(--mi-brand-blue); color: #FFF; }
      100% { background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint-strong), transparent); color: var(--mi-brand-blue); }
    }

    /* 竖轨末端的收束节点:没有正文和计时,只用一个实心圆点 + 一句话把思考过程和
       下面的正式回答接上,展开思考时能看清"到这里就开始回答了"。 */
    .wzh-chat-think-node.is-final .wzh-chat-think-dot { background: var(--brand-green); }
    .wzh-chat-think-node.is-final .wzh-chat-think-node-head { margin-bottom: 0; }

    /* 回答尾部的操作栏:重试 / 复制 / 赞 / 踩。纯展示态的图标按钮,不加边框和底色,
       hover 才浮出一层浅底,避免四个小图标在回答下面显得比正文还重。 */
    .wzh-chat-answer-actions {
      display: flex; align-items: center; gap: 4px;
      margin-top: 4px;
    }
    .wzh-chat-answer-action {
      width: 26px; height: 26px; padding: 0; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer;
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-answer-action:hover { background: var(--surface-2); }
    .wzh-chat-answer-action.is-active { background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint-strong), transparent); }
    /* 图标不压暗,与头部 .wzh-chat-head-btn img 保持同一档颜色 */
    .wzh-chat-answer-action img { width: 16px; height: 16px; display: block; }

    /* ── 回到底部按钮 ──────────────────────────────────────────────────
       不放在消息区内部(那样会跟着内容一起滚),挂在消息区与输入框之间的零高度
       容器上,始终浮在对话框正上方居中。思考中换成跳动的三个点——"下面还在出
       内容"和"下面有你没看的内容"是两种不同的暗示。 */
    .wzh-chat-jump-wrap { position: relative; height: 0; flex-shrink: 0; z-index: 4; }
    .wzh-chat-jump-btn {
      position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 6px);
      width: 32px; height: 32px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-subtle); border-radius: 50%;
      background: var(--surface-1); color: var(--foreground-secondary);
      box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .28);
      cursor: pointer; opacity: 0; pointer-events: none;
      transition: opacity var(--duration-fast) var(--easing-default),
                  transform var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-jump-btn.is-visible { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .wzh-chat-jump-btn:hover { background: var(--surface-2); border-color: var(--border-default); }
    .wzh-chat-jump-btn svg {
      width: 15px; height: 15px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    /* 两种形态互斥:普通态下箭头,思考中跳动的三个点 */
    .wzh-chat-jump-dots { display: none; align-items: center; gap: 3px; }
    /* 点跟箭头同色(currentColor = 按钮的 --foreground-secondary):这颗按钮是还有内容没看
       的提示,不是可强调的品牌动作,原来的品牌蓝在灰白小圆钮里过于抢眼 */
    .wzh-chat-jump-dots i {
      width: 4px; height: 4px; border-radius: 50%; background: currentColor;
      display: block; animation: wzh-chat-jump-bounce 1s ease-in-out infinite;
    }
    .wzh-chat-jump-dots i:nth-child(2) { animation-delay: .14s; }
    .wzh-chat-jump-dots i:nth-child(3) { animation-delay: .28s; }
    .wzh-chat-jump-btn.is-thinking .wzh-chat-jump-arrow { display: none; }
    .wzh-chat-jump-btn.is-thinking .wzh-chat-jump-dots { display: inline-flex; }
    /* 悬浮(或键盘聚焦)到这颗按钮上时,思考中的跳动点先让位给下箭头——三个点只说明"还在生成",
       没说明"点我能干什么";指针都已经落上来了,该直说这一下点下去是回到最新位置。 */
    .wzh-chat-jump-btn.is-thinking:hover .wzh-chat-jump-dots,
    .wzh-chat-jump-btn.is-thinking:focus-visible .wzh-chat-jump-dots { display: none; }
    .wzh-chat-jump-btn.is-thinking:hover .wzh-chat-jump-arrow,
    .wzh-chat-jump-btn.is-thinking:focus-visible .wzh-chat-jump-arrow { display: block; }
    @keyframes wzh-chat-jump-bounce {
      0%, 60%, 100% { transform: translateY(0);    opacity: .55; }
      30%           { transform: translateY(-4px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wzh-chat-think-node.is-running .wzh-chat-think-dot,
      .wzh-chat-jump-dots i { animation: none; }
      .wzh-chat-think-node.is-running .wzh-chat-think-node-title {
        background-image: none; color: var(--foreground); -webkit-text-fill-color: currentColor;
      }
    }

    /* 图标 svg 本身是黑色描边,深色主题下整体反相;彩色 PNG(头像/引导卡图标)不参与 */
    :root[data-theme='dark'] .wzh-chat-head-btn img,
    :root[data-theme='dark'] .wzh-chat-history-item img,
    :root[data-theme='dark'] .wzh-chat-head-caret,
    :root[data-theme='dark'] .wzh-chat-tool img,
    :root[data-theme='dark'] .wzh-chat-mic-btn img,
    :root[data-theme='dark'] .wzh-chat-answer-action img,
    :root[data-theme='dark'] .wzh-chat-anchor-close img,
    :root[data-theme='dark'] .wzh-chat-session-pen,
    :root[data-theme='dark'] .wzh-chat-send-btn.is-stop img { filter: invert(1); }
    /* 点阵在暗色下只改浓度、颜色仍沿用浅色那套(见 .wzh-chat-welcome-hero):
       #6366F1 叠 8% 压在近黑的面板底上几乎没有对比度,静置时的底纹等于没有。 */
    :root[data-theme='dark'] .wzh-chat-welcome-hero { --wzh-dots-alpha: .22; }

    #trainChatToggle.is-active { background: var(--state-selected); color: var(--foreground); }
    #trainChatToggle.is-active .pto-ide-frame__window-icon { stroke: var(--accent); opacity: 1; }

    @media (max-width: 720px) {
      .wzh-chat-panel.is-floating { left: 8px; width: auto; max-width: none; }
    }

/* ═══════════════════════════════════════════════════════════════════════════
   [8] 本页外壳:整屏 IDE frame + 一张空白内容卡
   ═══════════════════════════════════════════════════════════════════════════ */
html, body {
  height: 100%;
  background: var(--ide-frame-page-bg);
}
body.chat-shell-page {
  margin: 0;
  overflow: hidden;
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: var(--line-height-body);
}
/* 顶栏/侧栏/内容区铺满整屏,而不是 pattern 默认的 4:3 预览卡 */
.pto-ide-frame {
  width: 100vw;
  height: 100vh;
  aspect-ratio: auto;
  border-radius: 0;
  box-shadow: none;
}
.pto-ide-frame__topbar-left { flex: 1 1 auto; }
.pto-ide-frame__topbar-left > .pto-ide-frame__host-chip,
.pto-ide-frame__topbar-left > .pto-ide-frame__workspace { flex: 0 0 auto; }
.pto-ide-frame__topbar-right { flex: 0 0 auto; }

/* 工作区:左内容区 + 右对话面板两列(挤入式);面板收起或切成悬浮窗时,内容区自动铺满。
   两列之间那 8px 不再用 gap,而是交给可拖动的 .msi-resizer--v ——面板收起或切成悬浮窗时
   分隔条跟着一起隐藏,内容区照样铺满。 */
.chat-shell-workarea {
  padding: 0 8px 8px 0;
  flex-direction: row;
  align-items: stretch;
  gap: 0;
}
.chat-shell-pane { flex: 1 1 auto; min-width: 0; border-radius: var(--radius-xl); }

/* ── 窗口控制:两条可拖动的分隔条 ───────────────────────────────────────
   横条(--h)夹在泳道图和底部详情栏之间,拖它改详情栏高度;竖条(--v)夹在内容区和
   智能对话面板之间,拖它改面板宽度。两条都只改一个 CSS 变量,布局本身还是原来那套
   flex/grid;上限统一卡在容器的 50%。拖动逻辑见页尾 initPaneResizers。
   把手常驻显示:静态取 --border-default(和四周卡片描边同一个灰,浅色 12%、深色 10%,
   跟着主题走),悬浮/聚焦/拖动时才换成主色,让「能拖」这件事一眼看得出来。
   主题表里的中性灰 --card-neutral-* 只有 4~5%,压在这么细的一根条上等于没有,所以没用它。 */
.msi-resizer {
  position: relative;
  flex: 0 0 auto;
  padding: 0;
  border: 0;
  background: transparent;
  touch-action: none;
  z-index: 3;
}
.msi-resizer[hidden] { display: none; }
.msi-resizer:focus-visible { outline: none; }
.msi-resizer::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: var(--radius-pill, 999px);
  color: var(--border-default);
  background: currentColor;
  transition: color var(--duration-fast, 120ms) var(--easing-default, ease);
}
.msi-resizer:hover::before,
.msi-resizer:focus-visible::before,
.msi-resizer.is-dragging::before {
  color: color-mix(in srgb, var(--msi-accent) 62%, transparent);
}
/* 横条:泳道图 ↕ 底部详情栏。12px 高正好补上原先 .msi-content-foot 的 margin-top */
.msi-resizer--h { height: 12px; margin: 0 16px; cursor: row-resize; }
.msi-resizer--h::before {
  width: 3px;
  height: 3px;
  box-shadow: -7px 0 0 currentColor, 7px 0 0 currentColor;
}
/* 竖条:内容区 ↔ 智能对话面板 */
.msi-resizer--v { align-self: stretch; width: 8px; cursor: col-resize; }
.msi-resizer--v::before {
  width: 3px;
  height: 3px;
  box-shadow: 0 -7px 0 currentColor, 0 7px 0 currentColor;
}

/* 拖动期间整页锁住选区和光标:划过按钮/文字时光标不跳,也不会顺手把文本选中 */
body.is-pane-resizing,
body.is-pane-resizing * { user-select: none; }
body.is-pane-resizing[data-pane-resize-axis="y"],
body.is-pane-resizing[data-pane-resize-axis="y"] * { cursor: row-resize !important; }
body.is-pane-resizing[data-pane-resize-axis="x"],
body.is-pane-resizing[data-pane-resize-axis="x"] * { cursor: col-resize !important; }
/* 内容区直接就是 pane 的 body:不再套一层卡片,边框/圆角/底色都由 .pto-ide-frame__pane 提供 */
.chat-shell-body {
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* 滚动条:默认隐藏,悬浮容器时才浮现(与 v2 同一手感) */
.chat-shell-body,
.wzh-chat-messages {
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
}
.chat-shell-body:hover,
.wzh-chat-messages:hover { scrollbar-color: var(--border-default) transparent; }
.chat-shell-body::-webkit-scrollbar,
.wzh-chat-messages::-webkit-scrollbar { width: 8px; height: 8px; }
.chat-shell-body::-webkit-scrollbar-track,
.wzh-chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-shell-body::-webkit-scrollbar-thumb,
.wzh-chat-messages::-webkit-scrollbar-thumb {
  background: transparent;
  border-radius: 4px;
  transition: background var(--duration-fast, 120ms) var(--easing-default, ease);
}
.chat-shell-body:hover::-webkit-scrollbar-thumb,
.wzh-chat-messages:hover::-webkit-scrollbar-thumb { background: var(--border-default); }
.chat-shell-body::-webkit-scrollbar-thumb:hover,
.wzh-chat-messages::-webkit-scrollbar-thumb:hover { background: var(--foreground-muted); }

/* ══ 顶栏品牌区:MSInsight 图标 + 产品名 ══ */
.msi-brand { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.msi-brand-logo { width: 28px; height: 28px; display: block; flex-shrink: 0; border-radius: 4px; }
.msi-brand-name {
  color: var(--foreground);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
}

/* ══ 左树:导入的采集目录 ══════════════════════════════════════════ */
.msi-sidebar {
  width: 220px;
  flex: 0 0 220px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 6px 8px 8px;
  overflow: hidden;
}
.msi-side-toolbar { display: flex; align-items: center; gap: 5px; margin-top: 8px; padding: 0 2px 2px; }
/* 品牌蓝在 .wzh-chat-panel 里是局部变量,这里补一个同值的根级定义给左树用 */
:root { --mi-brand-blue: var(--brand-blue); }
.msi-side-btn {
  height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 9px;
  flex-shrink: 0;
  border-radius: var(--radius-md, 8px);
  border: 1px solid var(--border-subtle);
  background: var(--surface-1);
  color: var(--foreground);
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--duration-fast, 120ms) var(--easing-default, ease),
              border-color var(--duration-fast, 120ms) var(--easing-default, ease);
}
.msi-side-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.msi-side-btn:hover { background: color-mix(in srgb, var(--foreground) 5%, var(--surface-1)); }
/* 「导入」是主操作:实心蓝胶囊,和还原稿一致 */
.msi-side-btn--primary {
  border-color: transparent;
  background: var(--mi-brand-blue);
  color: #fff;
  font-weight: 500;
}
.msi-side-btn--primary:hover { background: color-mix(in srgb, var(--mi-brand-blue) 84%, #000); }
.msi-compare-back {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0;
  border: 0; border-radius: var(--radius-md, 8px);
  background: transparent; color: var(--foreground);
  cursor: pointer;
}
.msi-compare-back:hover { background: var(--state-hover); }
.msi-compare-back svg {
  width: 18px; height: 18px;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
.msi-compare-heading { color: var(--foreground); font-size: 13px; font-weight: 600; }
.msi-compare-back[hidden], .msi-compare-heading[hidden], .msi-side-normal-action[hidden] { display: none; }
/* 设置 / 收起靠右贴边,和「导入」「对比」拉开 */
.msi-side-icon:nth-of-type(3) { margin-left: auto; }
.msi-side-icon {
  width: 26px; height: 26px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: var(--radius-md, 8px);
  background: transparent;
  color: var(--foreground);
  cursor: pointer;
}
.msi-side-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.msi-side-icon:hover { background: var(--state-hover); }

.msi-tree {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
}
.msi-tree:hover { scrollbar-color: var(--border-default) transparent; }
.msi-tree::-webkit-scrollbar { width: 8px; }
.msi-tree::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
.msi-tree:hover::-webkit-scrollbar-thumb { background: var(--border-default); }

.msi-tree-row {
  width: 100%;
  min-height: 29px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 8px 0 6px;
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--foreground);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
}
.msi-tree-row:hover { background: color-mix(in srgb, var(--foreground) 5%, transparent); }
/* 内容页挂在一级任务目录上：选中任务用浅蓝底 + 主色字。 */
.msi-tree-row.is-selected {
  background: color-mix(in srgb, var(--msi-accent) var(--brand-tint), transparent);
  color: var(--msi-accent);
}
.msi-tree-check {
  width: 15px; height: 15px; flex: 0 0 15px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-strong); border-radius: 3px;
  background: var(--surface-1); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 1;
}
.msi-tree-check[aria-checked="true"] {
  border-color: var(--msi-accent);
  background: var(--msi-accent);
}
.msi-tree-check[aria-disabled="true"] { opacity: .38; cursor: not-allowed; }
.msi-tree-caret {
  width: 14px; height: 14px; flex-shrink: 0;
  fill: none; stroke: var(--foreground); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  transition: transform var(--duration-fast, 120ms) var(--easing-default, ease);
}
.msi-tree-row[aria-expanded="true"] .msi-tree-caret { transform: rotate(90deg); }
/* rank 行没有展开箭头，用同宽占位保持图标对齐。 */
.msi-tree-caret--placeholder { visibility: hidden; }
.msi-tree-mark { width: 15px; height: 15px; flex-shrink: 0; display: block; }
.msi-tree-file-icon {
  width: 15px; height: 15px; flex-shrink: 0;
  fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}
/* 目录名称直接使用单层文本节点，在可用宽度内尾部省略。 */
.msi-tree-name { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msi-tree-compare-role {
  height: 18px; flex: 0 0 auto;
  display: inline-flex; align-items: center;
  margin-left: auto; padding: 0 5px;
  border-radius: 4px;
  font-size: 10.5px; font-weight: 500; line-height: 1;
  cursor: pointer;
}
.msi-tree-compare-role--baseline {
  background: color-mix(in srgb, var(--msi-accent) 10%, var(--surface-1));
  color: var(--msi-accent);
}
.msi-tree-compare-role--compare {
  background: color-mix(in srgb, var(--warning) 13%, var(--surface-1));
  color: var(--warning);
}
.msi-tree-compare-role[aria-disabled="true"] { cursor: default; }
/* 二级 rank：普通模式轻缩进；对比模式为一级任务的勾选框补齐占位。 */
.msi-tree-row--d1 { padding-left: 5px; }
.msi-tree.is-compare-mode .msi-tree-row--d1 { padding-left: 26px; }

/* ══ 内容区:标题 / 页签 / 工具条 / 泳道 / 底部页签 ══════════════════ */
.msi-content {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  padding: 0;
  overflow: hidden;
  background: transparent;
}
.msi-content-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px 8px;
}
.msi-content-title {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 600;
  color: var(--foreground);
  position: relative;
  overflow: visible; white-space: nowrap;
}
.msi-content-title-label { flex: 0 0 auto; }
.msi-title-picker-toggle {
  min-width: 0; max-width: min(420px, 55vw); height: 28px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 5px 0 2px;
  border: 0; border-radius: 6px;
  background: transparent; color: inherit;
  font: inherit; cursor: pointer;
}
.msi-title-picker-toggle:hover { background: var(--state-hover); }
.msi-title-picker-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.msi-title-picker-caret {
  width: 15px; height: 15px; flex: 0 0 15px;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
  transition: transform var(--duration-fast, 120ms) var(--easing-default, ease);
}
.msi-title-picker-toggle[aria-expanded="true"] .msi-title-picker-caret { transform: rotate(180deg); }
.msi-title-picker-menu {
  position: absolute; z-index: 30;
  top: calc(100% + 5px); left: 0;
  width: min(300px, calc(100vw - 48px)); max-height: 280px;
  padding: 5px;
  overflow: auto;
  border: 1px solid var(--border-default); border-radius: 8px;
  background: var(--background-elevated);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .16);
}
.msi-title-picker-menu[hidden] { display: none; }
.msi-title-picker-option {
  width: 100%; min-height: 30px;
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px;
  border: 0; border-radius: 6px;
  background: transparent; color: var(--foreground);
  font-size: 13px; text-align: left; cursor: pointer;
}
.msi-title-picker-option:hover { background: var(--state-hover); }
.msi-title-picker-option.is-current { color: var(--msi-accent); background: color-mix(in srgb, var(--msi-accent) 9%, transparent); }
.msi-title-picker-option-name { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msi-title-picker-option-check { flex: 0 0 auto; font-size: 13px; }
.msi-compare-title-items { min-width: 0; display: flex; align-items: center; gap: 7px; overflow: hidden; }
.msi-compare-tag {
  min-width: 0; max-width: 220px; height: 20px;
  display: inline-flex; align-items: center; gap: 3px;
  padding: 0 3px 0 6px;
  border: 1px solid var(--border-subtle);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--foreground-secondary); font-size: 11px; font-weight: 400;
}
.msi-compare-tag-name {
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
  color: var(--foreground);
}
.msi-compare-tag-close {
  width: 14px; height: 14px; flex: 0 0 14px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; border: 0; border-radius: 4px;
  background: transparent; color: var(--foreground-muted);
  font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
}
.msi-compare-tag-close:hover { background: var(--state-hover); color: var(--foreground); }
.msi-compare-swap {
  width: 24px; height: 20px; flex: 0 0 24px;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; border: 0; border-radius: 4px;
  background: transparent; color: var(--foreground-muted); cursor: pointer;
}
.msi-compare-swap:hover { background: var(--state-hover); color: var(--foreground); }
.msi-compare-swap svg {
  width: 18px; height: 14px;
  fill: none; stroke: currentColor; stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.msi-content-head-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
.msi-more-btn {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  background: var(--surface-1); color: var(--foreground-muted); cursor: pointer;
}
.msi-more-btn svg { width: 16px; height: 16px; fill: currentColor; }

.msi-tabs {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 22px;
  padding: 0 16px;
}
.msi-tab {
  position: relative;
  height: 34px;
  padding: 0 1px;
  border: 0; background: transparent;
  color: var(--foreground-muted);
  font-size: 13.5px;
  cursor: pointer;
}
.msi-tab:hover { color: var(--foreground-secondary); }
.msi-tab[hidden] { display: none; }
.msi-tab.is-active { color: var(--msi-accent); font-weight: 500; }
.msi-tab.is-active::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; border-radius: 2px 2px 0 0;
  background: var(--msi-accent);
}

.msi-toolbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
}
.msi-tb-btn {
  height: 32px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 12px;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  background: var(--surface-1);
  color: var(--foreground);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.msi-tb-btn:hover { background: color-mix(in srgb, var(--foreground) 4%, var(--surface-1)); }
.msi-tb-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.msi-tb-caret { width: 13px !important; height: 13px !important; opacity: .7; }
/* 时间轴缩放:左减右加,中间是当前时间窗长度 */
.msi-tb-zoom {
  height: 32px;
  display: inline-flex; align-items: center;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  background: var(--surface-1);
  overflow: hidden;
}
.msi-tb-zoom-btn {
  width: 30px; height: 100%;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent;
  color: var(--foreground); cursor: pointer;
}
.msi-tb-zoom-btn:hover { background: color-mix(in srgb, var(--foreground) 4%, var(--surface-1)); }
.msi-tb-zoom-btn:disabled { color: var(--foreground-muted); opacity: .45; cursor: default; background: transparent; }
.msi-tb-zoom-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.msi-tb-zoom-val {
  min-width: 46px;
  padding: 0 2px;
  align-self: stretch;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--foreground); font-size: 13px; font-variant-numeric: tabular-nums;
}
.msi-tb-search {
  flex: 1 1 auto;
  min-width: 120px;
  height: 32px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 0 12px;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  background: var(--surface-1);
}
.msi-tb-search svg { width: 15px; height: 15px; flex-shrink: 0; fill: none; stroke: var(--foreground-muted); stroke-width: 1.8; stroke-linecap: round; }
.msi-tb-search input {
  flex: 1 1 auto; min-width: 0;
  border: 0; outline: 0; background: transparent;
  color: var(--foreground); font: inherit; font-size: 13px;
}
.msi-tb-search input::placeholder { color: var(--foreground-placeholder); }
.msi-tb-search input::-webkit-search-cancel-button { display: none; }

/* ── 泳道:头部时间尺 + 主体(左树列 + 右轨道),每行等高所以两列天然对齐 ── */
.msi-swim {
  flex: 1 1 auto;
  min-height: 0;
  display: flex; flex-direction: column;
  margin: 0 16px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-1);
  overflow: hidden;
}
.msi-swim-head { flex: 0 0 auto; display: flex; height: 30px; border-bottom: 1px solid var(--border-subtle); }
.msi-swim-corner { width: var(--msi-lane-w, 220px); flex: 0 0 var(--msi-lane-w, 220px); border-right: 1px solid var(--border-subtle); }
.msi-swim-ruler { position: relative; flex: 1 1 auto; min-width: 0; border-right: 8px solid transparent; }
/* 末格 1000ms 的标签往左收,否则会被 .msi-swim 的 overflow:hidden 切掉 */
.msi-ruler-tick--end { padding: 0 6px 0 0; text-align: right; border-left: 0; border-right: 1px solid var(--border-subtle); transform: translateX(-100%); }
.msi-ruler-tick {
  position: absolute; top: 0; bottom: 0;
  padding-left: 6px;
  border-left: 1px solid var(--border-subtle);
  color: var(--foreground-muted);
  font-size: 11px; line-height: 30px;
  white-space: nowrap; pointer-events: none;
}

.msi-swim-body {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: auto;
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: var(--border-default) transparent;
}
.msi-swim-body::-webkit-scrollbar { width: 8px; height: 8px; }
.msi-swim-body::-webkit-scrollbar-track { background: transparent; }
.msi-swim-body::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 4px; }
.msi-swim-body::-webkit-scrollbar-thumb:hover { background: var(--foreground-muted); }

.msi-lane-row { cursor: pointer; display: flex; align-items: stretch; border-bottom: 1px solid color-mix(in srgb, var(--border-subtle) 60%, transparent); }
.msi-lane-row:last-child { border-bottom: 0; }
/* 选中的泳道整行浅蓝底,和还原稿里的 Ascend Hardware 一致 */
.msi-lane-row.is-selected { background: color-mix(in srgb, var(--msi-accent) var(--brand-tint), transparent); }
.msi-lane-row.is-selected .msi-lane-label { color: var(--msi-accent); }
/* 被对话里的锚点定位到:整行闪两下描边。用 inset box-shadow 而不是改 background,
   才不会和 .is-selected 的浅蓝底打架——闪完还得看得出这行是选中态。 */
.msi-lane-row.is-locate-flash { animation: msi-locate-flash 1.5s ease-out; }
@keyframes msi-locate-flash {
  0%   { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--msi-accent) 85%, transparent); }
  30%  { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--msi-accent) 0%, transparent); }
  55%  { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--msi-accent) 85%, transparent); }
  100% { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--msi-accent) 0%, transparent); }
}

.msi-lane-label {
  width: var(--msi-lane-w, 220px);
  flex: 0 0 var(--msi-lane-w, 220px);
  display: flex; align-items: center; gap: 5px;
  padding: 0 10px 0 12px;
  border: 0; border-right: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--foreground);
  font-size: 13px; text-align: left;
}
.msi-lane-row:hover { background: color-mix(in srgb, var(--foreground) 4%, transparent); }
.msi-lane-row:hover.is-selected { background: color-mix(in srgb, var(--msi-accent) var(--brand-tint-strong), transparent); }
/* 箭头是行内独立按钮:点它只折叠,不改选中行 */
.msi-lane-caret-btn {
  width: 16px; height: 16px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; border: 0; border-radius: 3px; background: transparent; cursor: pointer;
}
.msi-lane-caret-btn:hover { background: color-mix(in srgb, var(--foreground) 10%, transparent); }
.msi-lane-caret {
  width: 14px; height: 14px; flex-shrink: 0;
  fill: none; stroke: var(--foreground); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  transition: transform var(--duration-fast, 120ms) var(--easing-default, ease);
}
.msi-lane-caret-btn[aria-expanded="true"] .msi-lane-caret { transform: rotate(90deg); }
.msi-lane-caret-slot { width: 14px; flex-shrink: 0; }
.msi-lane-caret-static {
  width: 14px; height: 14px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.msi-lane-caret-static .msi-lane-caret { width: 14px; height: 14px; }
.msi-lane-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msi-lane-track { flex: 1 1 auto; min-width: 0; position: relative; }
.msi-lane-track svg { display: block; width: 100%; height: 100%; }

.msi-content-foot {
  flex: 0 0 auto;
  display: block;
  margin: 0 16px 16px;
  padding: 0;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--surface-1);
  color: var(--foreground-muted);
  overflow: hidden;
  transition: box-shadow var(--duration-base, 200ms) var(--easing-default, ease);
}
/* 收起时 #msiFootResizer 一起藏起来,上面那 12px 间距得由自己补回来 */
.msi-content-foot.is-collapsed { margin-top: 12px; }
/* 头部和内容区共用同一套两栏比例,展开时标题正好压在左栏上方 */
.msi-content-foot { --msi-foot-cols: minmax(240px, 28%) minmax(0, 1fr); }
.msi-foot-head {
  height: 40px;
  display: grid;
  grid-template-columns: var(--msi-foot-cols);
}
/* 收起时不分栏:标题和页签挨在一起,按 24px 间距排成一行,看着就是 5 个页签 */
.msi-content-foot.is-collapsed .msi-foot-head { display: flex; align-items: center; }
.msi-content-foot.is-collapsed .msi-foot-head-left { padding-right: 0; }
.msi-content-foot.is-collapsed .msi-foot-tabs { flex: 1 1 auto; padding-left: 24px; border-left: 0; }
/* 收起时它就是这排页签里的一个,颜色也跟着页签走(收起态页签一律是未选中的灰) */
.msi-content-foot.is-collapsed .msi-foot-title { color: var(--foreground-muted); }
.msi-foot-head-left {
  min-width: 0;
  display: flex; align-items: center;
  padding: 0 16px;
}
/* 左栏折叠开关贴在这一行最右;面板整体收起时没有 body 可折,按钮也跟着藏起来 */
.msi-foot-fold { margin-left: auto; }
.msi-content-foot.is-collapsed .msi-foot-fold { display: none; }
/* 折起后左栏只剩 48px:头部这一格只放图标(居中),标题挪到下面的 body 里竖着排 */
.msi-content-foot.is-detail-collapsed { --msi-foot-cols: 48px minmax(0, 1fr); }
.msi-content-foot.is-detail-collapsed .msi-foot-head-left { padding: 0; justify-content: center; }
.msi-content-foot.is-detail-collapsed .msi-foot-title { display: none; }
.msi-content-foot.is-detail-collapsed .msi-foot-fold { margin-left: 0; }
.msi-content-foot.is-detail-collapsed .msi-foot-fold svg { transform: scaleX(-1); }
.msi-content-foot.is-detail-collapsed .msi-foot-left { align-items: center; padding: 4px 0 16px; }
.msi-content-foot.is-detail-collapsed .msi-basic-grid,
.msi-content-foot.is-detail-collapsed .msi-foot-empty { display: none; }
/* 竖排标题:中文直接用 vertical-rl 就是正立的,再用 text-orientation 兜一下 */
.msi-foot-title-vert { display: none; }
.msi-content-foot.is-detail-collapsed .msi-foot-title-vert {
  display: block;
  flex: 0 0 auto;
  writing-mode: vertical-rl;
  text-orientation: upright;
  color: var(--foreground-muted);
  font-size: 13px;
  line-height: 1;
  letter-spacing: 2px;
}
/* 和页签用同一套字体/字号/字重(都显式写 font: inherit,免得 button 走 UA 默认字体,
   同样的颜色值渲染出来一深一浅);收起时点它也能拉开面板,所以做成 button。 */
.msi-foot-title {
  margin: 0; padding: 0;
  border: 0; background: transparent;
  color: var(--foreground);
  font: inherit;
  font-size: 13px; font-weight: 400;
  cursor: pointer;
}
.msi-content-foot:not(.is-collapsed) .msi-foot-title { cursor: default; }
/* 展开时这条竖线要和下面 .msi-foot-right 的 border-left 接上,
   两处都落在同一套网格的同一条列线上,整条线从头部一直贯到底、中间不断。 */
.msi-foot-tabs {
  min-width: 0;
  height: 100%;
  display: flex; align-items: center; gap: 24px;
  padding: 0 16px;
  border-left: 1px solid var(--border-subtle);
}
.msi-foot-tab {
  position: relative;
  height: 100%;
  border: 0; background: transparent;
  color: var(--foreground-muted);
  font: inherit;
  font-size: 13px; font-weight: 400;
  cursor: pointer;
}
.msi-foot-tab:hover { color: var(--foreground-secondary); }
.msi-foot-tab.is-active { color: var(--msi-accent); font-weight: 500; }
.msi-foot-tab.is-active::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 2px; border-radius: 2px 2px 0 0;
  background: var(--msi-accent);
}
.msi-foot-close {
  width: 28px;
  height: 28px;
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 0;
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--foreground-muted);
  cursor: pointer;
}
.msi-foot-close:hover { background: var(--state-hover); color: var(--foreground); }
.msi-foot-close:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
.msi-foot-close svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.msi-foot-expand-icon { display: none; }
.msi-content-foot.is-collapsed .msi-foot-close-icon { display: none; }
.msi-content-foot.is-collapsed .msi-foot-expand-icon { display: block; }
.msi-content-foot.is-collapsed .msi-foot-tab.is-active {
  color: var(--foreground-muted);
  font-weight: 400;
}
.msi-content-foot.is-collapsed .msi-foot-tab.is-active::after { display: none; }
/* 内容区同样两栏:左「选中详情」只占 ~28%,横向空间尽量留给右边的页签内容(调用链)。
   8 行 key-value 单列摞起来比双列高,加上 value 换行,面板整体 232px 才放得下。
   232px 只是初值:拖 #msiFootResizer 会把 --msi-foot-h 改成别的像素值,上限是内容区的一半 */
.msi-foot-body {
  height: var(--msi-foot-h, 232px);
  min-height: 160px;
  display: grid;
  grid-template-columns: var(--msi-foot-cols);
  color: var(--foreground);
  overflow: hidden;
}
.msi-content-foot.is-collapsed .msi-foot-body { display: none; }
.msi-foot-left {
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden auto;
  padding: 4px 16px 16px;
}
.msi-foot-left > .msi-basic-grid { flex: 0 0 auto; }
/* 右栏竖着排:内容吃掉整块高度,链条在剩余空间里居中。
   横线只画在本栏顶部(把页签和内容分开),左栏标题下方不画,免得像表头。 */
.msi-foot-right {
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: auto;
  padding: 14px 16px 16px;
  border-left: 1px solid var(--border-subtle);
  border-top: 1px solid var(--border-subtle);
}
/* 没选中 / 页签未实现时的占位:在本栏里居中,不再自带高度和上边框 */
.msi-foot-placeholder,
.msi-foot-empty {
  flex: 1 1 auto;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--foreground-muted);
  font-size: 13px;
}
.msi-foot-empty { min-height: 72px; }
.msi-foot-placeholder[hidden],
.msi-foot-empty[hidden],
.msi-basic-grid[hidden],
.msi-chain-flow[hidden] { display: none; }
/* 单列:每行一组 key-value,key 按最长的那个(connection_id)定宽,value 吃掉剩余 */
.msi-basic-grid {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  column-gap: 10px;
  row-gap: 6px;
  margin: 0;
  font-size: 12px;
  line-height: 1.45;
}
.msi-basic-grid dt { color: var(--foreground-muted); white-space: nowrap; }
/* value 显示不全就换行,不再省略号——长 id / 长名称要能整段读出来 */
.msi-basic-grid dd {
  min-width: 0;
  margin: 0;
  color: var(--foreground);
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
}
/* 「标题」的 value:和泳道/调用链上的任务条同一套外观(同底色、圆角矩形、居中小字),
   底色由 traceTaskColor 内联写入。名称长了跟着换行、条子自动撑高,不截断。 */
.msi-basic-taskbar {
  display: inline-block;
  max-width: 100%;
  min-height: 24px;
  padding: 4px 9px;
  border-radius: 5px;
  font-size: 10.5px;
  line-height: 16px;
  text-align: center;
  overflow-wrap: anywhere;
}
/* 图形区:单列网格,横向主链和纵向尾链是同一列里上下两个格子,整列在区域里水平、垂直都居中。
   justify-items: start 让尾链仍以列左缘为基准算 margin-left(拐点位置),不会因居中错位。
   flex: 1 0 auto 只长不缩——链条比区域高时区域随之撑高,由外层 pane 滚动,不会被裁掉。 */
.msi-chain-flow {
  --msi-chain-node-w: 120px;
  width: 100%;
  min-width: 0;
  flex: 1 0 auto;
  display: grid;
  grid-template-columns: max-content;
  place-content: center;
  justify-items: start;
  padding: 4px 2px 12px;
  overflow: hidden;
}
/* 横向主链用一张共享的 3 行网格(路径 / 任务条 / 说明),step 和 node 都 display: contents
   把子元素直接交给网格:这样不管各节点的路径换了几行,所有任务条都落在同一行、同一高度,
   箭头也钉在任务条那一行居中 —— 连线才能从一个条的高度中点连到下一个条的中点。
   (以前是 flex 居中整个节点,路径高度一变任务条就上下错位,箭头跟着对不齐。) */
.msi-chain-row {
  width: auto;
  display: grid;
  grid-template-rows: auto auto auto;
  grid-auto-flow: column;
  grid-auto-columns: max-content;
  row-gap: 6px;
  align-items: start;
}
.msi-chain-row > .msi-chain-step,
.msi-chain-row .msi-chain-node { display: contents; }
/* 各节点一律等宽(宽度 = JS 按可用宽度均分出来的 --msi-chain-node-w):
   条子宽窄若跟着内容走,用户会误以为宽的那个耗时长。
   路径行数各不相同:align-self: end 让它们一律贴着行底,也就是贴着下面的任务条,
   行数少的不会浮在半空。 */
.msi-chain-row .msi-chain-path { grid-row: 1; align-self: end; width: var(--msi-chain-node-w); }
.msi-chain-row .msi-chain-taskbar { grid-row: 2; align-self: center; width: var(--msi-chain-node-w); }
.msi-chain-row .msi-chain-foot { grid-row: 3; align-self: start; width: var(--msi-chain-node-w); }
.msi-chain-row .msi-chain-arrow { grid-row: 2; align-self: center; }
/* 尾部纵向链里的节点仍是普通的列布局 */
.msi-chain-step {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
}
.msi-chain-node {
  width: 100%;
  min-width: var(--msi-chain-node-w);
  min-height: 72px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 6px;
}
/* 路径 / 说明 / 耗时都跟着节点宽度走,文字一律换行,不截断不省略号 */
.msi-chain-path {
  width: 100%;
  color: var(--foreground-muted);
  font-size: 10px;
  line-height: 14px;
  white-space: normal;
  overflow-wrap: anywhere;
}
/* 条子不定高:名称放不下就换行把条撑高,不出省略号。各条高矮不一,一律按 align-self: center
   居中——箭头也钉在这一行的垂直中点,所以连线照样从中点连到中点。 */
.msi-chain-taskbar {
  width: 100%;
  min-height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: 5px;
  color: inherit;
  font: inherit;
  font-size: 10.5px;
  line-height: 15px;
  text-align: center;
  white-space: normal;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.msi-chain-taskbar:hover { filter: brightness(.97); box-shadow: 0 0 0 1px var(--msi-accent); }
.msi-chain-taskbar.is-current { border-color: var(--msi-accent); box-shadow: 0 0 0 1px var(--msi-accent); }
/* 说明和耗时打包成一块占一格:说明几行都行,耗时永远紧跟在自己这条说明下面,
   不会被别的节点的说明行数顶下去。 */
.msi-chain-foot {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.msi-chain-explain {
  color: var(--foreground-secondary);
  font-size: 10.5px;
  line-height: 15px;
  white-space: normal;
  overflow-wrap: anywhere;
}
/* 耗时压在说明下面,比说明再弱一档 */
.msi-chain-dur {
  color: var(--foreground-muted);
  font-size: 10px;
  line-height: 14px;
  font-variant-numeric: tabular-nums;
}
.msi-chain-arrow {
  width: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--msi-accent);
}
.msi-chain-arrow svg { width: 38px; height: 28px; overflow: visible; }
.msi-chain-arrow path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.msi-chain-tail {
  width: var(--msi-chain-tail-w, var(--msi-chain-node-w));
  margin-left: var(--msi-chain-turn-left, 0px);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.msi-chain-tail > .msi-chain-arrow {
  height: 30px;
  flex: 0 0 30px;
  transform: rotate(90deg);
}
/* Trace 任务色参考 Perfetto 的「事件名稳定哈希 + 全色环分类色」策略：
   18 个色相覆盖暖色、冷色与少量绿色，不再让 device 泳道固定挤在绿色系。
   选中态仍由 --msi-accent 的描边表达，不占用任务本身的色相语义。
   时间线 / 选中详情 / 调用链引用同一组变量，切换主题时会同步换色。 */
:root {
  --msi-accent: var(--brand-accent);
  --msi-trace-task-fg: #293347;
  --msi-metric-fill-strength: 58%;
  --msi-metric-stroke-strength: 70%;
  /* 槽位按跨色环顺序排列；即使相近名称哈希到相邻槽位，视觉上也不会扎堆。 */
  --msi-trace-01-bg: oklch(82% .095 4);
  --msi-trace-02-bg: oklch(82% .095 155);
  --msi-trace-03-bg: oklch(82% .095 285);
  --msi-trace-04-bg: oklch(82% .095 46);
  --msi-trace-05-bg: oklch(82% .095 212);
  --msi-trace-06-bg: oklch(82% .095 342);
  --msi-trace-07-bg: oklch(82% .095 125);
  --msi-trace-08-bg: oklch(82% .095 265);
  --msi-trace-09-bg: oklch(82% .095 32);
  --msi-trace-10-bg: oklch(82% .095 198);
  --msi-trace-11-bg: oklch(82% .095 325);
  --msi-trace-12-bg: oklch(82% .095 88);
  --msi-trace-13-bg: oklch(82% .095 245);
  --msi-trace-14-bg: oklch(82% .095 18);
  --msi-trace-15-bg: oklch(82% .095 185);
  --msi-trace-16-bg: oklch(82% .095 305);
  --msi-trace-17-bg: oklch(82% .095 58);
  --msi-trace-18-bg: oklch(82% .095 228);
}
:root[data-theme="dark"] {
  --msi-trace-task-fg: #f5f7fb;
  --msi-metric-fill-strength: 44%;
  --msi-metric-stroke-strength: 58%;
  --msi-trace-01-bg: oklch(42% .085 4);
  --msi-trace-02-bg: oklch(42% .085 155);
  --msi-trace-03-bg: oklch(42% .085 285);
  --msi-trace-04-bg: oklch(42% .085 46);
  --msi-trace-05-bg: oklch(42% .085 212);
  --msi-trace-06-bg: oklch(42% .085 342);
  --msi-trace-07-bg: oklch(42% .085 125);
  --msi-trace-08-bg: oklch(42% .085 265);
  --msi-trace-09-bg: oklch(42% .085 32);
  --msi-trace-10-bg: oklch(42% .085 198);
  --msi-trace-11-bg: oklch(42% .085 325);
  --msi-trace-12-bg: oklch(42% .085 88);
  --msi-trace-13-bg: oklch(42% .085 245);
  --msi-trace-14-bg: oklch(42% .085 18);
  --msi-trace-15-bg: oklch(42% .085 185);
  --msi-trace-16-bg: oklch(42% .085 305);
  --msi-trace-17-bg: oklch(42% .085 58);
  --msi-trace-18-bg: oklch(42% .085 228);
}
:root[data-theme="dark"] .msi-chain-taskbar:hover { filter: brightness(1.12); }

/* 算子任务条:用 HTML 绝对定位而不是 SVG,条上的算子名才不会被横向拉伸变形 */
.msi-bar {
  position: absolute;
  top: 4px; bottom: 4px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
  border-radius: 2px;
  font-size: 10.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  cursor: default;
}
/* 细条太窄,留内边距会把它挤没 */
.msi-bar--tick { padding: 0; border-radius: 1px; }
/* 折叠分组行的密集条:统一 10% 黑,深色主题换成观感相当的 14% 白 */
/* 折叠态占位块跟回答里 `code` 标签同一档主色(见 .wzh-chat-messages code):
   两边都是"这里指向一批具体对象"的意思,配色统一,视线在图和回答之间跳时不会断。
   深浅主题共用一条:--accent 本身在深色下就换成了浅蓝(#90a4d4),12% 兑出来的
   明度关系自动是反的,不用再写一条覆盖。 */
.msi-dense-bar { fill: color-mix(in srgb, var(--accent) 12%, transparent); }

/* 左键选中的色块:描边用 box-shadow 而不是 outline,细条也不会被撑变形 */
.msi-bar.is-picked {
  z-index: 3;
  box-shadow: 0 0 0 2px var(--msi-accent);
}
.msi-bar.is-locate-flash { animation: msi-task-locate-flash 1.4s ease-out; }
@keyframes msi-task-locate-flash {
  0%, 48% { filter: brightness(1.18); box-shadow: 0 0 0 3px var(--msi-accent), 0 0 14px color-mix(in srgb, var(--msi-accent) 50%, transparent); }
  24%, 100% { filter: none; box-shadow: 0 0 0 2px var(--msi-accent); }
}

/* 点击真实 trace 任务后出现的跨泳道关系层。SVG 和任务条共用滚动坐标系，
   所以纵向滚动、面板伸缩时连线仍锚在任务中心。 */
.msi-link-layer {
  position: absolute;
  left: 0; top: 0;
  z-index: 4;
  overflow: visible;
  pointer-events: none;
}
.msi-link-path {
  fill: none;
  stroke: var(--msi-accent);
  stroke-width: 1.7;
  opacity: .92;
  vector-effect: non-scaling-stroke;
}
.msi-link-path--operator {
  stroke: #8b73cf;
  stroke-dasharray: 5 4;
}
.msi-link-path--communication { stroke: #d28a2e; }
/* 箭头是线形 V,线宽、颜色和对应的连线同一套;marker 内容不继承引用它的 path 的样式,所以按类型各写一遍 */
.msi-link-arrow {
  fill: none;
  stroke: var(--msi-accent);
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .92;
}
.msi-link-arrow--operator { stroke: #8b73cf; }
.msi-link-arrow--communication { stroke: #d28a2e; }
.msi-link-dot { fill: var(--msi-accent); }
.msi-link-dot--operator { fill: #8b73cf; }
.msi-link-dot--communication { fill: #d28a2e; }
.msi-swim-body.has-task-focus .msi-bar:not(.is-related) { opacity: .22; }
.msi-swim-body.has-task-focus .msi-bar.is-related { z-index: 2; }
.msi-swim-body.has-task-focus .msi-bar.is-picked { opacity: 1; z-index: 5; }

/* 色块右键菜单:分组 + 分隔线 + 右对齐快捷键,形态对齐 src/pic/右键.png */
.msi-ctxmenu {
  position: fixed;
  z-index: 90;
  min-width: 208px;
  padding: 4px 0;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md, 8px);
  background: var(--surface-1);
  box-shadow: 0 10px 28px rgba(28, 36, 68, .16), 0 2px 6px rgba(28, 36, 68, .08);
  font-size: 13px;
  user-select: none;
}
.msi-ctxmenu[hidden] { display: none; }
.msi-ctxmenu-item {
  width: 100%;
  min-height: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border: 0;
  background: transparent;
  color: var(--foreground);
  font: inherit;
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
}
.msi-ctxmenu-item:hover:not(:disabled) { background: var(--state-hover); }
.msi-ctxmenu-item:disabled { color: var(--foreground-muted); cursor: default; }
.msi-ctxmenu-key { margin-left: auto; padding-left: 24px; color: var(--foreground-muted); font-size: 12px; }
.msi-ctxmenu-icon { width: 16px; height: 16px; flex-shrink: 0; display: block; }
.msi-ctxmenu-sep {
  height: 1px;
  margin: 4px 0;

  <script>
    /* ── 主题切换:计算(浅) → 新无限(浅) → 追光(深) 三态循环,顺序见 window.MI_THEMES。
         图标表示「当前主题」的明暗:浅色皮肤是太阳,深色皮肤是月亮。
         所以在计算点太阳会切到新无限(还是太阳),再点才切到追光(变月亮)。
         同时写 html/body 上的 data-theme(明暗基座)与 data-brand(品牌皮肤)。 ── */
    (() => {
      const MOON = 'M12 3a6.5 6.5 0 0 0 7.8 8.8A8 8 0 1 1 12 3z';
      const SUN = 'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4';
      const THEMES = window.MI_THEMES;
      const btn = document.getElementById('themeToggle');
      const icon = document.getElementById('themeToggleIcon');
      function apply(i) {
        const t = THEMES[((i % THEMES.length) + THEMES.length) % THEMES.length];
        const next = THEMES[(THEMES.indexOf(t) + 1) % THEMES.length];
        for (const el of [document.documentElement, document.body]) {
          if (!el) continue;
          el.dataset.themeId = t.id;
          el.dataset.theme = t.mode;
          if (t.brand) el.dataset.brand = t.brand; else delete el.dataset.brand;
        }
        if (icon) icon.innerHTML = '<path d="' + (t.mode === 'dark' ? MOON : SUN) + '"></path>';
        if (btn) {
          btn.setAttribute('aria-pressed', String(t.mode === 'light'));
          btn.title = '当前主题:' + t.label + '(点击切换到' + next.label + ')';
          btn.setAttribute('aria-label', btn.title);
        }
      }
      const start = THEMES.findIndex(t => t.id === document.documentElement.dataset.themeId);
      let idx = start < 0 ? 0 : start;
      apply(idx);
      btn?.addEventListener('click', () => { apply(++idx); });
    })();
  </script>

  <!-- ── MindStudio Insight 工作台:左树(采集目录) + 内容区(泳道树 + 泳道) ── -->
  <script>
// 这个文件只负责「壳」的两块内容:左边的性能任务树、右边的泳道视图。
// 左树只展示「任务 → rank」两级；具体落盘文件仍可由对话框的 # 引用列表访问。
// 泳道的结构对齐 profileCompare.html 的训练级 Timeline(Ascend Hardware ▸ Stream N /
// Communication / Overlap Analysis / HBM ...)。rank0/trace_view.json 使用从真实 trace 抽取的
// 任务与 flow，其余文件仍按文件名种子确定性生成；数据直接内嵌，页面保持单文件可离线打开。
(function () {
  'use strict';

  /* ══ 1. 性能任务目录:data 下的任务 → 各任务的 rank 目录 ════════════ */
  const RANK_FILES = [
    'trace_view.json',            // Timeline 主件,Text 模式必出
    'kernel_details.csv',         // 算子级明细(cube 利用率、MFU 都从它算,带 Input/Output Shapes 列)
    'op_statistic.csv',

    'step_trace_time.csv',        // 每步的计算/通信/Free 拆解,communicationOverlapComputation 在这里
    'communication.json',
    'communication_matrix.json',
  ];
  // 名称取自 D:/Projects/msagent/data。顶层目录代表一次任务，不再代表某张卡；
  // 子项才是 rank。时间戳保留在真实路径里，展示名去掉时间戳并把 rank 放在最前，
  // 避免窄侧栏里同一节点的多个采集目录无法区分。
  const TASK_CAPTURE_SOURCES = [
    ['eta_eager_l1', [
      '1640123b27bd_12093_20260110074326034_ascend_pt',
    ]],
    ['level2', [
      'rank_0_ascend_pt', 'rank_1_ascend_pt', 'rank_2_ascend_pt', 'rank_3_ascend_pt',
    ]],
    ['MultiProfLevel2MemoryUB_db', [
      'node1_2166651_20240619060505060_ascend_pt',
      'node1_2166652_20240619060505059_ascend_pt',
      'node1_2166653_20240619060505061_ascend_pt',
      'node1_2166654_20240619060505060_ascend_pt',
      'node1_2166655_20240619060505059_ascend_pt',
      'node1_2166656_20240619060505059_ascend_pt',
      'node1_2166657_20240619060505060_ascend_pt',
      'node1_2166658_20240619060505060_ascend_pt',
      'ubuntu2204_1660963_20240619060440181_ascend_pt',
      'ubuntu2204_1660964_20240619060440179_ascend_pt',
      'ubuntu2204_1660965_20240619060440181_ascend_pt',
      'ubuntu2204_1660966_20240619060440181_ascend_pt',
      'ubuntu2204_1660970_20240619060440179_ascend_pt',
      'ubuntu2204_1660971_20240619060440180_ascend_pt',
      'ubuntu2204_1660972_20240619060440181_ascend_pt',
      'ubuntu2204_1660973_20240619060440181_ascend_pt',
    ]],
    ['operator', []],
    ['profile_dir', [
      'ubuntu122_14296_20260120112328147_ascend_pt',
      'ubuntu122_14297_20260120112328150_ascend_pt',
      'ubuntu122_14298_20260120112328150_ascend_pt',
      'ubuntu122_14299_20260120112328147_ascend_pt',
      'localhost.localdomain_10699_20260120112415091_ascend_pt',
      'localhost.localdomain_10700_20260120112415091_ascend_pt',
      'localhost.localdomain_10701_20260120112415091_ascend_pt',
      'localhost.localdomain_10702_20260120112415090_ascend_pt',
    ]],
    ['verl', [
      '1/e2e/localhost.localdomain_214483_20260116064439460_ascend_pt',
    ]],
  ];

  function rankDisplayName(rank, source) {
    const leaf = source.split('/').pop();
    if (/^rank_\d+_ascend_pt$/.test(leaf)) return leaf.replace(/^rank_(\d+)/, 'rank$1');
    const compact = leaf
      .replace(/_\d{17}_ascend_pt$/, '_ascend_pt')
      .replace(/^localhost\.localdomain_/, 'localhost_');
    return 'rank' + rank + '_' + compact;
  }

  function makeRank(taskName, source, rank) {
    const rootDir = taskName + ' / ' + source.replace(/\//g, ' / ');
    return {
      name: rankDisplayName(rank, source),
      ref: 'rank' + rank,
      dir: rootDir + ' / ASCEND_PROFILER_OUTPUT',
      rootDir,
      files: RANK_FILES.concat(['profiler_info_' + rank + '.json', 'profiler_metadata.json']),
    };
  }

  const PROF_TASKS = TASK_CAPTURE_SOURCES.map(([name, sources]) => ({
    name,
    dir: name,
    open: name === 'profile_dir',
    ranks: sources.map((source, rank) => makeRank(name, source, rank)),
  }));
  const selectedTask = PROF_TASKS.find((task) => task.name === 'profile_dir');
  const PROF_FOLDERS = selectedTask.ranks;
  const PROF_ROOT = { name: 'data', dir: 'data', tasks: PROF_TASKS };

  // 该文件在采集结果里的完整路径:profiler_info / profiler_metadata 落在 *_ascend_pt 根下,
  // 其余交付件都在 ASCEND_PROFILER_OUTPUT/ 里,两者的路径不一样,tooltip 和 # 列表都按这个给。
  const filePath = (folder, file) =>
    (/^profiler_(info|metadata)/.test(file) ? folder.rootDir : folder.dir) + ' / ' + file;

  // 对话框输入 # 时仍可引用当前 profile_dir 任务下的具体文件；文件不再占用左树层级。
  window.MSI_PROF_TREE = PROF_ROOT;
  window.MSI_CTX_FILES = PROF_FOLDERS.reduce((acc, folder) => {
    folder.files.forEach((file) => acc.push({
      name: folder.ref + '/' + file,
      path: filePath(folder, file),
    }));
    return acc;
  }, [{ name: selectedTask.name, path: selectedTask.dir + '（整个采集目录，8 卡）' }]);

  // 内容页挂在一级任务目录；二级 rank 仅展示采集构成，不再各自维护页面。
  let selected = { task: selectedTask };
  let compareMode = false;
  let compareTasks = [];
  window.MSI_ANCHOR_NAME = selected.task.name;

  /* ══ 2. 确定性随机:同一个文件名永远画出同一张泳道图 ══════════════ */
  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
  ));

  const nameHtml = (name) => '<span class="msi-tree-name">' + esc(name) + '</span>';

  /* ══ 3. 左树渲染 ═════════════════════════════════════════════════ */
  const CARET = '<svg class="msi-tree-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>';
  const FILE_ICON = '<svg class="msi-tree-file-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v5h4"></path></svg>';

  function renderTree() {
    const host = document.getElementById('msiTree');
    if (!host) return;
    host.classList.toggle('is-compare-mode', compareMode);
    const rows = [];
    const taskRow = (task, taskIndex) => {
      const checked = compareTasks.includes(task);
      const disabled = compareMode && !checked && compareTasks.length >= 2;
      const on = selected.task === task;
      const roleIndex = compareTasks.indexOf(task);
      const roleName = roleIndex === 0 ? '基线' : (roleIndex === 1 ? '对比' : '');
      const check = compareMode
        ? '<span class="msi-tree-check" data-compare-check="1" role="checkbox"' +
            ' aria-checked="' + (checked ? 'true' : 'false') + '"' +
            ' aria-disabled="' + (disabled ? 'true' : 'false') + '"' +
            ' title="' + (disabled ? '最多选择 2 个任务' : (checked ? '取消选择' : '选择任务')) + '">' +
            (checked ? '✓' : '') +
          '</span>'
        : '';
      const role = compareMode && roleName
        ? '<span class="msi-tree-compare-role msi-tree-compare-role--' + (roleIndex === 0 ? 'baseline' : 'compare') + '"' +
            ' data-compare-swap="1" aria-disabled="' + (compareTasks.length < 2 ? 'true' : 'false') + '"' +
            ' title="' + (compareTasks.length < 2 ? roleName : '点击互换基线和对比') + '">' + roleName + '</span>'
        : '';
      return '<button class="msi-tree-row msi-tree-row--folder' + (on ? ' is-selected' : '') + '" type="button" role="treeitem"' +
        ' data-task="' + taskIndex + '" aria-expanded="' + (task.open ? 'true' : 'false') + '"' +
        ' aria-selected="' + (on ? 'true' : 'false') + '"' +
        ' title="' + esc(task.dir) + '">' +
          check + CARET +
          '<img class="msi-tree-mark" src="src/pic/icon/folder.svg" alt="">' +
          nameHtml(task.name) + role +
        '</button>';
    };
    const rankRow = (rank, taskIndex, rankIndex) =>
      '<button class="msi-tree-row msi-tree-row--folder msi-tree-row--d1" type="button" role="treeitem"' +
      ' data-task="' + taskIndex + '" data-rank="' + rankIndex + '"' +
      ' aria-selected="false"' +
      ' title="' + esc(rank.rootDir) + '">' +
        CARET.replace('msi-tree-caret', 'msi-tree-caret msi-tree-caret--placeholder') +
        FILE_ICON +
        nameHtml(rank.name) +
      '</button>';

    PROF_TASKS.forEach((task, ti) => {
      rows.push(taskRow(task, ti));
      if (!task.open) return;
      task.ranks.forEach((rank, ri) => {
        rows.push(rankRow(rank, ti, ri));
      });
    });
    host.innerHTML = rows.join('');
  }

  function initTree() {
    const host = document.getElementById('msiTree');
    if (!host) return;
    host.addEventListener('click', (e) => {
      const row = e.target.closest('.msi-tree-row');
      if (!row) return;
      const task = PROF_TASKS[Number(row.dataset.task)];
      if (!task) return;
      const role = e.target.closest('.msi-tree-compare-role');
      if (role) {
        if (role.getAttribute('aria-disabled') !== 'true') swapCompareRoles();
        return;
      }
      const check = e.target.closest('.msi-tree-check');
      if (check) {
        if (check.getAttribute('aria-disabled') !== 'true') toggleCompareTask(task);
        return;
      }
      if (row.dataset.rank === undefined) {
        if (compareMode || e.target.closest('.msi-tree-caret')) {
          task.open = !task.open;
          renderTree();
        } else {
          selectTask(task);
        }
        return;
      }
      // 二级 rank 只展示任务包含的采集项，不再切换内容页面。
    });
    renderTree();
  }

  function selectTask(task) {
    if (!task) return;
    selected = { task };
    task.open = true;
    applySelection();
  }

  function renderContentTitle() {
    const title = document.getElementById('msiContentTitle');
    if (!title) return;
    if (!compareMode) {
      const options = PROF_TASKS.map((task, taskIndex) => {
        const current = task === selected.task;
        return '<button class="msi-title-picker-option' + (current ? ' is-current' : '') + '" type="button"' +
          ' role="option" aria-selected="' + (current ? 'true' : 'false') + '" data-title-task="' + taskIndex + '">' +

          (current ? '<span class="msi-title-picker-option-check" aria-hidden="true">✓</span>' : '') +
        '</button>';
      }).join('');
      title.innerHTML = '<button class="msi-title-picker-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">' +
          '<span class="msi-title-picker-name">' + esc(selected.task.name) + '</span>' +
          '<svg class="msi-title-picker-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"></path></svg>' +
        '</button>' +
        '<div class="msi-title-picker-menu" role="listbox" aria-label="切换任务目录" hidden>' + options + '</div>';
      return;
    }
    const tagItems = compareTasks.map((task, roleIndex) => {
      const taskIndex = PROF_TASKS.indexOf(task);
      const roleName = roleIndex === 0 ? '基线' : '对比';
      return '<span class="msi-compare-tag" title="' + esc(task.name) + '">' +
        '<span class="msi-compare-tag-name">' + esc(task.name + '（' + roleName + '）') + '</span>' +
        '<button class="msi-compare-tag-close" type="button" data-compare-remove="' + taskIndex + '"' +
        ' aria-label="取消选择 ' + esc(task.name) + '" title="取消选择">×</button>' +
      '</span>';
    });
    const swap = '<button class="msi-compare-swap" type="button" data-compare-swap="1"' +
      ' aria-label="互换基线和对比" title="互换基线和对比">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12"></path><path d="m15 4 3 3-3 3"></path>' +
      '<path d="M18 17H6"></path><path d="m9 14-3 3 3 3"></path></svg></button>';
    const tags = tagItems.length === 2 ? tagItems.join(swap) : tagItems.join('');
    title.innerHTML = '<span class="msi-content-title-label">任务对比</span>' +
      (tags ? '<span class="msi-compare-title-items">' + tags + '</span>' : '');
  }

  function toggleCompareTask(task) {
    if (!compareMode) return;
    const index = compareTasks.indexOf(task);
    if (index >= 0) compareTasks.splice(index, 1);
    else if (compareTasks.length < 2) compareTasks.push(task);
    renderTree();
    renderContentTitle();
  }

  function swapCompareRoles() {
    if (!compareMode || compareTasks.length < 2) return;
    compareTasks = [compareTasks[1], compareTasks[0]];
    renderTree();
    renderContentTitle();
  }

  function setCompareMode(active) {
    compareMode = active;
    compareTasks = active ? [selected.task] : [];
    document.querySelectorAll('.msi-side-normal-action').forEach((el) => { el.hidden = active; });
    document.querySelectorAll('.msi-tab--normal-only').forEach((el) => { el.hidden = active; });
    document.querySelectorAll('.msi-tab--compare-only').forEach((el) => { el.hidden = !active; });
    const visibleActiveTab = document.querySelector('.msi-tab.is-active:not([hidden])');
    if (!visibleActiveTab) {

  function initCompareMode() {
    document.getElementById('msiCompareBtn')?.addEventListener('click', () => setCompareMode(true));
    document.getElementById('msiCompareBack')?.addEventListener('click', () => setCompareMode(false));
    document.getElementById('msiContentTitle')?.addEventListener('click', (e) => {
      const swap = e.target.closest('.msi-compare-swap');
      if (swap) {
        swapCompareRoles();
        return;
      }
      const close = e.target.closest('.msi-compare-tag-close');
      if (close) {
        const task = PROF_TASKS[Number(close.dataset.compareRemove)];
        if (task) toggleCompareTask(task);
        return;
      }
      const option = e.target.closest('.msi-title-picker-option');
      if (option) {
        closeTitlePicker();
        selectTask(PROF_TASKS[Number(option.dataset.titleTask)]);
        return;
      }
      const toggle = e.target.closest('.msi-title-picker-toggle');
      if (!toggle) return;
      const menu = toggle.parentElement.querySelector('.msi-title-picker-menu');
      const open = menu?.hidden !== false;
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (menu) menu.hidden = !open;
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#msiContentTitle')) closeTitlePicker();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTitlePicker(); });

    const pool = REAL_TRACE_TASKS
      .filter((task) => !occupied.has(task.id))
      .sort((a, b) => a.start - b.start || a.id.localeCompare(b.id));

    while (pool.length) {
      const chain = [pool.shift()];
      while (chain.length < 4 && pool.length) {
        const prev = chain[chain.length - 1];
        const prevEnd = prev.start + prev.dur;
        let index = pool.findIndex((task) => task.laneId !== prev.laneId && task.start + 1e-9 >= prevEnd);
        if (index < 0) break;
        const next = pool.splice(index, 1)[0];
        REAL_TRACE_EDGES.push({ source: prev.id, target: next.id, type: 'inferred', inferred: true });
        chain.push(next);
      }

      // 时间窗末尾偶尔只剩一条：把它接到最近且已完成的异泳道上游，确保也可查看关系。
      if (chain.length === 1) {
        const target = chain[0];
        const upstream = REAL_TRACE_TASKS
          .filter((task) => !occupied.has(task.id) && task.id !== target.id && task.laneId !== target.laneId && task.start + task.dur <= target.start + 1e-9)
          .sort((a, b) => (b.start + b.dur) - (a.start + a.dur))[0];
        if (upstream) REAL_TRACE_EDGES.push({ source: upstream.id, target: target.id, type: 'inferred', inferred: true });
      }
    }
  }
  addInferredTraceEdges();
  const REAL_TRACE_TASK_BY_ID = Object.fromEntries(REAL_TRACE_TASKS.map((t) => [t.id, t]));
  const isRealTraceSelection = () => selected.task.name === 'profile_dir';

  // 算子任务条的配色:浅底 + 同色系深字,浅色/深色主题下都读得出来。
  const BAR_COLORS = [
    { bg: '#dbc8f7', fg: '#563a86' },
    { bg: '#fbc3e0', fg: '#8a3d66' },
    { bg: '#c0e6c7', fg: '#2c6a3d' },
    { bg: '#c5d9fb', fg: '#2c5296' },
    { bg: '#ffdab0', fg: '#875320' },
    { bg: '#b9f0e3', fg: '#226d5c' },
  ];
  // 宽条上写得下名字的那些:同步段和大算子,对应截图里的 EVENT_WAIT / AI_CORE / Notify Wait
  const WIDE_NAMES = [
    'AI_CORE', 'Notify Wait', 'EVENT_WAIT', 'AI_VECTOR_CORE',
    'aclnnMatmul_MatMulV3Common_MatMulV3', 'aclnnMatmul_MatMulV3',
    'SwiGlu', 'RmsNorm', 'FlashAttentionScore', 'aclnnAdd_AddAiCore_Add',
  ];

  /* —— 三种轨道画法 —— */

  // 密集事件条:折叠的分组行用它概括下面那一堆事件。折叠态只是「这里有东西」的提示,
  // 不承担分辨事件类型的职责,所以统一一个极淡的底色(见 .msi-dense-bar),不再逐条上色;
  // 形状上仍然成团——团内细条只留 1px 缝连成一片,团与团之间才留白。参考 src/pic/截图.png。
  const DENSE_EVENT_COLORS = ['#d9cdf5', '#c5d9fb', '#c0e6c7', '#f7d8b5', '#b9f0e3', '#fbc3e0'];
  function denseTrack(rnd, density, colorful = false) {
    const W = 1000, H = ROW_H, Y = 4, BH = H - 8;
    const rect = (x, w, fill) => '<rect class="msi-dense-bar" x="' + x.toFixed(1) + '" y="' + Y +
      '" width="' + Math.max(0.6, w).toFixed(1) + '" height="' + BH + '"' +
      (fill ? ' style="fill:' + fill + '"' : '') + '></rect>';

    let out = '';
    let x = rnd() * 25;
    let colorIndex = Math.floor(rnd() * DENSE_EVENT_COLORS.length);
    while (x < W) {
      // 每一簇视作一个事件族。展开的可见泳道逐簇换色；折叠分组仍使用统一灰色概览。
      const fill = colorful ? DENSE_EVENT_COLORS[colorIndex] : '';
      colorIndex = (colorIndex + 1 + Math.floor(rnd() * (DENSE_EVENT_COLORS.length - 1))) % DENSE_EVENT_COLORS.length;
      if (rnd() < 0.14 + density * 0.14) {
        // 一根宽的同步段
        const w = Math.min(30 + rnd() * 120 * density, W - x);
        out += rect(x, w, fill);
        x += w;
      } else {
        // 一团细条:团内只留 1px 缝,团外才是真空白
        const end = Math.min(W, x + (28 + rnd() * 130) * (0.5 + density));
        while (x < end) {
          const w = Math.min(2 + rnd() * 4, end - x);
          out += rect(x, w, fill);
          x += w + 1;
        }
      }
      x += 8 + rnd() * 130 * (1 - density);
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + out + '</svg>';
  }

  // 算子任务条:HTML 绝对定位(不是 SVG),条上的算子名才不会被横向拉伸变形。
  function barsTrack(rnd) {
    let previousName = null;
    let previousColorIndex = -1;
    const pick = (name) => {
      let index = Math.floor(rnd() * BAR_COLORS.length);
      if (previousName !== null && previousName !== name && index === previousColorIndex) {
        index = (index + 1) % BAR_COLORS.length;
      }
      previousName = name;
      previousColorIndex = index;
      return BAR_COLORS[index];
    };
    const bar = (x, w, text, tip) => {
      const ms = (w * DUR_MS / 100).toFixed(2);
      const name = tip || text || 'kernel';
      const c = pick(name);
      return '<span class="msi-bar' + (text ? '' : ' msi-bar--tick') + '" style="left:' + x.toFixed(2) +
        '%;width:' + w.toFixed(2) + '%;background:' + c.bg + ';color:' + c.fg + '"' +
        ' data-op="' + esc(name) + '" data-dur="' + ms + '"' +
        // data-label 是"这条上本来要写的字"的原件。条上显示的可能是中间省略后的结果,
        // 窗口一宽还要能还原回去,所以原文必须单独留一份,不能只靠 textContent。
        (text ? ' data-label="' + esc(text) + '"' : '') +
        ' title="' + esc(name) + ' · ' + ms + 'ms">' + (text ? esc(text) : '') + '</span>';
    };

    let html = '';
    let x = rnd() * 3;
    while (x < 99) {
      if (rnd() < 0.3) {
        // 宽条:写得下就写算子名,写不下退化成无字色块
        const w = Math.min(5 + rnd() * 17, 99 - x);
        if (w < 0.5) break;
        const name = WIDE_NAMES[Math.floor(rnd() * WIDE_NAMES.length)];
        html += bar(x, w, w < 4.5 ? '' : name, name);
        x += w;
      } else {
        // 一团细条:按固定小间隙背靠背排
        const end = Math.min(99, x + 3 + rnd() * 15);
        while (x < end) {
          const w = Math.min(0.3 + rnd() * 0.7, end - x);
          html += bar(x, w, '', '');
          x += w + 0.1;
        }
      }
      // 团与团之间的空白。整体比上一版稀一半,但**稀在团之间**:间隔取双峰分布——
      // 多数是中等间隔,三成概率来一段长空白,于是形成「一团一团 + 大片留白」,
      // 而不是把每根条都均匀拉开(那样只会变成一片稀疏的栅栏,团簇感就没了)。
      x += rnd() < 0.35 ? 14 + rnd() * 30 : 4 + rnd() * 11;
    }
    return html;
  }

  // Perfetto 会把规范化后的 slice name 做稳定哈希，再从覆盖完整色环的调色板取色。
  // 这里沿用相同原则：颜色表达「是什么任务」，泳道层级负责表达 CPU/CANN/NPU/通信类型。
  // 去掉名称里的数字后，同一算子的不同序号仍保持同色；18 色也避免高频 device 全挤在绿色。
  const TRACE_EVENT_PALETTE = Array.from({ length: 18 }, (_, index) => ({
    bg: 'var(--msi-trace-' + String(index + 1).padStart(2, '0') + '-bg)',
    fg: 'var(--msi-trace-task-fg)',
  }));
  function normalizedTraceTaskName(name) {
    return String(name).replace(/( )?\d+/g, '').trim() || String(name);
  }
  const TRACE_TASK_COLOR_BY_ID = new Map();
  function traceTaskColor(task) {
    if (!TRACE_TASK_COLOR_BY_ID.has(task.id)) {
      const colorKey = normalizedTraceTaskName(task.name);
      const index = hashSeed(colorKey) % TRACE_EVENT_PALETTE.length;
      TRACE_TASK_COLOR_BY_ID.set(task.id, TRACE_EVENT_PALETTE[index]);
    }
    return TRACE_TASK_COLOR_BY_ID.get(task.id) || TRACE_EVENT_PALETTE[0];
  }
  function realTraceTrack(lane) {
    return REAL_TRACE_TASKS.filter((task) => task.laneId === lane.id)
      .sort((a, b) => a.start - b.start || a.id.localeCompare(b.id)).map((task) => {
      const c = traceTaskColor(task);
      const left = task.start / TRACE_WINDOW_MS * 100;
      const trueWidth = task.dur / TRACE_WINDOW_MS * 100;
      const width = Math.max(.62, trueWidth); // 微秒级 launch 也要保留可点击宽度
      const meta = task.kind === 'device'
        ? ' · Task ' + task.taskId + ' · connection_id ' + task.connectionId + ' · ' + task.taskType
        : (task.connectionId ? ' · connection_id ' + task.connectionId : '');
      return '<span class="msi-bar" style="left:' + left.toFixed(3) + '%;width:' + width.toFixed(3) +
        '%;background:' + c.bg + ';color:' + c.fg + '" data-task-id="' + task.id +
        '" data-op="' + esc(task.name) + '" data-dur="' + task.dur.toFixed(5) +
        '" data-label="' + esc(task.name) + '" title="' + esc(task.name + ' · ' +
        task.start.toFixed(5) + 'ms · ' + task.dur.toFixed(5) + 'ms' + meta) + '">' +
        esc(task.name) + '</span>';
    }).join('');
  }

  // 带宽曲线:随机游走 + 几个峰,画成填色面积图。
  function areaTrack(rnd, area) {
    const W = 1000, H = AREA_H, N = 150;
    const fill = 'color-mix(in srgb, ' + area.color + ' var(--msi-metric-fill-strength), transparent)';
    const stroke = 'color-mix(in srgb, ' + area.color + ' var(--msi-metric-stroke-strength), var(--foreground))';
    const pts = [];
    let v = 0.35 + rnd() * 0.2;
    const peaks = [0.12 + rnd() * 0.15, 0.4 + rnd() * 0.15, 0.7 + rnd() * 0.2];
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      v += (rnd() - 0.5) * 0.13;
      // 叠几个高斯包,让曲线有明显的波峰而不是纯噪声
      let bump = 0;
      peaks.forEach((p, k) => { bump += (0.25 + k * 0.05) * Math.exp(-Math.pow((t - p) / 0.07, 2)); });
      const y = Math.max(0.06, Math.min(0.96, v * 0.6 + bump));
      pts.push([t * W, H - 3 - y * (H - 8)]);
    }
    let d = 'M0,' + H + ' L' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
    for (let i = 1; i < pts.length; i++) d += ' L' + pts[i][0].toFixed(1) + ',' + pts[i][1].toFixed(1);
    d += ' L' + W + ',' + H + ' Z';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
             '<path d="' + d + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.2"></path>' +
           '</svg>';
  }

  function trackHtml(lane, rnd) {
    // 展开的分组行不画东西:那条密集带只是折叠态下用来概括子行的,展开后子行各画各的,
    // 再留着就成了一条没有含义的占位灰带。
    if (isRealTraceSelection() && REAL_TRACE_TASKS.some((task) => task.laneId === lane.id)) {
      return realTraceTrack(lane);
    }
    if (lane.group && lane.open) return '';
    if (isRealTraceSelection()) {
      // 指标泳道保留曲线；折叠分组保留概览带，避免内容区出现大片空白。
      if (lane.track === 'area') return areaTrack(rnd, lane.area);
      if (lane.track === 'dense') return denseTrack(rnd, lane.density || 0.5, !lane.group && !lane.staticCollapsed);
      return '';
    }
    if (lane.track === 'dense') return denseTrack(rnd, lane.density || 0.5, !lane.group && !lane.staticCollapsed);
    if (lane.track === 'bars') return barsTrack(rnd);
    if (lane.track === 'area') return areaTrack(rnd, lane.area);
    return '';
  }

  function laneRow(lane, depth, rnd) {
    const h = lane.track === 'area' ? AREA_H : ROW_H;
    // 箭头单独做成按钮:点箭头只管折叠/展开,点行内其它地方是「选中这条泳道」。
    // 两个动作分开,才不会一点标题就把整组收起来。
    const caret = lane.group
      ? '<button class="msi-lane-caret-btn" type="button" data-toggle="' + lane.id +
        '" aria-expanded="' + (lane.open ? 'true' : 'false') + '" aria-label="展开或收起">' +
          '<svg class="msi-lane-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>' +
        '</button>'
      : (lane.staticCollapsed
        ? '<span class="msi-lane-caret-static" aria-label="已折叠的线程概览" title="已折叠的线程概览">' +
            '<svg class="msi-lane-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>' +
          '</span>'
        : '<span class="msi-lane-caret-slot" aria-hidden="true"></span>');
    return (
      '<div class="msi-lane-row' + (lane.id === selectedLaneId ? ' is-selected' : '') +
        '" data-lane="' + lane.id + '" style="height:' + h + 'px">' +
        '<div class="msi-lane-label" style="padding-left:' + (12 + depth * 18) + 'px"' +
        ' title="' + esc(lane.label) + '">' +
          caret +
          '<span class="msi-lane-text">' + esc(lane.label) + '</span>' +
        '</div>' +
        '<div class="msi-lane-track">' + trackHtml(lane, rnd) + '</div>' +
      '</div>'
    );
  }

  /* ══ 任务条上的算子名:超长时中间省略 ═══════════════════════════════
     CSS 的 text-overflow 只会省尾巴,而条上的字是居中的 —— 溢出时头尾同时被切,
     "…nvFusion…" 这种两头都缺的样子最难认。改成头尾各留一截、中间用 … 顶掉:
     算子名的辨识度基本都在前缀(算子类别)和后缀(序号/精度)上,这两截留住就够认。
     只能靠 JS 量宽度,CSS 做不到中间省略。 */
  const ELLIPSIS = '…';
  let measureCtx = null;

  // 用 canvas 量而不是往 DOM 里塞一个探针元素:量一次不触发重排,二分时要量十几次
  function textWidth(str, font) {
    if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
    measureCtx.font = font;
    return measureCtx.measureText(str).width;
  }

  // 二分"总共保留几个字",头 ceil(k/2) 尾 floor(k/2) —— 头比尾多留一个,
  // 因为读的时候先看到头,前缀多一个字对认算子更有用。
  function middleEllipsis(text, avail, font) {
    if (textWidth(text, font) <= avail) return text;
    if (textWidth(ELLIPSIS, font) > avail) return '';   // 连一个省略号都摆不下,索性空着
    let lo = 0, hi = text.length - 1, best = ELLIPSIS;
    while (lo <= hi) {
      const k = (lo + hi) >> 1;
      const head = text.slice(0, Math.ceil(k / 2));
      const tailLen = k - head.length;
      const str = head + ELLIPSIS + (tailLen ? text.slice(text.length - tailLen) : '');
      if (textWidth(str, font) <= avail) { best = str; lo = k + 1; } else { hi = k - 1; }
    }
    return best;
  }

  function fitBarLabels(body) {
    const bars = body.querySelectorAll('.msi-bar[data-label]');
    if (!bars.length) return;
    const cs = getComputedStyle(bars[0]);
    // canvas 的 font 简写里 line-height 可省;省掉免得 computed 值是 normal 时拼出非法字符串
    const font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    // 先全部量完再统一写:量(读布局)和写交替会来回触发重排
    const jobs = [];
    bars.forEach((el) => {
      const w = el.getBoundingClientRect().width;
      if (w > 0) jobs.push([el, w - pad]);   // 宽度为 0 = 面板收着还没布局,这轮跳过,等 RO 再来
    });
    jobs.forEach(([el, avail]) => {
      el.textContent = avail > 0 ? middleEllipsis(el.dataset.label, avail, font) : '';
    });
  }

  let selectedTraceTaskId = null;

  function traceComponent(taskId) {
    const ids = new Set(taskId ? [taskId] : []);
    const edges = [];
    let grew = true;
    while (grew) {
      grew = false;
      REAL_TRACE_EDGES.forEach((edge) => {
        if (!ids.has(edge.source) && !ids.has(edge.target)) return;
        if (!edges.includes(edge)) edges.push(edge);
        if (!ids.has(edge.source)) { ids.add(edge.source); grew = true; }
        if (!ids.has(edge.target)) { ids.add(edge.target); grew = true; }
      });
    }
    return { ids, edges };
  }

  function orderedTraceComponent(taskId) {
    const component = traceComponent(taskId);
    const indegree = new Map([...component.ids].map((id) => [id, 0]));
