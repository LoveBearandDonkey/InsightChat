  align-items: flex-start;
  height: 100%;
  position: relative;
  overflow-y: auto;
  padding: 12px 0;
}

.cf-col {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  flex-shrink: 0;
  padding: 0 8px;
}

.cf-col-source {
  width: 190px;
}

.cf-col-compiled {
  width: 190px;
}

.cf-col-label {
  font-size: 10px;
  font-weight: 500;
  color: color-mix(in srgb, var(--foreground) 28%, transparent);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 0 6px;
  margin-bottom: 6px;
}

.cf-mapping-svg {
  position: absolute;
  top: 36px;
  left: 0;
  width: 100%;
  height: calc(100% - 36px);
  pointer-events: none;
  overflow: visible;
  z-index: 5;
}

.cf-node {
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.07);
  background: rgba(30, 30, 30, 0.8);
  padding: 6px 8px;
  transition: border-color 0.15s, background 0.15s;
}

.cf-node-main {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.cf-node-label {
  font-size: 11px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.75);
  font-family: var(--text-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cf-node-annotation {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.35);
  font-family: var(--text-mono);
  line-height: 1.4;
}

.cf-node-entry {
  border-color: rgba(255, 255, 255, 0.12);
  background: rgba(40, 40, 40, 0.9);
}

.cf-node-entry > .cf-node-main > .cf-node-label {
  color: rgba(255, 255, 255, 0.5);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.cf-node-loop,
.cf-node-loop_unroll {
  border-color: rgba(255, 255, 255, 0.09);
  background: rgba(28, 28, 36, 0.85);
}

.cf-node-loop > .cf-node-main > .cf-node-label,
.cf-node-loop_unroll > .cf-node-main > .cf-node-label {
  color: rgba(180, 160, 255, 0.8);
}

.cf-node-unroll {
  background: rgba(26, 26, 26, 0.7);
  border-color: rgba(255, 255, 255, 0.06);
}

.cf-node-path {
  background: rgba(24, 24, 30, 0.8);
  border-color: rgba(255, 255, 255, 0.07);
}

.cf-node-path > .cf-node-main > .cf-node-label {
  color: rgba(120, 160, 255, 0.8);
}

.cf-clickable {
  cursor: pointer;
}

.cf-node-path.cf-clickable:hover,
.cf-node-unroll.cf-clickable:hover {
  border-color: rgba(124, 58, 237, 0.45);
  background: rgba(124, 58, 237, 0.08);
}

.cf-node-path.cf-active,
.cf-node-unroll.cf-active,
.cf-node-loop.cf-active {
  border-color: rgba(124, 58, 237, 0.7);
  background: rgba(124, 58, 237, 0.12);
  box-shadow: 0 0 0 1px rgba(124, 58, 237, 0.25);
}

.cf-node-path.cf-active > .cf-node-main > .cf-node-label,
.cf-node-unroll.cf-active > .cf-node-main > .cf-node-label {
  color: #a78bfa;
}

.cf-children {
  margin-top: 6px;
  padding-left: 10px;
  border-left: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cf-reopen-btn {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  color: var(--foreground-secondary);
  cursor: pointer;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.cf-reopen-btn:hover {
  color: var(--foreground);
  background: var(--state-hover);
  border-color: var(--border-strong);
}

/* ── Locked Flow Panel ──────────────────────────────────────────── */
.flow-panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 280px;
  background: rgba(16, 16, 16, 0.97);
  border-top: 1px solid var(--toolbar-border);
  backdrop-filter: blur(14px);
  display: flex;
  flex-direction: column;
  z-index: 45;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.flow-panel.open {
  transform: translateY(0);
}
.flow-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  height: 36px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--toolbar-border);
}
.flow-lock-icon {
  opacity: 0.4;
  flex-shrink: 0;
  color: var(--text-secondary);
}
.flow-title {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.4;
  flex-shrink: 0;
}
.flow-stats {
  flex: 1;
  font-size: 11px;
  font-family: var(--text-mono);
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.flow-unlock {
  color: var(--text-secondary);
  border-color: transparent;
  background: transparent;
  flex-shrink: 0;
}
.flow-unlock:hover { color: var(--text-primary); background: var(--tag-bg); }

.flow-viewport {
  flex: 1;
  overflow: auto;
  position: relative;
}
.flow-graph-root {
  position: relative;
  display: block;
}

/* Detail panel — Lock button */
.detail-lock {
  padding: 3px 6px;
  color: var(--text-secondary);
  border-color: transparent;
  background: transparent;
  flex-shrink: 0;
  transition: color 0.15s, opacity 0.15s, background 0.15s;
}
.detail-lock:hover { color: var(--text-primary); background: var(--tag-bg); }
.detail-lock.locked { color: #7c3aed; }
.detail-lock:disabled {
  opacity: 0.38;
  cursor: not-allowed;
  background: transparent;
}

/* ═══════════════════════════════════════════════════════════════════════════
   [5] workbench-shell pattern(原 css/workbench-shell-pattern.css)
   ═══════════════════════════════════════════════════════════════════════════ */
.pto-workbench-shell,
.workbench-frame {
  --pto-workbench-shell-gutter: 10px;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.pto-workbench-shell__panes,
.workbench-frame-split {
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: stretch;
  gap: 0;
  overflow: hidden;
}

.pto-workbench-shell__panes[data-split-direction="vertical"],
.workbench-frame-split[data-split-direction="vertical"] {
  flex-direction: column;
}

.pto-workbench-shell__pane,
.workbench-pane {
  min-width: 0;
  min-height: 0;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pto-workbench-shell__pane-body,
.workbench-pane-body {
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  overflow: auto;
}

.pto-workbench-shell__split-gutter {
  flex: 0 0 var(--pto-workbench-shell-gutter, 10px);
  position: relative;
  min-width: var(--pto-workbench-shell-gutter, 10px);
  cursor: col-resize;
  touch-action: none;
  outline: none;
  background: transparent;
}

.pto-workbench-shell__split-gutter[data-split-direction="vertical"] {
  width: 100%;
  min-width: 0;
  min-height: var(--pto-workbench-shell-gutter, 10px);
  cursor: row-resize;
}

.pto-workbench-shell__split-gutter::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 3px;
  height: 44px;
  border-radius: var(--radius-pill, 999px);
  transform: translate(-50%, -50%);
  background: color-mix(in srgb, var(--foreground-muted, rgba(255, 255, 255, 0.42)) 46%, transparent);
  transition:
    background var(--duration-fast, 100ms) var(--easing-default, ease),
    width var(--duration-fast, 100ms) var(--easing-default, ease),
    height var(--duration-fast, 100ms) var(--easing-default, ease);
}

.pto-workbench-shell__split-gutter[data-split-direction="vertical"]::before {
  width: 44px;
  height: 3px;
}

.pto-workbench-shell__split-gutter:hover::before,
.pto-workbench-shell__split-gutter:focus-visible::before,
body.pto-is-pane-resizing .pto-workbench-shell__split-gutter::before {
  background: color-mix(in srgb, var(--foreground-secondary, rgba(255, 255, 255, 0.62)) 72%, transparent);
}

.pto-workbench-shell__split-gutter:focus-visible {
  box-shadow: 0 0 0 2px var(--focus-ring, rgba(67, 105, 239, 0.42));
}

body.pto-is-pane-resizing,
body.pto-is-pane-resizing * {
  user-select: none;
}

body.pto-is-pane-resizing[data-pto-resize-direction="horizontal"],
body.pto-is-pane-resizing[data-pto-resize-direction="horizontal"] * {
  cursor: col-resize !important;
}

body.pto-is-pane-resizing[data-pto-resize-direction="vertical"],
body.pto-is-pane-resizing[data-pto-resize-direction="vertical"] * {
  cursor: row-resize !important;
}

/* ═══════════════════════════════════════════════════════════════════════════
   [6] ide-frame pattern(原 css/ide-frame-pattern.css)
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --ide-bg-start: #17181d;
  --ide-bg-mid: #101114;
  --ide-bg-end: #0c0d10;
  --ide-glow-left: 155 96 170;
  --ide-glow-right: 67 105 239;
  --ide-glow-center: 20 184 166;
  --ide-glow-lower: 245 158 11;
  --ide-glow-bottom: 244 114 182;
  --ide-dot-color: 116 140 190;
  --ide-dot-hot-color: 155 96 170;
  --ide-cursor-color: 67 105 239;
  --ide-gradient-left-alpha: 0.12;
  --ide-gradient-right-alpha: 0.12;
  --ide-gradient-center-alpha: 0.06;
  --ide-gradient-lower-alpha: 0.05;
  --ide-aura-left-alpha: 0.18;
  --ide-aura-right-alpha: 0.16;
  --ide-aura-center-alpha: 0.08;
  --ide-aura-lower-alpha: 0.06;
  --ide-aura-bottom-alpha: 0.08;
  --ide-dot-opacity: 0;
  --ide-dot-size: 1px;
  --ide-dot-gap: 20px;
  --ide-dot-hot-radius: 220px;
  --ide-cursor-x: 50%;
  --ide-cursor-y: 40%;
  --ide-cursor-alpha: 0;
  --ide-cursor-radius: 380px;
  --ide-gradient-bg:
    radial-gradient(circle at top left, rgb(var(--ide-glow-left) / var(--ide-gradient-left-alpha)), transparent 28%),
    radial-gradient(circle at top right, rgb(var(--ide-glow-right) / var(--ide-gradient-right-alpha)), transparent 30%),
    radial-gradient(circle at 48% 6%, rgb(var(--ide-glow-center) / var(--ide-gradient-center-alpha)), transparent 34%),
    radial-gradient(circle at 18% 86%, rgb(var(--ide-glow-lower) / var(--ide-gradient-lower-alpha)), transparent 34%),
    linear-gradient(180deg, var(--ide-bg-start) 0%, var(--ide-bg-mid) 44%, var(--ide-bg-end) 100%);
  --ide-aura-bg:
    radial-gradient(circle at var(--ide-cursor-x) var(--ide-cursor-y), rgb(var(--ide-cursor-color) / var(--ide-cursor-alpha)) 0, transparent var(--ide-cursor-radius)),
    radial-gradient(circle at 12% 12%, rgb(var(--ide-glow-left) / var(--ide-aura-left-alpha)), transparent 0 22rem),
    radial-gradient(circle at 88% 8%, rgb(var(--ide-glow-right) / var(--ide-aura-right-alpha)), transparent 0 24rem),
    radial-gradient(circle at 52% 18%, rgb(var(--ide-glow-center) / var(--ide-aura-center-alpha)), transparent 0 20rem),
    radial-gradient(circle at 18% 78%, rgb(var(--ide-glow-lower) / var(--ide-aura-lower-alpha)), transparent 0 18rem),
    radial-gradient(circle at 72% 86%, rgb(var(--ide-glow-bottom) / var(--ide-aura-bottom-alpha)), transparent 0 18rem);
  --ide-frame-page-bg: var(--ide-gradient-bg);
  --ide-frame-bg: var(--ide-gradient-bg);
  --ide-frame-chrome-bg: transparent;
  --ide-frame-pane-bg: var(--background);
  --ide-frame-pane-fill: color-mix(in srgb, var(--ide-frame-pane-bg) 80%, transparent);
  --ide-frame-pane-header-fill: color-mix(in srgb, var(--ide-frame-pane-bg) 72%, transparent);
  --ide-frame-pane-backdrop-filter: blur(18px) saturate(1.18);
  --ide-frame-pane-shadow: 0 12px 30px color-mix(in srgb, var(--background) 10%, transparent);
  --ide-frame-pane-border: var(--border-subtle);
  --ide-frame-header-height: 32px;
  --ide-frame-title-font: 600 12.5px / 1.2 var(--font-sans);
  --ide-frame-meta-font: 500 11px / 1.35 var(--font-mono);
  --ide-frame-icon-stroke: var(--foreground);
  --ide-frame-icon-stroke-inverse: #101010;
  --ide-frame-icon-opacity-strong: 1;
  --ide-frame-icon-opacity-secondary: 1;
  --ide-frame-icon-opacity-muted: 1;
}

:root[data-theme='glass'] {
  --ide-frame-icon-stroke: var(--foreground);
  --ide-frame-icon-stroke-inverse: #080a0f;
  --ide-frame-icon-opacity-strong: 1;
  --ide-frame-icon-opacity-secondary: 1;
  --ide-frame-icon-opacity-muted: 1;
}

:root[data-theme='light'] {
  --ide-bg-start: #fdfdff;
  --ide-bg-mid: #f6f7fb;
  --ide-bg-end: #eceff6;
  --ide-glow-left: 155 96 170;
  --ide-glow-right: 24 99 220;
  --ide-glow-center: 20 184 166;
  --ide-glow-lower: 245 158 11;
  --ide-glow-bottom: 244 114 182;
  --ide-dot-color: 24 99 220;
  --ide-dot-hot-color: 155 96 170;
  --ide-cursor-color: 24 99 220;
  --ide-gradient-left-alpha: 0.16;
  --ide-gradient-right-alpha: 0.14;
  --ide-gradient-center-alpha: 0.08;
  --ide-gradient-lower-alpha: 0.06;
  --ide-aura-left-alpha: 0.22;
  --ide-aura-right-alpha: 0.18;
  --ide-aura-center-alpha: 0.10;
  --ide-aura-lower-alpha: 0.08;
  --ide-aura-bottom-alpha: 0.08;
  --ide-gradient-bg:
    radial-gradient(circle at top left, rgb(var(--ide-glow-left) / var(--ide-gradient-left-alpha)), transparent 28%),
    radial-gradient(circle at top right, rgb(var(--ide-glow-right) / var(--ide-gradient-right-alpha)), transparent 30%),
    radial-gradient(circle at 48% 6%, rgb(var(--ide-glow-center) / var(--ide-gradient-center-alpha)), transparent 34%),
    radial-gradient(circle at 18% 86%, rgb(var(--ide-glow-lower) / var(--ide-gradient-lower-alpha)), transparent 34%),
    linear-gradient(180deg, var(--ide-bg-start) 0%, var(--ide-bg-mid) 42%, var(--ide-bg-end) 100%);
  --ide-aura-bg:
    radial-gradient(circle at var(--ide-cursor-x) var(--ide-cursor-y), rgb(var(--ide-cursor-color) / var(--ide-cursor-alpha)) 0, transparent var(--ide-cursor-radius)),
    radial-gradient(circle at 12% 12%, rgb(var(--ide-glow-left) / var(--ide-aura-left-alpha)), transparent 0 22rem),
    radial-gradient(circle at 88% 8%, rgb(var(--ide-glow-right) / var(--ide-aura-right-alpha)), transparent 0 24rem),
    radial-gradient(circle at 52% 18%, rgb(var(--ide-glow-center) / var(--ide-aura-center-alpha)), transparent 0 20rem),
    radial-gradient(circle at 18% 78%, rgb(var(--ide-glow-lower) / var(--ide-aura-lower-alpha)), transparent 0 18rem),
    radial-gradient(circle at 72% 86%, rgb(var(--ide-glow-bottom) / var(--ide-aura-bottom-alpha)), transparent 0 18rem);
  --ide-frame-page-bg: var(--ide-gradient-bg);
  --ide-frame-bg: var(--ide-gradient-bg);
  --ide-frame-pane-bg: #ffffff;
  --ide-frame-icon-stroke: var(--foreground);
  --ide-frame-icon-stroke-inverse: #ffffff;
  --ide-frame-icon-opacity-strong: 1;
  --ide-frame-icon-opacity-secondary: 1;
  --ide-frame-icon-opacity-muted: 1;
}

.pto-ide-frame-preview-page {
  min-height: 100vh;
  margin: 0;
  background: var(--ide-frame-page-bg);
  color: var(--foreground);
  font-family: var(--font-sans);
}

.pto-ide-frame-preview {
  width: min(1480px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 24px 0 48px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.pto-ide-frame-preview h1 {
  margin: 0;
  font: var(--text-display);
  letter-spacing: 0;
}

.pto-ide-frame-preview p {
  max-width: 920px;
  margin: 0;
  color: var(--foreground-secondary);
  font: var(--text-body);
}

.pto-ide-frame-preview__stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.pto-ide-frame-preview__label {
  color: var(--foreground-muted);
  font: var(--text-mono);
}

.pto-ide-frame {
  --pto-workbench-shell-gutter: 7px;
  --floating-playback-expanded-width: 820px;
  width: 100%;
  aspect-ratio: 4 / 3;
  height: auto;
  min-width: 0;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--ide-frame-bg);
  color: var(--foreground);
  border: 0;
  border-radius: 14px;
  box-shadow:
    0 18px 54px rgba(0, 0, 0, 0.32),
    inset 0 0 0 1px color-mix(in srgb, var(--foreground) 5%, transparent);
}

.pto-ide-frame::before,
.pto-ide-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.pto-ide-frame::before {
  background: var(--ide-aura-bg);
}

.pto-ide-frame::after {
  background-image: radial-gradient(circle, rgb(var(--ide-dot-color) / var(--ide-dot-opacity)) var(--ide-dot-size), transparent calc(var(--ide-dot-size) + 0.6px));
  background-position: 0 0;
  background-size: var(--ide-dot-gap) var(--ide-dot-gap);
  mix-blend-mode: screen;
}

:root[data-theme='light'] .pto-ide-frame::after {
  mix-blend-mode: multiply;
}

.pto-ide-frame[data-cursor-dots="true"]::after {
  -webkit-mask-image: radial-gradient(circle at var(--ide-cursor-x) var(--ide-cursor-y), #000 0, #000 var(--ide-dot-hot-radius), rgb(0 0 0 / 0.25) calc(var(--ide-dot-hot-radius) + 160px), transparent calc(var(--ide-dot-hot-radius) + 340px));
  mask-image: radial-gradient(circle at var(--ide-cursor-x) var(--ide-cursor-y), #000 0, #000 var(--ide-dot-hot-radius), rgb(0 0 0 / 0.25) calc(var(--ide-dot-hot-radius) + 160px), transparent calc(var(--ide-dot-hot-radius) + 340px));
}

.pto-ide-frame > * {
  position: relative;
  z-index: 1;
}

.pto-ide-frame[data-host="vscode-webview"] {
  height: auto;
  border-radius: var(--radius-md);
}

.pto-ide-frame__topbar,
.pto-ide-frame__tabstrip,
.pto-ide-frame__status-strip,
.pto-ide-frame__domain-toolbar {
  flex: 0 0 auto;
  background: transparent;
}

.pto-ide-frame__topbar {
  min-height: 48px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 0;
}

.pto-ide-frame__topbar-left,
.pto-ide-frame__topbar-center,
.pto-ide-frame__topbar-right {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.pto-ide-frame__topbar-left {
  flex: 1 1 0;
  justify-content: flex-start;
}

.pto-ide-frame__topbar-center {
  flex: 0 1 420px;
  justify-content: center;
}

.pto-ide-frame__topbar-right {
  flex: 1 1 0;
  justify-content: flex-end;
}

.pto-ide-frame__host-chip {
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--ide-frame-control-border);
  background: var(--ide-frame-control-bg);
  box-shadow: var(--ide-frame-control-shadow);
  color: var(--foreground-secondary);
  font: var(--ide-frame-title-font);
  backdrop-filter: var(--surface-backdrop-filter-soft);
  -webkit-backdrop-filter: var(--surface-backdrop-filter-soft);
}

.pto-ide-frame__host-icon {
  width: 17px;
  height: 17px;
  display: block;
  fill: none;
  stroke: var(--ide-frame-icon-stroke);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: var(--ide-frame-icon-opacity-secondary);
}

.pto-ide-frame__workspace {
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--foreground-secondary);
  font: var(--ide-frame-title-font);
}

.pto-ide-frame__search {
  width: min(100%, 360px);
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--ide-frame-control-border);
  background: var(--ide-frame-control-bg);
  box-shadow: var(--ide-frame-control-shadow);
  color: var(--foreground-muted);
  font: var(--ide-frame-title-font);
  backdrop-filter: var(--surface-backdrop-filter-soft);
  -webkit-backdrop-filter: var(--surface-backdrop-filter-soft);
}

.pto-ide-frame__search-icon {
  width: 15px;
  height: 15px;
  display: block;
  fill: none;
  stroke: var(--ide-frame-icon-stroke);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: var(--ide-frame-icon-opacity-muted);
}

.pto-ide-frame__window-actions {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.pto-ide-frame__window-action {
  width: 28px;
  height: 28px;
  display: inline-grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--foreground-muted);
  font: var(--ide-frame-title-font);
  display: inline-grid;
  place-items: center;
}

.pto-ide-frame__window-icon {
  width: 17px;
  height: 17px;
  display: block;
  fill: none;
  stroke: var(--ide-frame-icon-stroke);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: var(--ide-frame-icon-opacity-muted);
}

/* 彩色头像图标(智能对话入口的 msinsightbotAvatar):不参与描边图标的压暗与主题反相。
   悬浮时缓入缓出正向转一整圈;用一次性 animation 而不是 transition,鼠标移开直接停在
   原位,不会反向转回去(转满一圈刚好回到 0°,所以停下时也不跳)。 */
.pto-ide-frame__window-icon--image {
  width: 18px;
  height: 18px;
  opacity: 1;
  filter: none;
}

.pto-ide-frame__window-action:hover .pto-ide-frame__window-icon--image {
  opacity: 1;
  animation: pto-ide-frame-icon-spin .7s ease-in-out;
}

@keyframes pto-ide-frame-icon-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .pto-ide-frame__window-action:hover .pto-ide-frame__window-icon--image { animation: none; }
}

.pto-ide-frame__window-separator {
  width: 1px;
  height: 18px;
  margin: 0 5px;
  background: color-mix(in srgb, var(--foreground) 14%, transparent);
}

.pto-ide-frame__window-action:hover {
  background: var(--state-hover);
  color: var(--foreground-secondary);
}

.pto-ide-frame__window-action:hover .pto-ide-frame__window-icon {
  opacity: var(--ide-frame-icon-opacity-secondary);
}

.pto-ide-frame__window-action--danger:hover {
  background: color-mix(in srgb, var(--danger, #ff5f57) 14%, transparent);
  color: var(--danger, #ff5f57);
}

.pto-ide-frame__window-action--danger:hover .pto-ide-frame__window-icon {
  stroke: var(--danger, #ff5f57);
  opacity: 1;
}

.pto-ide-frame__crumbs {
  min-width: 0;
  color: var(--foreground-secondary);
  font: var(--ide-frame-meta-font);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pto-ide-frame__tabstrip {
  min-height: 38px;
  padding: 5px 8px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 0;
}

.pto-ide-frame__tabstrip .tab-control {
  min-height: 32px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  box-shadow: none;
}

.pto-ide-frame__tabstrip .tab-control {
  max-width: 100%;
  overflow-x: auto;
}

.pto-ide-frame__tabstrip .tab-control-item {
  min-height: 32px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: transparent;
}

.pto-ide-frame__tabstrip .tab-control-item.is-selected,
.pto-ide-frame__tabstrip .tab-control-item.is-selected:hover {
  border-color: var(--ide-frame-selected-border);
  background: var(--ide-frame-selected-bg);
  box-shadow: var(--ide-frame-selected-shadow);
  backdrop-filter: var(--surface-backdrop-filter-soft);
  -webkit-backdrop-filter: var(--surface-backdrop-filter-soft);
}

.pto-ide-frame__tabstrip .tab-control::-webkit-scrollbar {
  display: none;
}

.pto-ide-frame__tab-close {
  margin-left: 6px;
  width: 13px;
  height: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--foreground-muted);
}

.pto-ide-frame__tab-close svg {
  width: 13px;
  height: 13px;
  display: block;
  fill: none;
  stroke: var(--ide-frame-icon-stroke);

/* ═══════════════════════════════════════════════════════════════════════════
   [7] 智能对话面板(摘自 training-monitoring-v2.html 内联样式)
   ═══════════════════════════════════════════════════════════════════════════ */
    /* ── 智能对话:训练场景 AI 助手,右侧滑出面板,默认收起(见 #trainChatToggle/js/training-chat-panel.js)。
         沿用 wzh-locate-drawer 的滑出手法但不加暗背景遮罩 —— 对话过程中仍要能看到左侧整网图/指标。
         悬浮卡片形态:上/右/下各留 8px 呼吸间距、16px 圆角(与 panel-shell/modal 同级 --radius-xl),
         而非贴屏边的直角抽屉。收起时额外多平移一段(100% + 间距 + 阴影余量),避免圆角一角在
         右侧留白里露出一小截。 ── */
    /* 默认「挤入式」:面板是 .chat-shell-workarea 里的第二列,展开时把左边内容区挤窄,
       而不是浮在它上面。收起靠 flex-basis 收到 0 + 淡出,所以内容区会平滑地重新铺满。 */
    .wzh-chat-panel {
      position: relative;
      flex: 0 0 0px;
      align-self: stretch;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      opacity: 0;
      transition: flex-basis var(--duration-base) var(--easing-default),
                  opacity var(--duration-base) var(--easing-default);
      pointer-events: none;
      /* 挤入式展开后的宽度。480px 只是初值:拖 #chatShellResizer 会把它改成别的像素值,
         下限 320px、上限是工作区的一半;窄屏下由下面那条媒体查询换成 46% */
      --wzh-chat-w: 480px;
      /* 品牌蓝:面板内所有蓝色(发送按钮、标签、描边)统一取这一个值 */
      --mi-brand-blue: var(--brand-blue);
      /* 挤入式贴着内容区,不投影;浮动窗才用 --wzh-chat-shadow */
      --wzh-chat-shadow: var(--shadow-lg);
      box-shadow: none;
    }
    /* 浅色主题:--shadow-lg 是给深色底调的,直接用在白底上会发灰发闷,
       这里给面板单独换一套低透明度的冷灰阴影。 */
    :root[data-theme='light'] .wzh-chat-panel {
      --wzh-chat-shadow: 0 14px 34px rgba(58, 68, 120, 0.14), 0 2px 8px rgba(58, 68, 120, 0.07);
    }
    .wzh-chat-panel.is-open {
      flex-basis: var(--wzh-chat-w, 480px);
      opacity: 1;
      pointer-events: auto;
    }
    /* 拖分隔条时 flex-basis 每帧都在变,留着过渡就会跟不上手 */
    .wzh-chat-panel.is-resizing { transition: none; }
    /* 挤入式下窗口窄了就别死守 480,给内容区留出可用宽度 */
    @media (max-width: 1080px) {
      .wzh-chat-panel:not(.is-floating) { --wzh-chat-w: 46%; }
    }

    /* 「悬浮窗」模式(右上角 #trainChatFloatBtn 切换):贴右侧浮起来的抽屉,不占内容区宽度 */
    .wzh-chat-panel.is-floating {
      position: fixed;
      top: 8px;
      right: 8px;
      bottom: 8px;
      left: auto;
      flex: 0 0 auto;
      width: 480px;
      max-width: 92vw;
      z-index: 1900;
      box-shadow: var(--wzh-chat-shadow);
      opacity: 1;
      transform: translateX(calc(100% + 40px));
      transition: transform var(--duration-base) var(--easing-default);
    }
    .wzh-chat-panel.is-floating.is-open {
      transform: translateX(0);
      pointer-events: auto;
    }
    /* 回答里的「信息可视化」展开后，对话栏从普通 flex 列切成覆盖在工作区之上的双栏。
       左栏宽度在点击时按展开前实测值写回 --wzh-chat-w；右栏占新增的另一半。 */
    .wzh-chat-panel.is-open.is-visualizing {
      position: fixed;
      top: var(--wzh-viz-top, 48px);
      right: var(--wzh-viz-right, 8px);
      bottom: var(--wzh-viz-bottom, 8px);
      left: auto;
      z-index: 1950;
      width: min(calc(var(--wzh-chat-w, 480px) * 2), calc(100vw - 16px));
      max-width: calc(100vw - 16px);
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: minmax(320px, var(--wzh-chat-w, 480px)) minmax(320px, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
      opacity: 1;
      transform: none;
      box-shadow: var(--wzh-chat-shadow);
      transition: width var(--duration-base) var(--easing-default),
                  box-shadow var(--duration-base) var(--easing-default);
    }
    .wzh-chat-panel.is-visualizing > .wzh-chat-head { grid-column: 1; grid-row: 1; }
    .wzh-chat-panel.is-visualizing > .wzh-chat-session { grid-column: 1; grid-row: 2; }
    .wzh-chat-panel.is-visualizing > .wzh-chat-body { grid-column: 1; grid-row: 3; min-width: 0; }
    .wzh-chat-panel.is-visualizing #trainChatFloatBtn { display: none; }
    /* 标题栏下不加分割线——右上角只留"设置 Key(齿轮) + 关闭"两个图标按钮,
       原来的上下文行/Key 状态行/额度行都收进了这一个齿轮按钮里(见 #trainChatKeyBtn)。 */
    .wzh-chat-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-2); flex: 0 0 auto;
      padding: 12px 12px 8px 16px;
    }
    /* 左侧品牌区:助手头像 + 名称 + 下拉箭头(还原稿 src/pic/欢迎页.png)。
       整行同时是「切换 Agent」的按钮,弹层挂在它下面,所以这层要当定位参照。 */
    .wzh-chat-head-brand { position: relative; min-width: 0; }
    .wzh-chat-head-title-row {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      /* 负外边距把按钮内边距抵掉:浮不浮底色,头像和文字都停在同一个位置 */
      margin: 0 -10px; padding: 5px 10px;
      border: none; border-radius: var(--radius-md, 8px);
      background: transparent; cursor: pointer; text-align: left;
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-head-title-row:hover { background: var(--state-hover); }
    .wzh-chat-head-title-row:focus-visible { outline: none; background: var(--state-hover); }
    /* 弹层开着时按钮保持按下态,视线不会丢了"是从哪儿点开的" */
    .wzh-chat-head-title-row[aria-expanded='true'] { background: var(--state-hover); }
    .wzh-chat-head-logo { width: 20px; height: 20px; flex-shrink: 0; display: block; }
    .wzh-chat-head-title {
      font: 400 14px/1.4 var(--font-sans); color: var(--foreground);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .wzh-chat-head-caret {
      width: 16px; height: 16px; flex-shrink: 0; opacity: .75; display: block;
      transition: transform var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-head-title-row[aria-expanded='true'] .wzh-chat-head-caret { transform: rotate(180deg); }

    /* ── 切换 Agent 弹层(见 initAgentSwitch) ────────────────────────────────
       从标题行左边缘往下落,宽度由最长的 Agent 名撑开(min-width 兜底);
       列表在上、"添加 Agent"在下,中间一条分割线。 */
    .wzh-chat-agent-pop {
      position: absolute; top: calc(100% + 6px); left: -10px; z-index: 30;
      box-sizing: border-box; min-width: 236px; padding: 8px;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--wzh-chat-shadow);
    }
    .wzh-chat-agent-pop[hidden] { display: none; }
    .wzh-chat-agent-pop-title {
      margin: 0; padding: 4px 10px 8px;
      font: 400 13px/1.4 var(--font-sans); color: var(--foreground-placeholder);
    }
    .wzh-chat-agent-list { display: flex; flex-direction: column; gap: 2px; }
    .wzh-chat-agent-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; box-sizing: border-box;
      padding: 8px 10px; border: none; border-radius: var(--radius-md, 8px);
      background: none; cursor: pointer; text-align: left;
      font: 400 14px/1.4 var(--font-sans); color: var(--foreground);
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-agent-item:hover { background: var(--state-hover); }
    .wzh-chat-agent-item:focus-visible { outline: none; background: var(--state-hover); }
    /* 当前 Agent:浅蓝底 + 右侧对勾,和 .wzh-chat-ctx-item 的灰底高亮区分开 */
    .wzh-chat-agent-item.is-current,
    .wzh-chat-agent-item.is-current:hover { background: var(--state-selected); }
    .wzh-chat-agent-item img {
      width: 20px; height: 20px; flex-shrink: 0; display: block;
    }
    /* Agent 图标分两类:msinsightbotAvatar.png 是圆头像,该切圆;各家模型的 svg 是自带底色的
       方形标(glm/deepseek/codex/pangu/claude 都是实心圆角方片),按 50% 裁会把四角削掉,
       看着像被硬挤成了圆形——所以方片只给它原本那点小圆角,圆形只留给 MS Insight 头像。
       两处图标(标题栏头像 + 下拉项)同一套规则。 */
    .wzh-chat-head-logo,
    .wzh-chat-agent-item img { border-radius: 5px; }
    /* 用 data-icon 而不是 [src$=] 判断:打包成单文件后 src 是 data URI,按后缀匹配会失效 */
    .wzh-chat-head-logo[data-icon="msinsightbotAvatar.png"],
    .wzh-chat-agent-item img[data-icon="msinsightbotAvatar.png"] { border-radius: 50%; }
    .wzh-chat-agent-item-name {
      min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .wzh-chat-agent-check {
      width: 16px; height: 16px; flex-shrink: 0;
      fill: none; stroke: var(--mi-brand-blue); stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      visibility: hidden;
    }
    .wzh-chat-agent-item.is-current .wzh-chat-agent-check { visibility: visible; }
    /* 底部两个按钮「刷新 / 添加 Agent」左右并列:用 1fr 1fr 而不是 flex:1,
       等宽是按栅格分的,不受各自文字长短影响(「刷新」两个字也照样占一半)。 */
    .wzh-chat-agent-pop-foot {
      margin-top: 8px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .wzh-chat-agent-foot-btn {
      display: block; width: 100%; box-sizing: border-box; min-width: 0;
      padding: 9px 10px; border: 1px solid var(--border-default);
      border-radius: var(--radius-md, 8px); background: transparent; cursor: pointer;
      font: 400 14px/1.4 var(--font-sans); color: var(--foreground); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-agent-foot-btn:hover { background: var(--state-hover); }
    .wzh-chat-agent-foot-btn:focus-visible { outline: none; background: var(--state-hover); }
    /* 刷新过程中按钮暂时不可点,避免连点重复重建列表 */
    .wzh-chat-agent-foot-btn:disabled { opacity: .6; cursor: default; }
    .wzh-chat-head-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .wzh-chat-head-menu { position: relative; display: inline-flex; }
    /* 右侧窗口操作:新对话 / 历史 / 设置(= DeepSeek Key) / 悬浮窗 / 关闭,图标取自 src/pic/icon/ */
    .wzh-chat-head-btn {
      position: relative;
      width: 28px; height: 28px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: var(--radius-sm); background: transparent;
      color: var(--foreground); cursor: pointer;
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-head-btn:hover { background: var(--state-hover); }
    .wzh-chat-head-btn[aria-expanded='true'] { background: var(--state-selected); }
    /* 悬浮窗模式生效时,悬浮窗按钮保持按下态 */
    .wzh-chat-head-btn.is-active { background: var(--state-selected); }
    .wzh-chat-head-btn img { width: 20px; height: 20px; display: block; }
    /* 历史对话从头部图标正下方展开；记录标题与会话主题保持同一份文案。 */
    .wzh-chat-history-pop {
      position: absolute; top: calc(100% + 8px); right: -100px; z-index: 40;
      box-sizing: border-box; width: 300px; padding: 8px;
      background: var(--surface-1); border: 1px solid var(--border-default);
      border-radius: var(--radius-lg); box-shadow: var(--wzh-chat-shadow);
    }
    .wzh-chat-history-pop[hidden] { display: none; }
    .wzh-chat-history-pop-title {
      margin: 0; padding: 4px 10px 8px;
      font: 400 13px/1.4 var(--font-sans); color: var(--foreground-placeholder);
    }
    .wzh-chat-history-item {
      display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
      padding: 9px 10px; border: none; border-radius: var(--radius-md, 8px);
      background: transparent; color: var(--foreground); cursor: pointer; text-align: left;
      font: 400 14px/1.4 var(--font-sans);
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-history-item:hover,
    .wzh-chat-history-item:focus-visible { background: var(--state-hover); outline: none; }
    .wzh-chat-history-item img { width: 18px; height: 18px; flex: 0 0 auto; }
    .wzh-chat-history-item-text {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Key 已配置时,齿轮右上角点一个蓝点作为唯一视觉线索(悬浮 title 给出完整文案) */
    #trainChatKeyBtn.is-configured::after {
      content: ''; position: absolute; right: 3px; top: 3px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--mi-brand-blue);
    }


    /* ── 会话主题行 ────────────────────────────────────────────────────────
       标题栏与消息区之间的一行"这次会话在解决什么"(还原稿 src/pic/思考完成-过程收起.png)。
       它不在滚动容器里,所以翻多久都不会滚走;左边距按 .wzh-chat-messages 的 16px 对齐,
       悬浮底色靠按钮自身的负外边距外扩,文字位置不会因为浮不浮底色而跳。 */
    .wzh-chat-session { flex: 0 0 auto; padding: 0 16px; min-width: 0; }
    .wzh-chat-session[hidden] { display: none; }
    .wzh-chat-session-btn {
      display: inline-flex; align-items: center; gap: 8px;
      max-width: 100%; min-width: 0;
      margin: 0 -10px; padding: 5px 10px;
      border: none; border-radius: var(--radius-sm, 8px);
      background: transparent; cursor: pointer; text-align: left;
      font: var(--font-weight-bold, 700) 14px/1.4 var(--font-sans); color: var(--foreground);
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-session-btn:hover,
    .wzh-chat-session-btn:focus-visible {
      background: color-mix(in srgb, var(--foreground) 7%, transparent);
      outline: none;
    }
    .wzh-chat-session-text { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 铅笔平时不占视线,悬浮/聚焦这一行才淡入——但宽度一直占着,免得文字被它挤得左右晃 */
    .wzh-chat-session-pen {
      width: 15px; height: 15px; flex-shrink: 0;
      display: block;
      opacity: 0; transition: opacity var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-session-btn:hover .wzh-chat-session-pen,
    .wzh-chat-session-btn:focus-visible .wzh-chat-session-pen { opacity: .72; }
    /* 改名态:就地换成输入框,尺寸/字号与上面那行完全一致,切换时文字不位移 */
    .wzh-chat-session-input {
      display: block; box-sizing: border-box;
      width: calc(100% + 20px); margin: 0 -10px; padding: 5px 10px;
      border: 1px solid var(--mi-brand-blue); border-radius: var(--radius-sm, 8px);
      background: var(--surface-1); color: var(--foreground);
      font: var(--font-weight-bold, 700) 14px/1.4 var(--font-sans); outline: none;
    }
    .wzh-chat-session-input[hidden] { display: none; }
    .wzh-chat-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

    /* 消息区上下边缘做渐隐:内容不再在标题栏/提示语栏边界上被"一刀切",滚动到中段时
       两端各淡出一小截,视觉上比硬边缘柔和。渐隐宽度用 @property 注册成 <length> 才能被
       transition 平滑插值(直接 transition mask-image 不生效);到顶/到底时对应一侧收回 0，
       首屏欢迎语和最后一条消息不会无谓地被压暗。类名由 js/training-chat-panel.js 按滚动位置切换。 */
    @property --wzh-chat-fade-top { syntax: '<length>'; inherits: false; initial-value: 0px; }
    @property --wzh-chat-fade-bottom { syntax: '<length>'; inherits: false; initial-value: 0px; }
    .wzh-chat-messages {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 16px var(--space-3);
      display: flex; flex-direction: column; gap: 16px;
      font-size: 12px; line-height: 1.65; color: var(--foreground-secondary); word-break: break-word;
      overscroll-behavior: contain;       /* 消息区滚到头不再把整页/底层面板带着一起滚 */
      --wzh-chat-fade-top: 0px;
      --wzh-chat-fade-bottom: 0px;
      -webkit-mask-image: linear-gradient(to bottom,
        transparent 0, #000 var(--wzh-chat-fade-top),
        #000 calc(100% - var(--wzh-chat-fade-bottom)), transparent 100%);
      mask-image: linear-gradient(to bottom,
        transparent 0, #000 var(--wzh-chat-fade-top),
        #000 calc(100% - var(--wzh-chat-fade-bottom)), transparent 100%);
      transition: --wzh-chat-fade-top var(--duration-base, 200ms) var(--easing-default, ease),
                  --wzh-chat-fade-bottom var(--duration-base, 200ms) var(--easing-default, ease);
    }
    .wzh-chat-messages.is-fade-top { --wzh-chat-fade-top: 28px; }
    .wzh-chat-messages.is-fade-bottom { --wzh-chat-fade-bottom: 32px; }
    .wzh-chat-welcome {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 24px 0 32px; text-align: center;
    }
    /* Logo + 标题:点阵底纹以这一块的中心铺开,只做氛围,不参与布局。
       原来是一张 src/pic/点阵背景.png,现在改成 canvas 逐点画(见 createWelcomeDots):
       颜色跟着主题走、放大不糊,并且能做两种"闪动"——打开面板/新建对话时从中心扩散一圈波纹、
       鼠标经过时点亮指针周围一片。这两件事 background-image 那版都做不到(整张图只能整体调透明度)。 */
    .wzh-chat-welcome-hero {
      position: relative; width: 100%;
      /* 点阵的颜色与浓度:canvas 在每次重建/换主题时读一次这几个变量(见 readDotStyle)。
         --wzh-dots-hot-rgb 是"被照亮"时偏过去的颜色——亮起来不只是变浓,还会往紫偏一点。
         两个主题共用同一组颜色,暗色只单独提一档 --wzh-dots-alpha(见下面的 data-theme='dark' 规则)。 */
      --wzh-dots-rgb: 99 102 241;
      --wzh-dots-hot-rgb: 123 37 244;
      --wzh-dots-alpha: .08;
    }
    .wzh-chat-welcome-dots {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      /* 与原图 722×776 同比例,底纹在 hero 里的占位跟还原稿保持一致 */
      width: 560px; height: 602px;
      pointer-events: none;   /* 指针事件挂在 hero 上,canvas 自己不拦截下面引导卡的点击 */
      z-index: 0;
    }
    .wzh-chat-welcome-hero > *:not(.wzh-chat-welcome-dots) { position: relative; z-index: 1; }
    .wzh-chat-welcome-logo { display: block; width: 58px; height: 58px; margin: 0 auto 20px; }
    /* 首屏欢迎语(打字机效果的落点,见 playWelcomeTypewriter) */
    .wzh-chat-welcome-text {
      font-size: 24px; font-weight: var(--font-weight-bold, 700);
      line-height: 1.3; color: var(--foreground); min-height: 34px;
    }

    /* 引导卡:属于欢迎屏,发出第一条消息后随 .wzh-chat-welcome 一起移除 */
    .wzh-chat-guide-list {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; box-sizing: border-box; padding: 0 48px;
    }
    .wzh-chat-guide-card {
      display: flex; align-items: center; gap: 12px;
      width: 100%; box-sizing: border-box; padding: 16px;
      text-align: left; cursor: pointer; font-family: inherit;
      border: 1px solid var(--card-neutral-border); border-radius: 12px;
      background: var(--card-neutral-bg);
      transition: background var(--duration-fast) var(--easing-default),
                  border-color var(--duration-fast) var(--easing-default);
    }
    /* 悬浮态:品牌紫→品牌蓝的低透明档(--brand-tint-strong),跟着主题走,不再写死颜色。
       半透明而非实色:卡片本身压在欢迎屏的点阵底纹上,实色会把底纹整块盖掉。
       只对真正能悬停的指针生效——触摸设备上 :hover 会在点完之后一直挂着,
       看起来就像卡在悬浮态回不去默认色。 */
    @media (hover: hover) {
      .wzh-chat-guide-card:hover {
        background: linear-gradient(100deg,
          color-mix(in srgb, var(--brand-purple) var(--brand-tint-strong), transparent) 0%,
          color-mix(in srgb, var(--brand-blue) var(--brand-tint-strong), transparent) 100%);
        border-color: color-mix(in srgb, var(--brand-blue) var(--brand-tint-border), transparent);
      }
    }
    /* 点击后按钮会拿到焦点,显式声明焦点态不改外观,鼠标一移开就回到默认 */
    .wzh-chat-guide-card:focus,
    .wzh-chat-guide-card:focus-visible { outline: none; }
    .wzh-chat-guide-card:active { background: var(--card-neutral-press); }
    .wzh-chat-guide-icon { width: 34px; height: 34px; flex-shrink: 0; display: block; }
    .wzh-chat-guide-text { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .wzh-chat-guide-title { font-size: 15px; font-weight: var(--font-weight-semibold, 600); color: var(--foreground); }
    /* 卡片固定两行:标题一行,标签 + 描述同处第二行,窄了让描述省略而不是换到第三行 */
    .wzh-chat-guide-title,
    .wzh-chat-guide-desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wzh-chat-guide-sub { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; min-width: 0; }
    /* 标签和描述给同一个 line-height,两边文字盒等高,align-items:center 下才真正对齐——
       消息区继承下来的 1.65 会让两者行盒高度不一致,描述看起来偏下。 */
    .wzh-chat-guide-tag {
      display: inline-flex; align-items: center; gap: 2px; flex: 0 0 auto;
      padding: 1px 6px 1px 3px; border-radius: 6px;
      background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint), transparent);
      border: 1px solid color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint-border), transparent);
      font-size: 12px; line-height: 18px; color: var(--foreground); white-space: nowrap;
    }
    .wzh-chat-guide-tag img { width: 14px; height: 14px; display: block; flex: 0 0 auto; }
    .wzh-chat-guide-desc { font-size: 12px; line-height: 18px; color: var(--foreground-secondary); min-width: 0; }
    /* 首屏欢迎语打字机效果的光标(见 typeWelcomeText):打字期间及打完后短暂停留都保持闪烁,
       随后被移除,不常驻。
       欢迎语是居中的,光标只要占哪怕 3px 布局宽度,移除的那一刻整行文字就会向右弹半个光标宽——
       所以这里让 span 本身宽度为 0,竖条交给绝对定位的 ::after 画:它画在文字右侧但不占位,
       出现和消失都不改变行宽,文字自始至终钉在同一个居中位置。 */
    .wzh-chat-typewriter-cursor {
      position: relative;
      display: inline-block;
      width: 0;
      height: 1em;
      vertical-align: -0.15em;
    }
    .wzh-chat-typewriter-cursor::after {
      content: '';
      position: absolute;
      left: 1px; top: 0;
      width: 2px; height: 100%;
      background: var(--primary);
      animation: wzh-chat-typewriter-blink .8s step-end infinite;
    }
    @keyframes wzh-chat-typewriter-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 用户气泡:靠右、有底色，右下角收成小直角当"尖角"，与 shadcn Bubble 的
       end-aligned + 内容自适应宽度(≤ 80%) 用法一致。 */
    .wzh-chat-message.user {
      align-self: flex-end;
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 14px 14px 3px 14px;
      background: color-mix(in srgb, var(--primary) 16%, var(--surface-2));
      color: var(--foreground);
      box-shadow: var(--shadow-sm);
    }
    /* AI 回复:不上底色、也不带头像行(shadcn 的 ghost 变体)——一问一答的结构已经由
       置顶的问题卡片交代清楚,再加一行"头像 + PTO 助手"只是重复信息。 */
    .wzh-chat-message.ai { align-self: stretch; display: flex; flex-direction: column; gap: 6px; }
    .wzh-chat-body-content { padding: 0 8px; }

    .wzh-chat-messages p { margin: 0 0 6px; }
    .wzh-chat-messages p:last-child { margin-bottom: 0; }
    .wzh-chat-messages strong { color: var(--foreground); }
    .wzh-chat-messages ul, .wzh-chat-messages ol { padding-left: 16px; margin: 0 0 6px; }
    .wzh-chat-messages li { margin-bottom: 2px; }
    .wzh-chat-messages code { font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 1px 4px; border-radius: 3px; }
    /* 代码块底色跟着 `code` 标签走主色,只是更淡一档(8% vs 12%):块比行内标签面积大得多,
       同浓度会压过正文 */
    .wzh-chat-messages pre { margin: 0 0 6px; padding: 8px 10px; background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: var(--radius-sm); overflow-x: auto; }
    .wzh-chat-messages pre code { background: none; padding: 0; }
    /* 代码块右上角的复制键:块里多半是能直接贴进终端的命令 / 环境变量,手划容易带上前后空行。
       平时不显形,鼠标进块才淡入——它是"需要时才在"的工具,常驻会和正文抢注意力。
       按钮挂在外层容器而不是 pre 里:pre 横向可滚,挂里面会跟着代码一起滑走。 */
    .wzh-chat-codeblock { position: relative; }
    .wzh-chat-copy {
      position: absolute; top: 5px; right: 5px;
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; padding: 0;
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      background: var(--surface-1); color: var(--foreground-secondary);
      cursor: pointer; opacity: 0;
      transition: opacity var(--duration-fast) var(--easing-default),
                  color var(--duration-fast) var(--easing-default),
                  border-color var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-codeblock:hover .wzh-chat-copy,
    .wzh-chat-copy:focus-visible { opacity: 1; }
    .wzh-chat-copy:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    /* 复制成功的回执:图标换成对勾并暂时常驻,1.6s 后自己退回去(见 boot 里的委托) */
    .wzh-chat-copy.is-done { opacity: 1; color: var(--brand-green); border-color: color-mix(in srgb, var(--brand-green) 45%, transparent); }
    .wzh-chat-copy svg {
      width: 13px; height: 13px;
      fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    /* 触屏没有 hover 这一步,那边直接常驻,否则这颗键永远露不出来 */
    @media (hover: none) { .wzh-chat-copy { opacity: 1; } }
    .wzh-chat-messages h1, .wzh-chat-messages h2, .wzh-chat-messages h3 { font-size: 12px; color: var(--foreground); margin: 0 0 5px; }
    /* 回答里的标题比正文 14px 大:## 是分节点(结论速览 / 行动清单 …),### 是节内的条目标题 */
    .wzh-chat-messages h2 { font-size: 18px; }
    .wzh-chat-messages h3 { font-size: 16px; }
    .wzh-chat-table { width: 100%; border-collapse: collapse; margin: 0 0 8px; font-size: 11px; }
    .wzh-chat-table th, .wzh-chat-table td { border: 1px solid var(--border-default); padding: 4px 6px; text-align: left; vertical-align: top; }
    /* 表头填充和代码块底色同一档(8% 主色):都是"这块是引用来的数据",比中性灰更贴回答的调性 */
    .wzh-chat-table th { background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--foreground-secondary); font-weight: 600; white-space: nowrap; }
    .wzh-chat-table td { color: var(--foreground-secondary); }

    /* 渐变描边:border 本身透明,两层背景一层铺 padding-box(面板底色)、一层铺 border-box(渐变),
       只有 border 那一圈会露出渐变。比 ::before + mask 那套省一个伪元素,圆角也天然跟着 border-radius。 */
    .wzh-chat-input-bar {
      /* 排队卡片收起时要沉到输入框背后,这里必须压在它上面且底不透明(见 .wzh-chat-queue) */
      position: relative; z-index: 2; flex-shrink: 0;
      margin: 0 16px 16px; padding: 8px; box-sizing: border-box;
      /* 描边粗细只在这里改一处:跑马光的外撑量也是按它算的(见 .wzh-chat-input-glow) */
      --wzh-input-border-w: 1.5px;
      border: var(--wzh-input-border-w) solid transparent; border-radius: 24px;
      background:
        linear-gradient(var(--surface-1), var(--surface-1)) padding-box,
        linear-gradient(90deg, var(--mi-brand-blue) 0%, var(--brand-purple) 100%) border-box;
      transition: box-shadow var(--duration-fast) var(--easing-default);
    }
    /* 深色底上这条满色渐变描边太扎眼,压到 60%。用 color-mix 往面板底色里兑而不是直接调 alpha:
       描边所在的 border-box 层背后就是排队卡片(它会沉到输入框背后),透明会把卡片边缘透出来 */
    :root[data-theme='dark'] .wzh-chat-input-bar {
      background:
        linear-gradient(var(--surface-1), var(--surface-1)) padding-box,
        linear-gradient(90deg,
          color-mix(in srgb, var(--mi-brand-blue) 60%, var(--surface-1)) 0%,
          color-mix(in srgb, var(--brand-purple) 60%, var(--surface-1)) 100%) border-box;
    }
    /* 描边已经是满色渐变,聚焦反馈改用一圈很淡的外发光,不再动描边本身 */
    .wzh-chat-input-bar:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--mi-brand-blue) 8%, transparent); }
    /* 回答期间沿描边跑两颗光,思路来自面板打开时那道"双头"跑马光
       (training-monitoring-v2.html 的 .wzh-chat-panel::after),但那边用的是 conic-gradient
       绕中心转 —— 匀的是角速度。面板又高又窄还看得过去,输入栏又宽又扁就露馅了:
       长边中段光头几乎不动,到圆角一下子甩过去,局部线速度能差几十倍。
       所以这里改成 SVG 描边:pathLength=100 把周长归一化,stroke-dashoffset 匀速走 0→-100,
       走的是路径长度,不管框多扁,光头在每一段边上的速度都一样。
       用户一在框里动字就撤掉(见 syncInputFlow):这时注意力该在输入上,不该在描边上。 */
    .wzh-chat-input-glow {
      /* SVG 是替换元素,width/height 为 auto 时不会被 inset 撑开(会退回 300×150 的固有尺寸),
         所以这里必须显式给尺寸。absolute 的 inset 是从 padding box 起算的,往外各撑半个
         border 宽:让 rect 的描边中心线正好落在那圈渐变 border 的正中,光就是贴着描边跑,
         而不是浮在它里侧或外侧。跟着 --wzh-input-border-w 走,改粗细不用再动这里。 */
      position: absolute;
      top: calc(var(--wzh-input-border-w) / -2); left: calc(var(--wzh-input-border-w) / -2);
      width: calc(100% + var(--wzh-input-border-w)); height: calc(100% + var(--wzh-input-border-w));
      display: block; overflow: visible; /* 描边有一半在 rect 外沿,别被 svg 视口裁掉 */
      pointer-events: none; opacity: 0;
      transition: opacity var(--duration-base) var(--easing-default);
    }
    .wzh-chat-input-glow rect { fill: none; stroke: #FFF; stroke-linecap: round; }
    /* 两层叠出光晕:宽而暗的一层做外扩的晕,窄而亮的一层做芯。
       dasharray 的周期都是 50(= 周长的一半),所以一圈上正好两颗、相隔 180°。
       晕比芯长(22 vs 10),core 再用负 delay 往前挪 6%,芯就居中嵌在晕里,两头自然收细。 */
    .wzh-chat-input-glow-halo { stroke-width: 5; opacity: .09; stroke-dasharray: 22 28; }
    .wzh-chat-input-glow-core { stroke-width: 1.6; opacity: .44; stroke-dasharray: 10 40; }
    .wzh-chat-input-bar.is-flowing .wzh-chat-input-glow { opacity: 1; }
    /* linear 而不是 ease:跑马灯要匀速,缓动会让它在每圈起点一顿 */
    .wzh-chat-input-bar.is-flowing .wzh-chat-input-glow rect {
      animation: wzh-chat-input-glow-run 2.1s linear infinite;
    }
    .wzh-chat-input-bar.is-flowing .wzh-chat-input-glow-core { animation-delay: -.126s; } /* 2.1s 的 6% */
    /* 深色底上白光跳得厉害:同样的亮度,和深底的反差是浅底的好几倍,原来那档(.8)看着发突。
       压到 .24 让它退回"余光里察觉得到"的程度——这道光只是回答期间的状态提示,不是主角。 */
    :root[data-theme='dark'] .wzh-chat-input-bar.is-flowing .wzh-chat-input-glow { opacity: .24; }
    @keyframes wzh-chat-input-glow-run {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -100; } /* 负值 = 顺着 rect 的路径方向,也就是顺时针 */
    }
    @media (prefers-reduced-motion: reduce) {
      .wzh-chat-input-bar.is-flowing .wzh-chat-input-glow { opacity: 0; }
      .wzh-chat-input-bar.is-flowing .wzh-chat-input-glow rect { animation: none; }
    }
    /* 输入栏自身是个层叠上下文(z-index:2),里面弹层的 z-index 再大也只在这一层内部排序,
       出了这层还是被 .wzh-chat-jump-wrap(z-index:4)的「回到底部」盖住。所以弹层打开时
       把整条输入栏抬到 4 以上,关掉再落回来——常态下仍让「回到底部」浮在输入栏上方。 */
    .wzh-chat-input-bar.is-pop-open { z-index: 6; }
    /* 输入区高度由内容撑,到 6 行(14px × 1.5 = 21px/行)封顶后内部滚动,见 autoResizeInput */
    .wzh-chat-input-wrap { position: relative; width: calc(100% - 4px); margin: 0; }
    .wzh-chat-input {
      display: block; width: calc(100% - 8px); box-sizing: border-box;
      background: transparent; border: none; border-radius: 0;
      margin: 0 0 0 8px; padding: 0;
      color: transparent; caret-color: var(--foreground);
      font-size: 14px; font-family: var(--font-sans); resize: none;
      min-height: 44px; max-height: 126px; overflow-y: auto; line-height: 1.5;
    }
    .wzh-chat-input:focus { outline: none; }
    /* 满 6 行后 textarea 内部滚动:不能让滚动条占宽,否则它一出现文字可用宽度就变了,
       高亮层还按原宽换行,两层立刻错位。 */
    .wzh-chat-input { scrollbar-width: none; }
    .wzh-chat-input::-webkit-scrollbar { width: 0; height: 0; }
    /* 高亮层:与 textarea 同样的字体度量、同样的换行规则,逐字对齐地盖在上面。
       只画字,不接事件——点击、选中、光标全部还是 textarea 在处理。 */
    /* 高亮层左侧跟随 textarea 的 8px 外边距；inset 的 right:-4px 表示向右外扩 4px，
       避免行尾的 .wzh-chat-input-chip 负 margin 被 overflow:hidden 削掉一条。 */
    .wzh-chat-input-hl {
      position: absolute; inset: 0 -4px 0 4px; overflow: hidden; pointer-events: none;
      padding: 0 4px; margin: 0; border: none;
      font-size: 14px; font-family: var(--font-sans); line-height: 1.5;
      color: var(--foreground);
      white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;
    }
    /* # 上下文与 / 指令标签:高亮层要和 textarea 逐字对齐,所以标签"净宽"必须等于文字本身的宽度——
       横向 4px 内边距用同样大小的负 margin 抵消,底色向两侧各溢出 4px 但一点布局宽度都不占,
       光标不会越往后错得越多。溢出压住的那段、以及标签外面剩下的留白,全部来自真实的空格
       字符(见 CHIP_GAP / autoSpaceBeforeHash / 引导卡填充):14px 字号下一个空格约 3.9px,
       三个空格 ≈ 11.7px,减掉压上去的 4px,外间距还剩 ~8px。 */
    .wzh-chat-input-chip {
      padding: 1px 4px; margin: 0 -4px; border-radius: 4px;
      background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint-strong), transparent);
      color: var(--mi-brand-blue);
    }
    /* ── 输入 # 弹出的上下文选择框(见 initCtxPicker) ─────────────────────────
       浮在输入框正上方,左边是性能落盘数据的文件名,右边是它在采集目录里的路径;
       # 后面继续敲字就实时筛选,文件名和路径都参与匹配。 */
    .wzh-chat-ctx-pop {
      /* left/right 贴着 .wzh-chat-input-bar 的 padding box:宽度跟输入区一致,不会比输入框宽 */
      position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 20;
      display: none; box-sizing: border-box; padding: 4px;
      max-height: 268px; overflow-y: auto; overscroll-behavior: contain;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--wzh-chat-shadow);
    }
    .wzh-chat-ctx-pop.is-open { display: block; }
    .wzh-chat-ctx-pop::-webkit-scrollbar { width: 6px; }
    .wzh-chat-ctx-pop::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
    /* 两栏定宽:对象名占 2/5、路径占 3/5,名字长短不同的条目之间路径也能对齐成一列 */
    .wzh-chat-ctx-item {
      display: grid; grid-template-columns: 2fr 3fr; align-items: center; gap: 12px;
      width: 100%; box-sizing: border-box;
      padding: 8px 12px; border: none; border-radius: var(--radius-md);
      background: none; cursor: pointer; text-align: left;
      font-family: var(--font-sans); font-size: 13px; line-height: 1.4;
    }
    .wzh-chat-ctx-item:focus, .wzh-chat-ctx-item:focus-visible { outline: none; }
    /* 键盘选中和鼠标悬停共用同一种高亮,避免两个"当前项"同时亮着 */
    .wzh-chat-ctx-item.is-active { background: var(--surface-3); }
    /* 对象名中间省略:主干部分正常 ellipsis 截断,后缀单独一段不参与收缩,
       名字再长也一定看得到 .db / .csv / .json 这些格式后缀 */
    .wzh-chat-ctx-name { display: flex; min-width: 0; color: var(--foreground); }
    .wzh-chat-ctx-name-stem {
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .wzh-chat-ctx-name-ext { flex: 0 0 auto; white-space: nowrap; }
    .wzh-chat-ctx-path {
      min-width: 0; text-align: right;
      color: var(--foreground-muted); font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .wzh-chat-ctx-item mark { background: none; color: var(--mi-brand-blue); font-weight: 600; }
    .wzh-chat-ctx-empty { padding: 10px 12px; font-size: 12px; color: var(--foreground-muted); }
    /* / 指令只有一列,其余悬浮、选中和匹配高亮样式完全复用 # 上下文选择框 */
    .wzh-chat-command-item { grid-template-columns: 1fr; }

    /* 回答期间输入框置灰(见 setChatBusy),答完立刻恢复并自动拿回焦点 */
    .wzh-chat-input:disabled { opacity: .5; cursor: not-allowed; }
    .wzh-chat-input::placeholder { color: var(--foreground-placeholder); }

    /* 工具栏:Agent / 模型 在左,语音 + 发送在右 */
    .wzh-chat-composer-toolbar { display: flex; align-items: center; gap: 0; }
    .wzh-chat-tool {
      box-sizing: border-box; height: 32px;
      display: inline-flex; align-items: center; gap: 6px; padding: 0 10px;
      border: none; border-radius: 999px; background: transparent; cursor: pointer;
      font: 12px/1.4 var(--font-sans); color: var(--foreground);
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-tool:hover,
    .wzh-chat-tool:focus-visible,
    .wzh-chat-tool[aria-expanded='true'] {
      outline: none;
      background: var(--state-hover);
    }
    .wzh-chat-tool img { width: 16px; height: 16px; display: block; }

    /* ── 切换模型弹层(见 initModelSwitch) ──────────────────────────────
       跟切换 Agent 那个弹层长一样,只是从按钮往上开(输入框贴着面板底,往下没地方),
       标题/列表/对勾直接复用 .wzh-chat-agent-pop-title / -list / -item / -check。 */
    .wzh-chat-model-wrap { position: relative; display: inline-flex; }
    .wzh-chat-model-pop {
      position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 30;
      box-sizing: border-box; min-width: 220px; padding: 8px;
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--wzh-chat-shadow);
    }
    .wzh-chat-model-pop[hidden] { display: none; }
    /* 弹层里的型号条没有图标,名字直接顶格起(.wzh-chat-agent-item 的 gap 只作用在名字与对勾之间) */
    .wzh-chat-model-pop .wzh-chat-agent-item { font-size: 13px; }

    /* ── 「已切换模型」波浪线标记(还原稿 src/pic/思考完成-过程收起.png 下方那道) ──
       切完模型立刻插到当前对话末尾,把"这条线以上是旧模型答的、以下是新模型"划开;
       还停在欢迎屏(没有任何对话)时先攒着,等第一个问题落地再插到问题卡片前面。
       波浪不是背景图而是 mask + currentColor,这样深浅色主题各自跟着文字色走。 */
    .wzh-chat-switch-note {
      align-self: stretch; display: flex; align-items: center; gap: 10px;
      color: var(--foreground-muted); font-size: 12px; user-select: none;
    }
    .wzh-chat-switch-note-text { flex: 0 0 auto; white-space: nowrap; }
    .wzh-chat-switch-note-wave {
      flex: 1 1 0; min-width: 16px; height: 8px;
      background: currentColor; opacity: .55;
      -webkit-mask-image: var(--wzh-wave); mask-image: var(--wzh-wave);
      -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
      -webkit-mask-size: 16px 8px; mask-size: 16px 8px;
      -webkit-mask-position: center; mask-position: center;
      --wzh-wave: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='8' viewBox='0 0 16 8'><path d='M0 4 Q 4 0.9 8 4 T 16 4' fill='none' stroke='%23000' stroke-width='1.2' stroke-linecap='round'/></svg>");
    }
    .wzh-chat-composer-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .wzh-chat-clean-btn {
      width: 24px; height: 24px; margin-right: 4px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer;
    }
    .wzh-chat-clean-btn[hidden], .wzh-chat-clean-divider[hidden] { display: none; }
    /* 面型 SVG 通过 mask 吃 current theme 的一级文字色,默认浓度为 30%。 */
    .wzh-chat-clean-icon {
      width: 18px; height: 18px; display: block;
      background: color-mix(in srgb, var(--foreground) 30%, transparent);
      -webkit-mask: url('src/pic/icon/clean.svg') center / contain no-repeat;
      mask: url('src/pic/icon/clean.svg') center / contain no-repeat;
    }
    .wzh-chat-clean-divider {
      width: 1px; height: 16px; flex: 0 0 1px;
      background: var(--border-default);
    }
    .wzh-chat-mic-btn {
      width: 32px; height: 32px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 999px; background: transparent; cursor: pointer;
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-mic-btn:hover,
    .wzh-chat-mic-btn:focus-visible {
      outline: none;
      background: var(--state-hover);
    }
    .wzh-chat-mic-btn img { width: 18px; height: 18px; display: block; }
    .wzh-chat-send-btn {
      position: relative; overflow: hidden; isolation: isolate;
      width: 32px; height: 32px; padding: 0; border-radius: 50%;
      background: var(--mi-brand-blue); border: none; color: var(--primary-foreground);
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-send-btn:hover { background: color-mix(in srgb, var(--mi-brand-blue) 84%, #000); }
    /* 空输入(或回答中)时按钮置为浅蓝不可点,输入文字后立刻亮成品牌蓝(见 syncSendState) */
    .wzh-chat-send-btn:disabled { background: var(--brand-blue-disabled); opacity: 1; cursor: default; }
    /* sent.svg 是黑色描边,反相成白色箭头 */
    .wzh-chat-send-btn img {
      position: relative; z-index: 2;
      width: 16px; height: 16px; display: block; filter: brightness(0) invert(1);
    }
    /* 发送按下动效：72px 的渐变填充从真实按下位置向外铺满 32px 圆钮。
       波纹单独盖在按钮底色上，因此发送后按钮立刻切成「停止回答」态也不会截断这一下反馈。 */
    .wzh-chat-send-btn::after {
      content: ''; position: absolute; z-index: 1; pointer-events: none;
      left: var(--wzh-send-press-x, 50%); top: var(--wzh-send-press-y, 50%);
      width: 72px; height: 72px; border-radius: 50%; opacity: 0;
      background: radial-gradient(circle,
        rgba(91, 132, 242, .42) 0%,
        rgba(83, 151, 239, .32) 26%,
        rgba(102, 104, 225, .24) 54%,
        rgba(67, 105, 239, .08) 70%,
        rgba(67, 105, 239, 0) 78%);
      transform: translate(-50%, -50%) scale(.04);
    }
    .wzh-chat-send-btn.is-press-fx { animation: wzh-chat-send-press 320ms var(--easing-default) both; }
    .wzh-chat-send-btn.is-press-fx::after { animation: wzh-chat-send-fill 400ms ease-out both; }
    @keyframes wzh-chat-send-press {
      0% { transform: scale(1); }
      28% { transform: scale(.96); }
      100% { transform: scale(1); }
    }
    @keyframes wzh-chat-send-fill {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.04); }
      12% { opacity: .58; }
      72% { opacity: .36; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wzh-chat-send-btn.is-press-fx { animation: none; }
      .wzh-chat-send-btn.is-press-fx::after { animation: none; }
    }
    /* 「停止回答」态:回答中且输入框为空时,发送键换成灰底停止键(见 syncSendState)。
       stop.svg 本身是深色描边,这里不做反相 */
    .wzh-chat-send-btn.is-stop { background: color-mix(in srgb, var(--foreground) 9%, transparent); }
    .wzh-chat-send-btn.is-stop:hover { background: color-mix(in srgb, var(--foreground) 16%, transparent); }
    .wzh-chat-send-btn.is-stop img { filter: none; }

    /* 用户按下停止键后,在这一轮正文尾部补一行说明,避免半截回答看着像是出错了 */
    .wzh-chat-stopped { margin-top: 8px; font: 12px/1.5 var(--font-sans); color: var(--foreground-muted); }

    .wzh-chat-typing { display: inline-flex; align-items: center; gap: 4px; padding: 3px 0; }
    .wzh-chat-typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--foreground-muted); opacity: .4; animation: wzh-chat-typing-blink 1.2s infinite ease-in-out both; }
    .wzh-chat-typing span:nth-child(2) { animation-delay: .18s; }
    .wzh-chat-typing span:nth-child(3) { animation-delay: .36s; }
    @keyframes wzh-chat-typing-blink {
      0%, 80%, 100% { opacity: .25; transform: scale(.85); }
      40% { opacity: .9; transform: scale(1); }
    }

    /* 输入框锚定当前训练任务:与发送按钮同一行,贴左显示"任务图标 + 任务名",
       提示用户提问时无需再报任务名,AI 已按此上下文作答。纯展示,不接收点击。 */
    /* 取消锚定后整条 chip 移除,输入框跟着少一行(它是输入区的第一个流内元素) */
    .wzh-chat-anchor-chip[hidden] { display: none; }
    .wzh-chat-anchor-chip {
      /* relative:关闭键绝对定位到右端,靠这一层定位 */
      position: relative; margin: 4px 0 8px 4px;
      display: inline-flex; align-items: center; gap: 4px;
      max-width: 100%; overflow: hidden;
      padding: 3px 8px; border: 1px dashed var(--border-strong); border-radius: 8px;
      background: transparent;
      color: var(--foreground); font-size: 12px; font-weight: 400;
    }
    .wzh-chat-anchor-chip img {
      width: 12px; height: 12px; flex-shrink: 0; display: block;
    }
    .wzh-chat-anchor-chip span {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: -webkit-mask-image var(--duration-fast) var(--easing-default);
    }
    /* 关闭键平时不占位也不显示,鼠标移到 chip 上才浮出来,压在任务名末尾那几个字上。
       用绝对定位而不是 display:none ↔ inline-flex:后者一出现就把任务名挤窄一截,文字会跳。
       被压住的那截文字用 mask 渐隐掉,不给按钮垫不透明底色—— glass 主题下 surface 全是半透的,
       任何底色都遮不干净,反倒会透出一层脏边。 */
    .wzh-chat-anchor-close {
      position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
      /* 尺寸比照头部 .wzh-chat-head-btn(20px 图标 / 28px 命中区)等比缩到 chip 尺度:
         原来 10px 的图标把 20 号视口的描边压到了半像素,抗锯齿一糊就显得比头部那颗淡一截 */
      width: 20px; height: 20px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer; border-radius: 3px;
      opacity: 0; pointer-events: none;
      transition: opacity var(--duration-fast) var(--easing-default),
                  background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-anchor-chip:hover .wzh-chat-anchor-close,
    .wzh-chat-anchor-close:focus-visible { opacity: 1; pointer-events: auto; }
    /* 关闭键浮出时,任务名末尾跟着渐隐,给它让出位置 */
    .wzh-chat-anchor-chip:hover span,
    .wzh-chat-anchor-chip:focus-within span {
      /* 渐变在按钮左边缘就走完:最后 18px(关闭键实际占的那一段)是纯透明的硬段,
         不让渐变斜跨在按钮底下——那样按钮中间还压着半透的字,看着发脏 */
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent calc(100% - 18px));
      mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent calc(100% - 18px));
    }
    .wzh-chat-anchor-close:hover { background: var(--state-hover); }
    .wzh-chat-anchor-close img { width: 16px; height: 16px; display: block; }

    /* ── 排队消息 ───────────────────────────────────────────────────────
       回答期间不再拦截输入:继续敲的问题排进这里,当前这条答完自动接上一条
       (见 enqueueChatMessage / flushChatQueue)。左上角箭头收起后只留标题那一行,
       箭头方向与思考过程的折叠条同一套写法(展开朝下、收起朝右)。 */
    /* 收起动效分三层做:
         .wzh-chat-queue      —— 外层槽位,只负责占位;收起时把下外边距压成负值,
                                 输入框(z-index 更高、底不透明)就会往上盖住卡片下半截;
         .wzh-chat-queue-card —— 卡片本体。收起时左右各内收 16px(比输入框窄一圈)、底色转灰、
                                 描边隐去、底部内边距加厚,加上沿 z 轴后退一档的位移,
                                 读起来就是整块垫到输入框背后、只在上方露出一截;
         .wzh-chat-queue-listwrap —— 列表的可伸缩容器,高度用 grid-template-rows 1fr→0fr 收掉,
                                 列表本身同时向下位移并淡出。 */
    .wzh-chat-queue[hidden] { display: none; }
    .wzh-chat-queue {
      flex: none; margin: 0 16px 8px; position: relative; z-index: 1;
      transition: margin-bottom var(--duration-slow) var(--easing-default);
    }
    /* 负的下外边距 = 输入框往上压 22px,正好吃掉卡片下半截(8px 原间距 + 14px 重叠) */
    .wzh-chat-queue.is-collapsed { margin-bottom: -14px; }
    .wzh-chat-queue-card {
      box-sizing: border-box; margin: 0; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
      border: 1px solid var(--border-subtle); border-radius: 14px;
      background: var(--surface-1);
      transform-origin: 50% 100%;
      transition: margin var(--duration-slow) var(--easing-default),
                  padding var(--duration-slow) var(--easing-default),
                  gap var(--duration-slow) var(--easing-default),
                  background var(--duration-slow) var(--easing-default),
                  border-color var(--duration-slow) var(--easing-default);
    }
    /* 收起终态:比输入框窄一圈的灰色卡片,下半截垫在输入框背后。
       底部内边距特意加厚——被盖掉的那一截要够厚,露出来的才是"一截卡片"而不是"一条边"。
       文字颜色不变,收起前后读起来是同一块内容。 */
    .wzh-chat-queue.is-collapsed .wzh-chat-queue-card {
      margin: 0 16px; padding: 13px 16px 24px; gap: 0;
      /* 浅色主题使用黑色 3%→8% 的纵向渐变；描边沿用中性卡片 token。 */
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, .03),
        rgba(0, 0, 0, .08)
      );
      border-color: var(--card-neutral-border);
    }
    /* 深色主题用等透明度的白色渐变，保持相同层次而不压黑背景。 */
    :root[data-theme='dark'] .wzh-chat-queue.is-collapsed .wzh-chat-queue-card {
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, .03),
        rgba(255, 255, 255, .08)
      );
    }
    /* 每次展开/收起都放一次 z 轴位移:先退到后面、往下坠一点,再回到本位。
       终态是 identity,所以头部文字最后仍是正常大小,不会停在缩小状态。 */
    .wzh-chat-queue.is-zshift .wzh-chat-queue-card { animation: wzh-queue-zshift 380ms var(--easing-default) both; }
    @keyframes wzh-queue-zshift {
      0%   { transform: perspective(700px) translate3d(0, 0, 0); }
      45%  { transform: perspective(700px) translate3d(0, 8px, -48px); }
      100% { transform: perspective(700px) translate3d(0, 0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wzh-chat-queue.is-zshift .wzh-chat-queue-card { animation: none; }
      .wzh-chat-queue, .wzh-chat-queue-listwrap,
      .wzh-chat-queue-list, .wzh-chat-queue-card { transition: none; }
    }
    .wzh-chat-queue-listwrap {
      display: grid; grid-template-rows: 1fr; min-height: 0; overflow: hidden;
      transition: grid-template-rows var(--duration-slow) var(--easing-default);
    }
    .wzh-chat-queue.is-collapsed .wzh-chat-queue-listwrap { grid-template-rows: 0fr; }
    .wzh-chat-queue-head { display: flex; align-items: center; gap: 8px; }
    .wzh-chat-queue-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0; border: none; background: none; cursor: pointer;
      font: inherit; color: var(--foreground);
    }
    .wzh-chat-queue-toggle svg {
      width: 15px; height: 15px; flex-shrink: 0;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      transform: rotate(90deg);
      transition: transform var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-queue.is-collapsed .wzh-chat-queue-toggle svg { transform: rotate(0); }
    .wzh-chat-queue-title { font-size: 14px; }
    .wzh-chat-queue-clear {
      margin-left: auto; padding: 0; border: none; background: none; cursor: pointer;
      font: 13px/1.4 var(--font-sans); color: var(--foreground-muted);
    }
    .wzh-chat-queue-clear:hover { color: var(--foreground); }
    /* 排到 4 条以上时列表自己滚,不把输入框往下挤 */
    .wzh-chat-queue-list {
      list-style: none; margin: 0; padding: 0; min-height: 0;
      /* 不跟着 0fr 的行一起被压扁:保住自身高度,才谈得上向下滑出去被裁掉 */
      align-self: start;
      display: flex; flex-direction: column;
      max-height: 132px; overflow-y: auto;
      transition: transform var(--duration-slow) var(--easing-default),
                  opacity var(--duration-base) var(--easing-default);
    }
    /* 收起时列表往下走 + 淡出,配合上面的高度收拢,读起来是"沉下去"而不是"缩没了" */
    .wzh-chat-queue.is-collapsed .wzh-chat-queue-list {
      transform: translateY(12px); opacity: 0; overflow: hidden;
    }
    /* 圆点与折叠箭头同宽同居中、文案与标题同一条左边线:
       箭头 15px + gap 6px,这里的圆点也占满 15px 的位置(真正的点画在 ::before 上),
       两行的第二列就自然落在同一个 x 上。 */
    .wzh-chat-queue-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 0; min-width: 0;
    }
    .wzh-chat-queue-dot {
      width: 15px; height: 15px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .wzh-chat-queue-dot::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: color-mix(in srgb, var(--foreground-muted) 70%, transparent);
    }
    .wzh-chat-queue-text {
      flex: 1; min-width: 0;
      font-size: 14px; color: var(--foreground);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 队列消息里的 # 引用复用输入框蓝色标签；输入框为光标逐字对齐使用了负 margin，
       队列是普通文本流，不需要抵消宽度，因此在这里恢复为正常的行内胶囊。 */
    .wzh-chat-queue-text .wzh-chat-input-chip {
      display: inline; margin: 0 2px; padding: 1px 4px;
      white-space: nowrap; font-weight: 500;
    }
    .wzh-chat-queue-del {
      width: 20px; height: 20px; flex-shrink: 0; padding: 0; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer; color: var(--foreground-muted);
      transition: background var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-queue-del:hover { background: var(--state-hover); color: var(--foreground); }
    .wzh-chat-queue-del svg {
      width: 12px; height: 12px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round;
    }


    /* ══════════════════════════════════════════════════════════════════════
       问题卡片 + 思考过程
       —— 一轮问答的视觉结构:置顶的问题卡片(锚点 + 提问原文,超长自动折叠)、
          下面是思考过程(thinking / usetool 两类节点,带整体与单节点计时),
          正式回答开始时思考过程自动收起成一行"思考完成 2m36s ›"。
       ══════════════════════════════════════════════════════════════════════ */

    /* ── 问题卡片:置顶 ──────────────────────────────────────────────────
       当前这一轮的提问不再走右对齐小气泡,而是钉在消息区顶部的整宽卡片——
       思考过程动辄几屏,用户往下翻时仍然要能一眼看到"我问的是什么"。
       只有最后一张卡片带 .is-pinned(sticky),历史轮次的卡片正常随流滚走,
       否则多轮之后会有好几张卡片叠在顶部互相盖住。 */
    .wzh-chat-qcard {
      align-self: stretch;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint), var(--surface-1));
      color: var(--foreground);
      display: grid;
      /* 折叠列默认 0 宽:三行以内的短问题根本不会出现箭头,没必要给它留一条空白 */
      grid-template-columns: 0 1fr;
      column-gap: 0;
      row-gap: 8px;
    }
    /* 夹住之后整张卡片就是折叠开关,给手型提示(正文照样能划词选中) */
    .wzh-chat-qcard.is-clampable {
      cursor: pointer;
      padding-left: 10px;
      grid-template-columns: 20px 1fr;
      column-gap: 4px;
    }
    .wzh-chat-qcard.is-pinned { position: sticky; top: 0; z-index: 3; }
    /* 真正贴住顶沿时(.is-stuck 由 updateChatFade 按位置切换)才在下沿铺一道渐隐,
       否则卡片还跟着内容滚的时候,这道遮罩会变成一条没来由的分割线。 */
    .wzh-chat-qcard.is-pinned::after {
      content: ''; position: absolute; left: -12px; right: -12px; top: 100%; height: 28px;
      background: linear-gradient(to bottom,
        var(--surface-1) 0%,
        color-mix(in srgb, var(--surface-1) 55%, transparent) 55%,
        transparent 100%);
      opacity: 0; pointer-events: none;
      transition: opacity var(--duration-base) var(--easing-default);
    }
    .wzh-chat-qcard.is-pinned.is-stuck::after { opacity: 1; }
    /* sticky 之后,下方内容会从卡片上沿的内边距区里穿过去;补一块与面板同色的挡板把它遮住 */
    .wzh-chat-qcard.is-pinned::before {
      content: ''; position: absolute; left: -12px; right: -12px; bottom: 100%; height: 16px;
      background: var(--surface-1);
    }
    :root[data-theme='dark'] .wzh-chat-qcard {
      background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint), var(--surface-2));
    }
    /* 折叠箭头:内容没超过 3 行时整个按钮不渲染(JS 量到溢出才加 .is-clampable) */
    .wzh-chat-qcard-toggle {
      grid-column: 1; grid-row: 1;
      width: 20px; height: 20px; padding: 0;
      display: none; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer;
      color: var(--foreground-secondary);
    }
    .wzh-chat-qcard.is-clampable .wzh-chat-qcard-toggle { display: inline-flex; }
    .wzh-chat-qcard-toggle svg {
      width: 14px; height: 14px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      transform: rotate(90deg); /* 展开态:朝下 */
      transition: transform var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-qcard.is-collapsed .wzh-chat-qcard-toggle svg { transform: rotate(0); } /* 收起态:朝右 */
    /* 锚点行:与输入框里的锚点 chip 同款,提示这轮提问挂在哪个任务/目录下 */
    .wzh-chat-qcard-anchor {
      grid-column: 2; grid-row: 1;
      display: inline-flex; align-items: center; gap: 5px; align-self: center;
      max-width: 100%; overflow: hidden;
      padding: 2px 8px; border-radius: 6px;
      background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint-strong), transparent);
      color: var(--foreground); font-size: 12px; line-height: 18px;
      justify-self: start;
    }
    .wzh-chat-qcard-anchor img { width: 12px; height: 12px; flex-shrink: 0; display: block; }
    .wzh-chat-qcard-anchor span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 提问正文:默认最多 3 行(锚点行不算),超出的部分折叠 */
    .wzh-chat-qcard-text {
      grid-column: 2; grid-row: 2;
      font-size: 14px; line-height: 1.6; color: var(--foreground);
    }
    .wzh-chat-qcard.is-collapsed .wzh-chat-qcard-text {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
      overflow: hidden;
    }
    /* 提问里被 # 引用的上下文(泳道 / 算子名等) */
    .wzh-chat-qref {
      display: inline-block; white-space: nowrap; /* 标签整块换行,不在标签内部断开 */
      padding: 1px 5px; border-radius: 5px;
      background: color-mix(in srgb, var(--mi-brand-blue) var(--brand-tint-strong), transparent);
      color: var(--mi-brand-blue); font-size: 12.5px;
    }

    /* ── 思考过程 ─────────────────────────────────────────────────────── */
    .wzh-chat-think { align-self: stretch; display: flex; flex-direction: column; }
    /* 折叠条:只有思考结束后才出现("思考完成 2m36s ›")。思考进行中不显示——
       进行中的整体计时挂在最后一个节点的标题上,不必再顶一行重复的总时长。 */
    .wzh-chat-think-head {
      display: none; align-items: center; gap: 6px;
      padding: 0; border: none; background: none; cursor: pointer;
      font: inherit; color: var(--foreground-muted);
      align-self: flex-start;
    }
    .wzh-chat-think-head { display: inline-flex; }
    .wzh-chat-think-head-label,
    .wzh-chat-think-head-time { font-size: 14px; }
    .wzh-chat-think-head-time { font-variant-numeric: tabular-nums; }
    .wzh-chat-think-head svg {
      width: 15px; height: 15px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      transform: rotate(90deg);
      transition: transform var(--duration-fast) var(--easing-default);
    }
    .wzh-chat-think.is-collapsed .wzh-chat-think-head svg { transform: rotate(0); }
    /* 收起之后这一行就是思考过程在版面上的全部,下面直接接正式回答 */
    .wzh-chat-think.is-done.is-collapsed { margin-bottom: 12px; }
    .wzh-chat-think.is-collapsed .wzh-chat-think-body { display: none; }


    /* 左侧竖轨:一条贯穿所有节点的细线,节点圆点压在线上 */
    .wzh-chat-think-body {
      position: relative;
      padding-left: 18px;
      margin-top: 10px;    /* 与上面常驻的折叠条隔开 */
      margin-bottom: 16px; /* 与下面的正式回答留出一档间距 */
      display: flex; flex-direction: column; gap: 16px;
    }
    .wzh-chat-think-body::before {
      content: ''; position: absolute; left: 3.5px; top: 5px; bottom: 5px;
      width: 1px; background: var(--border-default);
    }
    .wzh-chat-think-node { position: relative; }
    /* 圆点只表达进度状态:进行中是蓝色,这一步跑完转成绿色。
       节点是 thinking 还是 usetool 由标题交代,不再另外用颜色区分。 */
    .wzh-chat-think-dot {
      position: absolute; left: -18px; top: 5px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand-green);
      transition: background var(--duration-base) var(--easing-default);
    }
    /* 呼吸是圆点本身在缩放,背后不叠浅色光环——光环在这条细竖轨上太抢眼 */
    .wzh-chat-think-node.is-running .wzh-chat-think-dot {
      background: var(--mi-brand-blue);
      animation: wzh-chat-dot-breathe 1.5s ease-in-out infinite;
    }
    @keyframes wzh-chat-dot-breathe {
      0%, 100% { transform: scale(.91); }
      50%      { transform: scale(1.175); }
    }
    /* 节点标题保持正文色——思考正文压浅,标题不压 */
    .wzh-chat-think-node-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .wzh-chat-think-node-title { font-size: 12px; color: var(--foreground); }
    /* 进行中的标题:一道白色流光从左扫到右。用 background-clip:text 把渐变裁进字形里,
       比给整行加背景干净;--wzh-shine 在浅色主题下取"接近白"而不是纯白,避免扫过时
       文字整段消失看着像闪烁故障。
       渐变只留首尾两段本色 + 中间一个高光点,中间全靠线性插值过渡——分段越少、
       跨度越长,过色越柔;背景放到 300% 宽,亮带比字宽还大,扫过时整行都被带亮一次。 */
    .wzh-chat-think-node.is-running .wzh-chat-think-node-title {
      --wzh-shine: color-mix(in srgb, var(--foreground) 10%, #fff);
      background-image: linear-gradient(100deg,
        var(--foreground) 0%,
        var(--foreground) 10%,
        var(--wzh-shine) 50%,
        var(--foreground) 90%,
        var(--foreground) 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
      animation: wzh-chat-title-shine 1.2s linear infinite;
    }
    :root[data-theme='dark'] .wzh-chat-think-node.is-running .wzh-chat-think-node-title { --wzh-shine: #fff; }
    @keyframes wzh-chat-title-shine {
      from { background-position: 150% 0; }
      to   { background-position: -50% 0; }
    }
    .wzh-chat-think-node-time { font-size: 12px; color: var(--foreground-muted); font-variant-numeric: tabular-nums; }
    /* 思考正文:比正式回答(--foreground-secondary)再浅一档 */
    .wzh-chat-think-node-text {
      font-size: 12px; line-height: 1.7; color: var(--foreground-muted);
      word-break: break-word;
    }
    .wzh-chat-think-node-text p { margin: 0 0 4px; color: inherit; }
    .wzh-chat-think-node-text p:last-child { margin-bottom: 0; }
    .wzh-chat-think-node-text strong { color: var(--foreground-secondary); }
    .wzh-chat-think-node-text code {
