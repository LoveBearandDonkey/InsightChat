  <script>
    /* 三套主题皮肤,数组顺序即右上角按钮的切换顺序,第一项就是默认主题:
       计算(浅) → 新无限(浅) → 追光(深) → 回到计算。
       mode 决定明暗基座(data-theme),brand 决定品牌色皮肤(data-brand)。 */
    window.MI_THEMES = [
      { id: 'calc',     label: '计算',   mode: 'light', brand: 'calc' },
      { id: 'infinite', label: '新无限', mode: 'light', brand: ''     },
      { id: 'chase',    label: '追光',   mode: 'dark',  brand: ''     },
    ];
    // 主题深链:?theme=calc|infinite|chase,兼容旧写法 ?theme=light|dark。
    // 旧的 light 指向当前的默认浅色主题(计算),要 新无限 得显式写 ?theme=infinite。
    (() => {
      const raw = new URLSearchParams(window.location.search).get("theme");
      const alias = { light: 'calc', dark: 'chase' };
      const id = alias[raw] || raw;
      const t = window.MI_THEMES.find(x => x.id === id);
      if (!t) return;
      const el = document.documentElement;
      el.dataset.themeId = t.id;
      el.dataset.theme = t.mode;
      if (t.brand) el.dataset.brand = t.brand; else delete el.dataset.brand;
    })();
  </script>

            <!-- 输入 / 弹出的指令选择框,交互与 # 上下文选择框一致 -->
            <div class="wzh-chat-ctx-pop" id="trainChatCommandPop" role="listbox" aria-label="选择指令"></div>
            <div class="wzh-chat-composer-toolbar">
              <!-- 模式选择:交互与模型选择一致,默认 Build,可切换为 Plan -->
              <div class="wzh-chat-model-wrap">
                <button class="wzh-chat-tool" id="trainChatModeBtn" type="button" title="切换模式（当前 Build）"
                        aria-haspopup="listbox" aria-expanded="false">
                  <img src="../../src/pic/icon/Agent.svg" alt=""><span id="trainChatModeName">Build</span>
                </button>
                <div class="wzh-chat-model-pop" id="trainChatModePop" hidden>
                  <p class="wzh-chat-agent-pop-title">切换模式</p>
                  <div class="wzh-chat-agent-list" id="trainChatModeList" role="listbox" aria-label="切换模式"></div>
                </div>
              </div>
              <!-- 模型选择:弹层往上开(输入框已经贴着面板底了),内容由 initModelSwitch
                   按当前 Agent 的 models 渲染,所以每次打开都是这个 Agent 自己的型号 -->
              <div class="wzh-chat-model-wrap">
                <button class="wzh-chat-tool" id="trainChatModelBtn" type="button" title="切换模型"
                        aria-haspopup="listbox" aria-expanded="false">
                  <img src="../../src/pic/icon/model.svg" alt="">MS Insight Native-v4
                </button>
                <div class="wzh-chat-model-pop" id="trainChatModelPop" hidden>
                  <p class="wzh-chat-agent-pop-title">切换模型</p>
                  <div class="wzh-chat-agent-list" id="trainChatModelList" role="listbox" aria-label="切换模型"></div>
                </div>
              </div>
              <div class="wzh-chat-composer-actions">
                <button class="wzh-chat-clean-btn" id="trainChatCleanBtn" type="button" title="清空输入" aria-label="清空输入" hidden>
                  <span class="wzh-chat-clean-icon" aria-hidden="true"></span>
                </button>
                <span class="wzh-chat-clean-divider" id="trainChatCleanDivider" aria-hidden="true" hidden></span>
                <button class="wzh-chat-mic-btn" type="button" title="语音输入" aria-label="语音输入">
                  <img src="../../src/pic/icon/voice.svg" alt="">
                </button>
                <button class="wzh-chat-send-btn" id="trainChatSendBtn" type="button" title="发送" aria-label="发送">
                  <img src="../../src/pic/icon/sent.svg" alt="">
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="msi-resizer msi-resizer--v wzh-chat-viz-resizer" id="trainChatVizResizer"
             role="separator" aria-orientation="vertical" aria-label="调整对话与可视化宽度" tabindex="0" hidden></div>
        <section class="wzh-chat-viz-pane" id="trainChatVizPane" aria-label="回答信息可视化" hidden>
          <header class="wzh-chat-viz-head">
            <div class="wzh-chat-viz-tabs" id="trainChatVizTabs" role="tablist" aria-label="已打开的信息可视化"></div>
            <button class="wzh-chat-viz-close" id="trainChatVizCloseBtn" type="button" aria-label="关闭全部信息可视化" title="关闭全部信息可视化">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
            </button>
          </header>
          <div class="wzh-chat-viz-viewport" id="trainChatVizViewport"></div>
        </section>
      </aside>
      </div>
    </div>
  </section>

  <dialog class="msi-import-dialog" id="msiImportDialog" aria-labelledby="msiImportTitle">
    <div class="msi-import-head">
      <h2 id="msiImportTitle">选择或拖入文件</h2>
      <button class="msi-import-close" id="msiImportClose" type="button" aria-label="关闭导入弹窗" title="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"></path></svg>
      </button>
    </div>
    <div class="msi-import-body">
      <div class="msi-import-path-wrap">
        <label class="msi-import-path-label" for="msiImportPath">文件路径</label>
        <div class="msi-import-path-field">
          <textarea id="msiImportPath" rows="2" maxlength="4096" placeholder="输入文件夹路径" spellcheck="false">D:\</textarea>
          <button class="msi-import-clear" id="msiImportClear" type="button" aria-label="清空路径" title="清空路径" hidden>
            <span class="wzh-chat-clean-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div class="msi-import-browser" id="msiImportBrowser" role="tree" aria-label="D 盘或已选择目录的内容">
        <p class="msi-import-empty" id="msiImportEmpty">D:\ 尚未授权。点击此处在系统窗口中选择 D 盘或其子目录，也可拖入文件或文件夹。</p>
      </div>
      <input id="msiImportFolderInput" type="file" webkitdirectory directory multiple hidden>
    </div>
    <div class="msi-import-foot">
      <button class="msi-import-confirm" id="msiImportConfirm" type="button">确认</button>
      <button class="msi-import-cancel" id="msiImportCancel" type="button">取消</button>
    </div>
  </dialog>

  <script defer src="../theme.js"></script>
  <script defer src="../import-dialog.js"></script>
  <script defer src="../timeline-colors.js"></script>

  <!-- ── MindStudio Insight 工作台:左树(采集目录) + 内容区(泳道树 + 泳道) ── -->
  <!-- @overview-script -->
  <script defer src="../workbench.js"></script>

  <!-- ── 智能对话面板逻辑(原 js/training-chat-panel.js,已内联) ── -->
  <script defer src="../assistant.js"></script>

  <!-- ── 窗口控制:三条分隔条的拖动逻辑 ── -->
  <script defer src="../resizers.js"></script>
</body>
</html>
